// ─── Utils ───────────────────────────────────────────────────────────────────
function toLocalDate(d=new Date()){
  return[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
}
function parseDate(s){return s&&s.length===10?new Date(s+"T12:00:00"):new Date(s||Date.now());}
function fmtDate(s){return parseDate(s).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function fmtAgo(s){
  const d=Math.round((new Date()-parseDate(s))/86400000);
  if(d===0)return"today";if(d===1)return"yesterday";
  if(d<7)return`${d}d ago`;if(d<30)return`${Math.round(d/7)}wk ago`;
  return`${Math.round(d/30)}mo ago`;
}
function fmtCBTO(v){return`${parseFloat(v).toFixed(4)}"`;}
function uid(){return Math.random().toString(36).slice(2,9);}
function polarToCart(cx,cy,r,deg){const rad=deg*Math.PI/180;return[cx+r*Math.cos(rad),cy+r*Math.sin(rad)];}
function landArc(cx,cy,r,center,span){
  const[x1,y1]=polarToCart(cx,cy,r,center-span/2);
  const[x2,y2]=polarToCart(cx,cy,r,center+span/2);
  return`M ${x1.toFixed(3)},${y1.toFixed(3)} A ${r},${r} 0 0 1 ${x2.toFixed(3)},${y2.toFixed(3)}`;
}

// ─── Responsive hook ─────────────────────────────────────────────────────────
function useWindowSize(){
  const get=()=>({
    w: window.visualViewport ? window.visualViewport.width : window.innerWidth,
    h: window.visualViewport ? window.visualViewport.height : window.innerHeight,
  });
  const[size,setSize]=useState(get);
  useEffect(()=>{
    const fn=()=>setSize(get());
    // Use visualViewport if available — it does NOT fire on iOS keyboard open/close,
    // only on actual resize/orientation change. This prevents re-renders that break focus.
    const vp=window.visualViewport;
    if(vp){
      vp.addEventListener("resize",fn);
      return()=>vp.removeEventListener("resize",fn);
    } else {
      window.addEventListener("resize",fn);
      window.addEventListener("orientationchange",()=>setTimeout(fn,100));
      return()=>window.removeEventListener("resize",fn);
    }
  },[]);
  return size;
}

// ─── LineChart — outside App ──────────────────────────────────────────────────
function LineChart({data,xKey,yKey,color,yFmt,bdr,mut,mono}){
  if(!data||data.length<2)return null;
  const W=300,H=120,pl=44,pr=10,pt=8,pb=24;
  const xs=data.map(d=>d[xKey]),ys=data.map(d=>d[yKey]);
  const x0=Math.min(...xs),x1=Math.max(...xs);
  const y0=Math.min(...ys),y1=Math.max(...ys);
  const xr=x1-x0||1,yr=y1-y0||1;
  const px=x=>pl+(x-x0)/xr*(W-pl-pr);
  const py=y=>H-pb-(y-y0)/yr*(H-pt-pb);
  const pts=data.map(d=>`${px(d[xKey])},${py(d[yKey])}`).join(" ");
  return(
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:"block"}}>
      {[0,0.5,1].map(t=>{
        const yv=y0+t*yr;
        return <g key={t}>
          <line x1={pl} y1={py(yv)} x2={W-pr} y2={py(yv)} stroke={bdr} strokeWidth="0.5" strokeDasharray="3,3"/>
          <text x={pl-4} y={py(yv)+3.5} textAnchor="end" fontSize="8" fill={mut} fontFamily={mono}>{yFmt?yFmt(yv):Math.round(yv)}</text>
        </g>;
      })}
      {[data[0],data[data.length-1]].map((d,i)=>(
        <text key={i} x={px(d[xKey])} y={H-6} textAnchor={i===0?"start":"end"} fontSize="8" fill={mut} fontFamily={mono}>{d[xKey]}</text>
      ))}
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round"/>
      {data.map((d,i)=><circle key={i} cx={px(d[xKey])} cy={py(d[yKey])} r="3" fill={color}/>)}
    </svg>
  );
}

// ─── EventCard — outside App ──────────────────────────────────────────────────
function EventCard({ev,baseline,onDel,readOnly,T}){
  const[open,setOpen]=useState(false);
  const del=e=>{e.stopPropagation();onDel();};
  if(ev.type==="session"){
    const hasChron=ev.velocity||ev.es||ev.sd;
    const hasDetail=ev.conditions||ev.sessionNotes||ev.bullet||ev.powder||ev.primer||ev.brass;
    const expandable=hasChron||hasDetail||ev.groupSize;
    return(
      <div style={{background:T.surf,border:`1px solid ${T.bdr}`,borderRadius:8,overflow:"hidden",marginBottom:8}}>
        <div style={{display:"flex",alignItems:"flex-start",padding:"12px 14px",gap:10,cursor:expandable?"pointer":"default"}} onClick={()=>expandable&&setOpen(v=>!v)}>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
              <span style={{fontSize:13,fontWeight:500,color:T.text}}>{fmtDate(ev.date)}</span>
              {ev.suppressed&&<Badge label="Suppressed" color={T.blue} bg={T.blueBg} border={T.blueBdr}/>}
              {ev.loadName&&<Badge label={ev.loadName} color={T.acc} bg={T.accBg} border={T.accBdr}/>}
            </div>
            <div style={{fontSize:11,color:T.sub,marginTop:2}}>{fmtAgo(ev.date)}{ev.bullet?` · ${ev.bullet}`:""}</div>
            {hasChron&&<div style={{display:"flex",gap:10,marginTop:5,flexWrap:"wrap"}}>
              {ev.velocity&&<span style={{fontSize:12,fontFamily:T.mono,color:T.text}}>{Math.round(ev.velocity).toLocaleString()} fps</span>}
              {ev.es&&<span style={{fontSize:11,fontFamily:T.mono,color:T.sub}}>ES {ev.es}</span>}
              {ev.sd&&<span style={{fontSize:11,fontFamily:T.mono,color:T.sub}}>SD {ev.sd}</span>}
            </div>}
            {ev.groupSize&&<div style={{fontSize:11,color:T.sub,marginTop:3,fontFamily:T.mono}}>{ev.groupSize}" @ {ev.groupDistance||"?"}{ev.groupUnit||"yd"}</div>}
          </div>
          <div style={{fontSize:16,fontWeight:700,fontFamily:T.mono,color:T.text,flexShrink:0}}>{ev.shots} rds</div>
          {expandable&&<div style={{color:T.mut,transform:open?"rotate(90deg)":"none",transition:"transform .15s",alignSelf:"center"}}><Ic.Chev/></div>}
          {!readOnly&&<button onClick={del} style={{background:"none",border:"none",color:T.mut,cursor:"pointer",padding:"2px 0 0 4px",display:"flex",alignSelf:"flex-start"}}><Ic.Trash/></button>}
        </div>
        {open&&expandable&&<div style={{background:T.bg,borderTop:`1px solid ${T.bdr2}`,padding:"12px 14px",display:"flex",flexDirection:"column",gap:7}}>
          {ev.conditions&&<div style={{fontSize:12,color:T.sub}}><b style={{color:T.text,fontWeight:500}}>Conditions: </b>{ev.conditions}</div>}
          {(ev.powder||ev.bullet)&&<div style={{fontSize:12,color:T.sub}}><b style={{color:T.text,fontWeight:500}}>Load: </b>{[ev.bullet,ev.powder,ev.charge?`@ ${ev.charge}gr`:""].filter(Boolean).join(" / ")}</div>}
          {ev.primer&&<div style={{fontSize:12,color:T.sub}}><b style={{color:T.text,fontWeight:500}}>Primer: </b>{ev.primer}</div>}
          {ev.brass&&<div style={{fontSize:12,color:T.sub}}><b style={{color:T.text,fontWeight:500}}>Brass: </b>{ev.brass}</div>}
          {(ev.coal||ev.sessionCbto)&&<div style={{fontSize:12,color:T.sub,fontFamily:T.mono}}><b style={{color:T.text,fontWeight:500,fontFamily:T.sans}}>Seating: </b>{ev.coal?`COAL ${ev.coal}" `:""}{ev.sessionCbto?`CBTO ${ev.sessionCbto}"`:""}</div>}
          {ev.sessionNotes&&<div style={{fontSize:12,color:T.sub,lineHeight:1.65}}><b style={{color:T.text,fontWeight:500}}>Notes: </b>{ev.sessionNotes}</div>}
        </div>}
      </div>
    );
  }
  if(ev.type==="clean"){
    const has=ev.method||ev.observations;
    return(
      <div style={{background:T.surf,border:`1px solid ${T.blueBdr}`,borderRadius:8,overflow:"hidden",marginBottom:8}}>
        <div style={{display:"flex",alignItems:"flex-start",padding:"12px 14px",gap:10,cursor:has?"pointer":"default"}} onClick={()=>has&&setOpen(v=>!v)}>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
              <span style={{fontSize:13,fontWeight:500,color:T.text}}>{fmtDate(ev.date)}</span>
              <Badge label="Cleaning" color={T.blue} bg={T.blueBg} border={T.blueBdr}/>
            </div>
            <div style={{fontSize:11,color:T.sub,marginTop:2}}>{fmtAgo(ev.date)}{ev.solvents?` · ${ev.solvents}`:""}</div>
            {ev.passes&&<div style={{fontSize:11,color:T.sub,marginTop:2}}>{ev.passes} passes</div>}
          </div>
          {has&&<div style={{color:T.mut,transform:open?"rotate(90deg)":"none",transition:"transform .15s",alignSelf:"center"}}><Ic.Chev/></div>}
          {!readOnly&&<button onClick={del} style={{background:"none",border:"none",color:T.mut,cursor:"pointer",padding:"2px 0 0 4px",display:"flex",alignSelf:"flex-start"}}><Ic.Trash/></button>}
        </div>
        {open&&has&&<div style={{background:T.bg,borderTop:`1px solid ${T.bdr2}`,padding:"12px 14px",display:"flex",flexDirection:"column",gap:7}}>
          {ev.method&&<div style={{fontSize:12,color:T.sub}}><b style={{color:T.text,fontWeight:500}}>Method: </b>{ev.method}</div>}
          {ev.observations&&<div style={{fontSize:12,color:T.sub,lineHeight:1.65}}><b style={{color:T.text,fontWeight:500}}>Observations: </b>{ev.observations}</div>}
        </div>}
      </div>
    );
  }
  if(ev.type==="cbto"){
    const has=ev.comparator||ev.caliper||ev.notes;
    const delta=baseline&&ev.id!==baseline.id?(parseFloat(ev.measurement)-parseFloat(baseline.measurement)).toFixed(4):null;
    return(
      <div style={{background:T.surf,border:`1px solid ${T.accBdr}`,borderRadius:8,overflow:"hidden",marginBottom:8}}>
        <div style={{display:"flex",alignItems:"flex-start",padding:"12px 14px",gap:10,cursor:has?"pointer":"default"}} onClick={()=>has&&setOpen(v=>!v)}>
          <div style={{flex:1}}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span style={{fontSize:17,fontWeight:700,fontFamily:T.mono,color:T.text}}>{fmtCBTO(ev.measurement)}</span>
              <Badge label="CBTO" color={T.acc} bg={T.accBg} border={T.accBdr}/>
            </div>
            <div style={{fontSize:11,color:T.sub,marginTop:3}}>{fmtDate(ev.date)}{delta&&parseFloat(delta)>0?<span style={{fontFamily:T.mono}}> · +{delta}" from baseline</span>:""}</div>
          </div>
          {has&&<div style={{color:T.mut,transform:open?"rotate(90deg)":"none",transition:"transform .15s",alignSelf:"center"}}><Ic.Chev/></div>}
          {!readOnly&&<button onClick={del} style={{background:"none",border:"none",color:T.mut,cursor:"pointer",padding:"2px 0 0 4px",display:"flex",alignSelf:"flex-start"}}><Ic.Trash/></button>}
        </div>
        {open&&has&&<div style={{background:T.bg,borderTop:`1px solid ${T.bdr2}`,padding:"12px 14px",display:"flex",flexDirection:"column",gap:7}}>
          {ev.comparator&&<div style={{fontSize:12,color:T.sub}}><b style={{color:T.text,fontWeight:500}}>Comparator: </b>{ev.comparator}</div>}
          {ev.caliper&&<div style={{fontSize:12,color:T.sub}}><b style={{color:T.text,fontWeight:500}}>Caliper: </b>{ev.caliper}</div>}
          {ev.notes&&<div style={{fontSize:12,color:T.sub,lineHeight:1.65}}><b style={{color:T.text,fontWeight:500}}>Notes: </b>{ev.notes}</div>}
        </div>}
      </div>
    );
  }
  return null;
}

// ─── ReportView — outside App, Sec inlined ────────────────────────────────────
function ReportView({barrel,events,vw,T}){
  const sessions=events.filter(e=>e.barrelId===barrel.id&&e.type==="session").sort((a,b)=>a.date.localeCompare(b.date));
  const cleans  =events.filter(e=>e.barrelId===barrel.id&&e.type==="clean").sort((a,b)=>b.date.localeCompare(a.date));
  const cbtos   =events.filter(e=>e.barrelId===barrel.id&&e.type==="cbto").sort((a,b)=>a.date.localeCompare(b.date));
  const total   =sessions.reduce((s,e)=>s+e.shots,0);
  const pct     =barrel.lifeRounds?Math.min(100,(total/barrel.lifeRounds)*100):null;
  const lc      =lifeColor(pct,T);
  const lastClean=cleans[0];
  const rsc     =lastClean?sessions.filter(s=>s.date>lastClean.date).reduce((s,e)=>s+e.shots,0):total;
  const rc      =cleanColor(rsc,T);
  const curCbto =cbtos[cbtos.length-1];
  const baseCbto=cbtos[0];
  const erosion =curCbto&&baseCbto&&cbtos.length>1?(parseFloat(curCbto.measurement)-parseFloat(baseCbto.measurement)).toFixed(4):null;
  const velSess =sessions.filter(s=>s.velocity);
  const avgVel  =velSess.length?Math.round(velSess.reduce((s,e)=>s+e.velocity,0)/velSess.length):null;
  const avgES   =velSess.filter(s=>s.es).length?Math.round(velSess.filter(s=>s.es).reduce((s,e)=>s+e.es,0)/velSess.filter(s=>s.es).length):null;
  const avgSD   =velSess.filter(s=>s.sd).length?Math.round(velSess.filter(s=>s.sd).reduce((s,e)=>s+e.sd,0)/velSess.filter(s=>s.sd).length):null;
  const sThru   =date=>sessions.filter(s=>s.date<=date).reduce((s,e)=>s+e.shots,0);
  const cbtoChart=cbtos.length>=2?cbtos.map(c=>({rounds:sThru(c.date),cbto:parseFloat(c.measurement)})):[];
  const velChart =velSess.length>=2?velSess.map(s=>({rounds:sThru(s.date),velocity:s.velocity})):[];
  const grpSess  =[...sessions].filter(s=>s.groupSize).sort((a,b)=>b.date.localeCompare(a.date));
  // Sec label inlined — NOT a component to avoid remount bug
  const secStyle={fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.1em",color:T.sub,margin:"20px 0 10px"};
  const cols=vw>=768?"repeat(4,1fr)":"repeat(3,1fr)";
  return(
    <div style={{padding:"0 16px 40px"}}>
      {barrel.lifeRounds&&(
        <div style={{background:T.surf,border:`1px solid ${T.bdr}`,borderRadius:8,padding:"16px",marginTop:16}}>
          <div style={secStyle}>Barrel Life</div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:8}}>
            <div><span style={{fontSize:28,fontWeight:700,fontFamily:T.mono,color:lc}}>{total.toLocaleString()}</span><span style={{fontSize:14,color:T.sub,fontFamily:T.mono}}> / {barrel.lifeRounds.toLocaleString()}</span></div>
            <span style={{fontSize:13,fontWeight:700,color:lc,fontFamily:T.mono}}>{Math.round(pct)}%</span>
          </div>
          <div style={{height:6,background:T.bdr2,borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:lc,borderRadius:3}}/></div>
          <div style={{marginTop:8,fontSize:12,color:T.sub}}>{barrel.lifeRounds-total>0?`Approx. ${(barrel.lifeRounds-total).toLocaleString()} rounds remaining`:<span style={{color:T.lg.r,fontWeight:600}}>Past estimated life ceiling</span>}</div>
        </div>
      )}
      <div style={secStyle}>Summary</div>
      <div style={{display:"grid",gridTemplateColumns:cols,gap:8}}>
        {[{v:total.toLocaleString(),l:"Total Rounds"},{v:sessions.length,l:"Sessions"},{v:cleans.length,l:"Cleanings"},
          ...(avgVel?[{v:`${avgVel.toLocaleString()}`,l:"Avg Vel (fps)"}]:[]),
          ...(avgES?[{v:avgES,l:"Avg ES"}]:[]),
          ...(avgSD?[{v:avgSD,l:"Avg SD"}]:[]),
        ].map(({v,l})=>(
          <div key={l} style={{background:T.surf,border:`1px solid ${T.bdr}`,borderRadius:6,padding:"10px 12px"}}>
            <div style={{fontSize:19,fontWeight:700,fontFamily:T.mono,color:T.text,lineHeight:1}}>{v}</div>
            <div style={{fontSize:9,textTransform:"uppercase",letterSpacing:"0.08em",color:T.sub,marginTop:4}}>{l}</div>
          </div>
        ))}
      </div>
      <div style={secStyle}>Maintenance Status</div>
      <div style={{background:T.surf,border:`1px solid ${T.bdr}`,borderRadius:8,padding:"14px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={{fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em",color:T.sub,marginBottom:4}}>Since Last Cleaning</div><div style={{fontSize:28,fontWeight:700,fontFamily:T.mono,color:rc}}>{rsc.toLocaleString()}</div></div>
          <div style={{textAlign:"right"}}><div style={{fontSize:11,color:T.sub}}>Last cleaned</div><div style={{fontSize:12,color:T.text,marginTop:2}}>{lastClean?fmtDate(lastClean.date):"Not recorded"}</div>{lastClean&&lastClean.solvents&&<div style={{fontSize:11,color:T.sub,marginTop:2}}>{lastClean.solvents}</div>}</div>
        </div>
      </div>
      {curCbto&&<>
        <div style={secStyle}>Throat Condition</div>
        <div style={{background:T.accBg,border:`1px solid ${T.accBdr}`,borderRadius:8,padding:"16px"}}>
          <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:"0.1em",color:T.acc,fontWeight:600,marginBottom:8}}>Current CBTO to Lands</div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div><div style={{fontSize:34,fontWeight:700,fontFamily:T.mono,color:T.text,letterSpacing:"-0.02em"}}>{fmtCBTO(curCbto.measurement)}</div><div style={{fontSize:11,color:T.sub,marginTop:4}}>Measured {fmtDate(curCbto.date)}{curCbto.comparator?` · ${curCbto.comparator}`:""}</div></div>
            {erosion&&parseFloat(erosion)>0&&<div style={{textAlign:"right"}}><div style={{fontSize:10,textTransform:"uppercase",letterSpacing:"0.08em",color:T.sub,marginBottom:4}}>Total Erosion</div><div style={{fontSize:20,fontWeight:700,fontFamily:T.mono,color:T.sub}}>+{erosion}"</div><div style={{fontSize:10,color:T.sub,marginTop:2}}>from {fmtCBTO(baseCbto.measurement)}</div></div>}
          </div>
        </div>
        {cbtoChart.length>=2&&<div style={{background:T.surf,border:`1px solid ${T.bdr}`,borderRadius:8,padding:"14px",marginTop:8}}>
          <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:"0.1em",color:T.sub,marginBottom:10,fontWeight:500}}>Throat Erosion Trend</div>
          <LineChart data={cbtoChart} xKey="rounds" yKey="cbto" color={T.acc} yFmt={v=>v.toFixed(3)} bdr={T.bdr} mut={T.mut} mono={T.mono}/>
        </div>}
      </>}
      {velChart.length>=2&&<>
        <div style={secStyle}>Velocity Trend</div>
        <div style={{background:T.surf,border:`1px solid ${T.bdr}`,borderRadius:8,padding:"14px"}}>
          <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:"0.1em",color:T.sub,marginBottom:10,fontWeight:500}}>Avg Velocity Over Barrel Life</div>
          <LineChart data={velChart} xKey="rounds" yKey="velocity" color={T.blue} yFmt={v=>`${Math.round(v)}`} bdr={T.bdr} mut={T.mut} mono={T.mono}/>
        </div>
      </>}
      {grpSess.length>0&&<>
        <div style={secStyle}>Accuracy Log</div>
        <div style={{background:T.surf,border:`1px solid ${T.bdr}`,borderRadius:8,overflow:"hidden"}}>
          <div style={{display:"flex",padding:"7px 14px",background:T.bg,borderBottom:`1px solid ${T.bdr2}`}}>
            {["Date","Group","Distance","Shots"].map((h,i)=><span key={h} style={{flex:i===0?2:1,fontSize:9,color:T.sub,textTransform:"uppercase",letterSpacing:"0.08em",textAlign:i>0?"center":"left"}}>{h}</span>)}
          </div>
          {grpSess.map(s=>(
            <div key={s.id} style={{display:"flex",padding:"9px 14px",borderBottom:`1px solid ${T.bdr2}`,alignItems:"center"}}>
              <span style={{flex:2,fontSize:12,color:T.text}}>{fmtDate(s.date)}</span>
              <span style={{flex:1,fontSize:12,fontFamily:T.mono,color:T.text,textAlign:"center"}}>{s.groupSize}"</span>
              <span style={{flex:1,fontSize:12,fontFamily:T.mono,color:T.sub,textAlign:"center"}}>{s.groupDistance||"?"}{s.groupUnit||"yd"}</span>
              <span style={{flex:1,fontSize:12,fontFamily:T.mono,color:T.sub,textAlign:"center"}}>{s.shots}</span>
            </div>
          ))}
        </div>
      </>}
      {cleans.length>0&&<>
        <div style={secStyle}>Cleaning History</div>
        <div style={{background:T.surf,border:`1px solid ${T.bdr}`,borderRadius:8,overflow:"hidden"}}>
          {cleans.slice(0,5).map(c=>(
            <div key={c.id} style={{padding:"10px 14px",borderBottom:`1px solid ${T.bdr2}`}}>
              <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:12,fontWeight:500,color:T.text}}>{fmtDate(c.date)}</span>{c.passes&&<span style={{fontSize:11,fontFamily:T.mono,color:T.sub}}>{c.passes} passes</span>}</div>
              {c.solvents&&<div style={{fontSize:11,color:T.sub,marginTop:3}}>{c.solvents}</div>}
              {c.method&&<div style={{fontSize:11,color:T.sub,marginTop:2}}>{c.method}</div>}
              {c.observations&&<div style={{fontSize:11,color:T.sub,marginTop:3,lineHeight:1.5}}>{c.observations}</div>}
            </div>
          ))}
        </div>
      </>}
      {sessions.length===0&&cleans.length===0&&cbtos.length===0&&<div style={{textAlign:"center",padding:"48px 0",color:T.mut,fontSize:11,textTransform:"uppercase",letterSpacing:"0.1em"}}>No data logged yet</div>}
    </div>
  );
}

// ─── Exports ─────────────────────────────────────────────────────────────────
function exportCSV(barrel,events){
  const sess=events.filter(e=>e.barrelId===barrel.id&&e.type==="session").sort((a,b)=>b.date.localeCompare(a.date));
  const cln =events.filter(e=>e.barrelId===barrel.id&&e.type==="clean").sort((a,b)=>b.date.localeCompare(a.date));
  const cbto=events.filter(e=>e.barrelId===barrel.id&&e.type==="cbto").sort((a,b)=>b.date.localeCompare(a.date));
  const rows=[
    ["SHOT LOG"],["Date","Shots","Suppressed","Load","Bullet","Powder","Charge (gr)","Primer","Brass","COAL","CBTO","Velocity (fps)","ES","SD","Group (in)","Distance","Conditions","Notes"],
    ...sess.map(s=>[fmtDate(s.date),s.shots,s.suppressed?"Yes":"",s.loadName||"",s.bullet||"",s.powder||"",s.charge||"",s.primer||"",s.brass||"",s.coal||"",s.sessionCbto||"",s.velocity||"",s.es||"",s.sd||"",s.groupSize||"",s.groupDistance?`${s.groupDistance}${s.groupUnit||"yd"}`:"",s.conditions||"",s.sessionNotes||""]),
    [""],["CLEANING LOG"],["Date","Solvents","Method","Passes","Observations"],
    ...cln.map(c=>[fmtDate(c.date),c.solvents||"",c.method||"",c.passes||"",c.observations||""]),
    [""],["CBTO / LANDS"],["Date","CBTO (in)","Comparator","Caliper","Notes"],
    ...cbto.map(r=>[fmtDate(r.date),parseFloat(r.measurement).toFixed(4),r.comparator||"",r.caliper||"",r.notes||""]),
  ];
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`${barrel.name.replace(/\s+/g,"_")}_borely.csv`;a.click();
}

function exportPDF(barrel,events){
  const sess =events.filter(e=>e.barrelId===barrel.id&&e.type==="session").sort((a,b)=>b.date.localeCompare(a.date));
  const cln  =events.filter(e=>e.barrelId===barrel.id&&e.type==="clean").sort((a,b)=>b.date.localeCompare(a.date));
  const cbtos=events.filter(e=>e.barrelId===barrel.id&&e.type==="cbto").sort((a,b)=>a.date.localeCompare(b.date));
  const total=sess.reduce((s,e)=>s+e.shots,0);
  const lc=cln[0],rsc=lc?sess.filter(s=>s.date>lc.date).reduce((s,e)=>s+e.shots,0):total;
  const cur=cbtos[cbtos.length-1],base=cbtos[0];
  const eros=cur&&base&&cbtos.length>1?(parseFloat(cur.measurement)-parseFloat(base.measurement)).toFixed(4):null;
  const pct=barrel.lifeRounds?Math.min(100,Math.round((total/barrel.lifeRounds)*100)):null;
  const lcolor=pct===null?"#2e4e24":pct<60?"#2e4e24":pct<80?"#5a4a00":pct<90?"#6a2e00":"#6a0e0e";
  const tr=(cells,tag="td")=>cells.map(c=>`<${tag}>${c}</${tag}>`).join("");
  const sRows=sess.map(s=>`<tr>${tr([fmtDate(s.date),s.shots,s.loadName||"",s.velocity?Math.round(s.velocity)+" fps":"",s.es||"",s.sd||"",s.groupSize?`${s.groupSize}"@${s.groupDistance||"?"}${s.groupUnit||"yd"}`:"",s.suppressed?"✓":"",s.bullet||"",s.powder||(s.charge?`${s.charge}gr`:""),s.primer||"",s.brass||"",s.conditions||""])}</tr>`).join("");
  const cRows=cln.map(c=>`<tr>${tr([fmtDate(c.date),c.solvents||"—",c.method||"—",c.passes||"—",c.observations||"—"])}</tr>`).join("");
  const rRows=[...cbtos].reverse().map(r=>`<tr>${tr([fmtDate(r.date),`<span style="font-family:monospace">${parseFloat(r.measurement).toFixed(4)}"</span>`,r.comparator||"—",r.caliper||"—",r.notes||"—"])}</tr>`).join("");
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"/><title>Borely · ${barrel.name}</title><style>body{font-family:system-ui,sans-serif;margin:40px;font-size:11px;color:#0a0908;line-height:1.5}.brand{font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#2e4e24}h1{font-size:22px;font-weight:700;margin:0 0 3px}h2{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#3a3630;margin:22px 0 8px;border-bottom:1px solid #888070;padding-bottom:5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;background:#f0eee8;border-radius:4px;margin-bottom:6px}.sv{font-size:16px;font-weight:700;font-family:monospace}.sl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#3a3630;margin-top:2px}.bar{height:5px;background:#b0a898;border-radius:3px;margin:6px 0 10px}.barfill{height:100%;border-radius:3px}table{width:100%;border-collapse:collapse;font-size:10px}th{text-align:left;padding:5px 6px;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#3a3630;border-bottom:1px solid #888070}td{padding:5px 6px;border-bottom:1px solid #b0a898;vertical-align:top}@media print{body{margin:20px}}</style></head><body><div class="brand">Borely</div><h1>${barrel.name}</h1><div style="font-size:11px;color:#3a3630;margin-bottom:14px">${[barrel.caliber,barrel.notes].filter(Boolean).join("·")||"—"}·${new Date().toLocaleDateString()}</div>${barrel.status==="transferred"?`<div style="background:#f0ddb8;border:1px solid #b8903a;border-radius:4px;padding:8px 12px;margin-bottom:14px;font-size:10px;color:#6a4a10"><b>TRANSFERRED</b>·${fmtDate(barrel.transferredDate)}</div>`:""}<div class="grid"><div><div class="sv">${total.toLocaleString()}</div><div class="sl">Total Rounds</div></div><div><div class="sv">${sess.length}</div><div class="sl">Sessions</div></div><div><div class="sv">${cln.length}</div><div class="sl">Cleanings</div></div><div><div class="sv">${rsc.toLocaleString()}</div><div class="sl">Since Clean</div></div>${cur?`<div><div class="sv" style="font-family:monospace">${parseFloat(cur.measurement).toFixed(4)}"</div><div class="sl">CBTO</div></div>`:""}${eros&&parseFloat(eros)>0?`<div><div class="sv" style="font-family:monospace">+${eros}"</div><div class="sl">Erosion</div></div>`:""}${pct!==null?`<div><div class="sv" style="color:${lcolor}">${pct}%</div><div class="sl">Life Used</div></div>`:""}${barrel.lifeRounds?`<div><div class="sv">${Math.max(0,barrel.lifeRounds-total).toLocaleString()}</div><div class="sl">Remaining</div></div>`:""}</div>${pct!==null?`<div class="bar"><div class="barfill" style="width:${pct}%;background:${lcolor}"></div></div>`:""}<h2>Shot Log</h2><table><thead><tr>${tr(["Date","Shots","Load","Vel","ES","SD","Group","Supp","Bullet","Powder","Primer","Brass","Conditions"],"th")}</tr></thead><tbody>${sRows||`<tr><td colspan="13" style="color:#6a6460">No sessions</td></tr>`}</tbody></table><h2>Cleaning Log</h2><table><thead><tr>${tr(["Date","Solvents","Method","Passes","Observations"],"th")}</tr></thead><tbody>${cRows||`<tr><td colspan="5" style="color:#6a6460">No cleanings</td></tr>`}</tbody></table><h2>CBTO / Lands</h2><table><thead><tr>${tr(["Date","CBTO","Comparator","Caliper","Notes"],"th")}</tr></thead><tbody>${rRows||`<tr><td colspan="5" style="color:#6a6460">No readings</td></tr>`}</tbody></table></body></html>`;
  const w=window.open(URL.createObjectURL(new Blob([html],{type:"text/html"})));
  if(w)setTimeout(()=>w.print(),600);
}

function exportBarrelPack(barrel,events){
