// ─── Splash ──────────────────────────────────────────────────────────────────
function Splash({onDone}){
  const[fading,setFading]=useState(false);
  useEffect(()=>{
    const t1=setTimeout(()=>setFading(true),1800);
    const t2=setTimeout(onDone,2400);
    return()=>{clearTimeout(t1);clearTimeout(t2);};
  },[]);
  return(
    <div style={{position:"fixed",inset:0,zIndex:200,background:"#0C0B0A",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",opacity:fading?0:1,transition:"opacity 0.55s ease",userSelect:"none"}}>
      <img src={BORELY_LOGO_URI} width="220" height="220" style={{display:"block",marginBottom:12,borderRadius:"50%",boxShadow:"0 0 0 6px rgba(255,255,255,0.08)"}} alt="Borely logo"/>
      <div style={{textAlign:"center"}}>
        <div style={{fontSize:28,fontWeight:800,letterSpacing:"0.14em",color:"#FFFFFF",lineHeight:1,fontFamily:"-apple-system,BlinkMacSystemFont,system-ui,sans-serif"}}>
          <span style={{color:"#C8C4BC"}}>BORE</span><span style={{color:"#2EC4B6"}}>LY</span>
        </div>
        <div style={{fontSize:10,letterSpacing:"0.18em",textTransform:"uppercase",color:"rgba(255,255,255,0.28)",marginTop:9,fontFamily:"-apple-system,BlinkMacSystemFont,system-ui,sans-serif"}}>Barrel life, precisely tracked</div>
      </div>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App(){
  const importRef=useRef(null);
  const{w:vw}=useWindowSize();
  const wide=vw>=768,maxW=wide?Math.min(vw,960):vw,pad=wide?28:16;

  const[darkMode,setDarkMode]=useState(()=>{try{return localStorage.getItem("borely_dark")==="1";}catch{return false;}});
  const T=darkMode?DARK:HC;
  const A=useMemo(()=>makeAtoms(T,darkMode),[darkMode]);
  const toggleDark=()=>{const n=!darkMode;setDarkMode(n);document.body.style.background=n?DARK.bg:HC.bg;try{localStorage.setItem("borely_dark",n?"1":"0");}catch{}};
  useEffect(()=>{document.body.style.background=T.bg;},[darkMode]);

  const[barrels,  setBarrels]  =useState(()=>{try{const s=localStorage.getItem("borely_barrels");return s?JSON.parse(s):[];}catch{return[];}});
  const[events,   setEvents]   =useState(()=>{try{const s=localStorage.getItem("borely_events");return s?JSON.parse(s):[];}catch{return[];}});
  const[calibers, setCalibers] =useState(()=>{try{const s=localStorage.getItem("borely_calibers");return s?JSON.parse(s):[];}catch{return[];}});
  const[loads,    setLoads]    =useState(()=>{try{const s=localStorage.getItem("borely_loads");return s?JSON.parse(s):[];}catch{return[];}});
  const[splash,   setSplash]   =useState(true);

  useEffect(()=>{try{localStorage.setItem("borely_barrels",JSON.stringify(barrels));}catch{}},[barrels]);
  useEffect(()=>{try{localStorage.setItem("borely_events",JSON.stringify(events));}catch{}},[events]);
  useEffect(()=>{try{localStorage.setItem("borely_calibers",JSON.stringify(calibers));}catch{}},[calibers]);
  useEffect(()=>{try{localStorage.setItem("borely_loads",JSON.stringify(loads));}catch{}},[loads]);

  const[view,         setView]         =useState("home");
  const[activeId,     setActiveId]     =useState(null);
  const[tab,          setTab]          =useState("timeline");
  const[modal,        setModal]        =useState(null);
  const[confDel,      setConfDel]      =useState(false);
  const[confTransfer, setConfTransfer] =useState(false);
  const[fromDetail,   setFromDetail]   =useState(false);
  // session
  const[fShots,setFShots]=useState(1);
  const[fDate, setFDate] =useState(toLocalDate());
  const[fSupp, setFSupp] =useState(false);
  const[fLoadSel,setFLoadSel]=useState("manual");
  const[fBul,  setFBul]  =useState("");const[fPow,setFPow]=useState("");const[fChg,setFChg]=useState("");
  const[fPrim, setFPrim] =useState("");const[fBrass,setFBrass]=useState("");
  const[fCoal, setFCoal] =useState("");const[fSCbto,setFSCbto]=useState("");
  const[fVel,  setFVel]  =useState("");const[fES,setFES]=useState("");const[fSD,setFSD]=useState("");
  const[fGrp,  setFGrp]  =useState("");const[fGrpD,setFGrpD]=useState("");const[fGrpU,setFGrpU]=useState("yd");
  const[fCond, setFCond] =useState("");const[fNts,setFNts]=useState("");
  const[fTgt,  setFTgt]  =useState(null);const[evType,setEvType]=useState("session");
  // clean
  const[cDate, setCDate] =useState(toLocalDate());const[cQuick,setCQuick]=useState(true);
  const[cSolv, setCSolv] =useState("");const[cMeth,setCMeth]=useState("");const[cPass,setCPass]=useState("");const[cObs,setCObs]=useState("");
  // cbto
  const[xVal,  setXVal]  =useState("");const[xDate,setXDate]=useState(toLocalDate());
  const[xComp, setXComp] =useState("");const[xCal,setXCal]=useState("");const[xNts,setXNts]=useState("");
  // barrel form
  const[bName, setBName] =useState("");const[bCal,setBCal]=useState("");const[bCalId,setBCalId]=useState(""); // "" = unset, caliber.id = library pick, "other" = manual
  const[bNts,setBNts]=useState("");const[bLife,setBLife]=useState("");
  const[bShowC,setBShowC]=useState(false);const[bCbtoV,setBCbtoV]=useState("");const[bCbtoD,setBCbtoD]=useState(toLocalDate());
  const[bComp, setBComp] =useState("");const[bCalip,setBCalip]=useState("");const[bCbtoN,setBCbtoN]=useState("");
  // load form
  const[lId,    setLId]    =useState(null);
  const[lCalId, setLCalId] =useState(null); // caliber ID (first-class object)
  const[lName,  setLName]  =useState("");
  const[lBul,   setLBul]   =useState("");const[lPow,setLPow]=useState("");const[lChg,setLChg]=useState("");
  const[lPrim,  setLPrim]  =useState("");const[lBrass,setLBrass]=useState("");
  const[lCoal,  setLCoal]  =useState("");const[lCbto,setLCbto]=useState("");const[lVel,setLVel]=useState("");const[lNts,setLNts]=useState("");
  // caliber form
  const[newCalName,setNewCalName]=useState("");

  // helpers
  const sessFor  =id=>events.filter(e=>e.barrelId===id&&e.type==="session");
  const cleansFor=id=>events.filter(e=>e.barrelId===id&&e.type==="clean").sort((a,b)=>b.date.localeCompare(a.date));
  const cbtosFor =id=>events.filter(e=>e.barrelId===id&&e.type==="cbto").sort((a,b)=>a.date.localeCompare(b.date));
  const allFor   =id=>events.filter(e=>e.barrelId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const totalRnds=id=>sessFor(id).reduce((s,e)=>s+e.shots,0);
  const rsc      =id=>{const c=cleansFor(id)[0];return c?sessFor(id).filter(s=>s.date>c.date).reduce((s,e)=>s+e.shots,0):totalRnds(id);};
  const barrel   =barrels.find(b=>b.id===activeId);
  const loadsForCal=cal=>{
    // Match caliber by name (barrel.caliber is still a string)
    const calObj=calibers.find(c=>c.name.trim().toLowerCase()===cal.trim().toLowerCase());
    if(calObj)return loads.filter(l=>l.caliberId===calObj.id);
    // Fallback: old loads with caliber string field only
    return loads.filter(l=>l.caliber?.trim().toLowerCase()===cal.trim().toLowerCase());
  };
  const lastUsedLoad=cal=>{
    const calObj=calibers.find(c=>c.name.trim().toLowerCase()===cal.trim().toLowerCase());
    const cs=events.filter(e=>e.type==="session"&&e.loadId).sort((a,b)=>b.date.localeCompare(a.date));
    for(const s of cs){
      const l=loads.find(x=>x.id===s.loadId&&(calObj?x.caliberId===calObj.id:x.caliber?.trim().toLowerCase()===cal.trim().toLowerCase()));
      if(l)return l;
    }
    return null;
  };
  const applyLoad=l=>{if(!l)return;setFBul(l.bullet||"");setFPow(l.powder||"");setFChg(l.charge||"");setFPrim(l.primer||"");setFBrass(l.brass||"");setFCoal(l.coal||"");setFSCbto(l.cbto||"");setFVel(l.velocity||"");};
  const clearLF  =()=>{setFBul("");setFPow("");setFChg("");setFPrim("");setFBrass("");setFCoal("");setFSCbto("");setFVel("");};

  useEffect(()=>{if(!barrel&&view==="detail")setView("home");},[barrel,view]);

  if(splash)return <Splash onDone={()=>setSplash(false)}/>;

  const tgtBarrel=barrels.find(b=>b.id===fTgt);
  const calLoads =tgtBarrel?.caliber?loadsForCal(tgtBarrel.caliber):[];

  // openers
  const resetSess=()=>{setFShots(1);setFDate(toLocalDate());setFSupp(false);setFLoadSel("manual");clearLF();setFES("");setFSD("");setFGrp("");setFGrpD("");setFGrpU("yd");setFCond("");setFNts("");};
  const resetClean=()=>{setCDate(toLocalDate());setCQuick(true);setCSolv("");setCMeth("");setCPass("");setCObs("");};
  const resetCbto =()=>{setXVal("");setXDate(toLocalDate());setXComp("");setXCal("");setXNts("");};
  const resetLoad=(calId=null)=>{setLId(null);setLCalId(calId);setLName("");setLBul("");setLPow("");setLChg("");setLPrim("");setLBrass("");setLCoal("");setLCbto("");setLVel("");setLNts("");};
  const addCaliber=()=>{
    if(!newCalName.trim())return;
    // Prevent duplicate caliber names
    if(calibers.some(c=>c.name.trim().toLowerCase()===newCalName.trim().toLowerCase())){alert("That caliber already exists.");return;}
    setCalibers(p=>[...p,{id:uid(),name:newCalName.trim(),created:toLocalDate()}]);
    setNewCalName("");setModal("loads");
  };
  const delCaliber=id=>{
    setCalibers(p=>p.filter(c=>c.id!==id));
    setLoads(p=>p.filter(l=>l.caliberId!==id));
  };

  const openQuickSess=(id,e)=>{
    e&&e.stopPropagation();setFTgt(id);resetSess();
    const b=barrels.find(x=>x.id===id);
    if(b?.caliber){const l=lastUsedLoad(b.caliber);if(l){setFLoadSel(l.id);applyLoad(l);}}
    setEvType("session");setFromDetail(false);setModal("event");
  };
  const openDetailEv=()=>{
    setFTgt(activeId);resetSess();resetClean();resetCbto();
    if(barrel?.caliber){const l=lastUsedLoad(barrel.caliber);if(l){setFLoadSel(l.id);applyLoad(l);}}
    setEvType("session");setFromDetail(true);setModal("event");
  };

  // mutations
  const addBarrel=()=>{
    if(!bName.trim())return;
    const id=uid();
    setBarrels(p=>[...p,{id,name:bName.trim(),caliber:bCal.trim(),notes:bNts.trim(),lifeRounds:bLife?parseInt(bLife):null,created:toLocalDate(),status:"active"}]);
    if(bShowC&&bCbtoV){const v=parseFloat(bCbtoV);if(!isNaN(v)&&v>0)setEvents(p=>[...p,{id:uid(),barrelId:id,type:"cbto",date:bCbtoD,measurement:v,comparator:bComp.trim(),caliper:bCalip.trim(),notes:bCbtoN.trim()}]);}
    setBName("");setBCal("");setBCalId("");setBNts("");setBLife("");setBShowC(false);setBCbtoV("");setBCbtoD(toLocalDate());setBComp("");setBCalip("");setBCbtoN("");setModal(null);
  };
  const addSession=()=>{
    if(!fTgt||fShots<1)return;
    const sl=loads.find(l=>l.id===fLoadSel);
    setEvents(p=>[...p,{id:uid(),barrelId:fTgt,type:"session",date:fDate,shots:fShots,suppressed:fSupp,loadId:sl?.id||null,loadName:sl?.name||null,bullet:fBul.trim(),powder:fPow.trim(),charge:fChg.trim(),primer:fPrim.trim(),brass:fBrass.trim(),coal:fCoal.trim(),sessionCbto:fSCbto.trim(),velocity:fVel?parseFloat(fVel):null,es:fES?parseFloat(fES):null,sd:fSD?parseFloat(fSD):null,groupSize:fGrp?parseFloat(fGrp):null,groupDistance:fGrpD?parseFloat(fGrpD):null,groupUnit:fGrpU,conditions:fCond.trim(),sessionNotes:fNts.trim()}]);
    setModal(null);
  };
  const addClean=()=>{if(!activeId)return;setEvents(p=>[...p,{id:uid(),barrelId:activeId,type:"clean",date:cDate,solvents:cSolv.trim(),method:cMeth.trim(),passes:cPass?parseInt(cPass):null,observations:cObs.trim()}]);setModal(null);};
  const addCbto =()=>{const v=parseFloat(xVal);if(!activeId||isNaN(v)||v<=0)return;setEvents(p=>[...p,{id:uid(),barrelId:activeId,type:"cbto",date:xDate,measurement:v,comparator:xComp.trim(),caliper:xCal.trim(),notes:xNts.trim()}]);setModal(null);};
  const saveLoad=()=>{
    if(!lCalId||!lBul.trim())return;
    const calObj=calibers.find(c=>c.id===lCalId);
    const e={id:lId||uid(),caliberId:lCalId,caliber:calObj?.name||"",name:lName.trim()||`${lBul.trim()}${lPow.trim()?` / ${lPow.trim()}`:""}`,bullet:lBul.trim(),powder:lPow.trim(),charge:lChg.trim(),primer:lPrim.trim(),brass:lBrass.trim(),coal:lCoal.trim(),cbto:lCbto.trim(),velocity:lVel.trim(),notes:lNts.trim(),created:toLocalDate()};
    if(lId){setLoads(p=>p.map(l=>l.id===lId?e:l));}else{setLoads(p=>[...p,e]);}
    setModal("loads");
  };
  const delEvent =id=>setEvents(p=>p.filter(e=>e.id!==id));
  const delBarrel=()=>{setBarrels(p=>p.filter(b=>b.id!==activeId));setEvents(p=>p.filter(e=>e.barrelId!==activeId));setView("home");setConfDel(false);};
  const delLoad  =id=>setLoads(p=>p.filter(l=>l.id!==id));
  const doTransfer=()=>{exportBarrelPack(barrel,events);setBarrels(p=>p.map(b=>b.id===activeId?{...b,status:"transferred",transferredDate:toLocalDate()}:b));setConfTransfer(false);};

  const handleImport=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(!p.throat_barrel_pack){alert("Not a valid Throat barrel pack.");return;}const nid=uid();setBarrels(pp=>[...pp,{...p.barrel,id:nid,status:"active",transferredDate:undefined}]);setEvents(pp=>[...pp,...p.events.map(ev=>({...ev,id:uid(),barrelId:nid}))]);}catch{alert("Could not read barrel pack.");}};
    reader.readAsText(file);e.target.value="";
  };

  // ── Form helpers — called as functions, NOT as JSX components ─────────────
  // This is the key architectural decision: defining them here (so they close
  // over state) but calling them as functions so React never sees them as
  // component types that could change between renders.

  const lbl=s=><label style={A.lbl}>{s}</label>;
  // Use A.inp directly rather than spreading — avoids creating new style objects each render
  const inp=(v,sv,ph)=><input style={A.inp} value={v} onChange={e=>sv(e.target.value)} placeholder={ph}/>;
  const inpM=(v,sv,ph)=><input style={A.inpM} value={v} onChange={e=>sv(e.target.value)} placeholder={ph} inputMode="decimal"/>;
  const ta=(v,sv,ph)=><textarea style={A.ta} value={v} onChange={e=>sv(e.target.value)} placeholder={ph}/>;

  const secH=title=><div style={{fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.1em",color:T.sub,margin:"16px 0 12px"}}>{title}</div>;
  const divider=<div style={A.div}/>;
  const row2=(a,b)=><div style={{display:"flex",gap:8}}>{a}{b}</div>;
  const row3=(a,b,c)=><div style={{display:"flex",gap:8}}>{a}{b}{c}</div>;
  const col=(flex,children)=><div style={{flex}}>{children}</div>;

  const toggle=(label,val,setVal)=>(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <span style={{fontSize:13,color:T.text}}>{label}</span>
      <button onClick={()=>setVal(v=>!v)} style={{width:44,height:26,borderRadius:13,background:val?T.acc:T.bdr,border:"none",cursor:"pointer",position:"relative",transition:"background .2s",flexShrink:0}}>
        <div style={{position:"absolute",top:3,left:val?20:3,width:20,height:20,borderRadius:"50%",background:"#fff",transition:"left .2s",boxShadow:"0 1px 3px rgba(0,0,0,.25)"}}/>
      </button>
    </div>
  );

  const stepper=()=>(
    <>
      {lbl("Rounds Fired")}
      <div style={{display:"flex",alignItems:"center",border:`1px solid ${T.bdr}`,borderRadius:6,overflow:"hidden",marginBottom:10}}>
        <button style={{width:52,height:50,background:"transparent",border:"none",color:T.sub,fontSize:24,cursor:"pointer"}} onClick={()=>setFShots(s=>Math.max(1,s-1))}>−</button>
        <div style={{flex:1,textAlign:"center",fontSize:28,fontWeight:700,fontFamily:T.mono,color:T.text}}>{fShots}</div>
        <button style={{width:52,height:50,background:"transparent",border:"none",color:T.sub,fontSize:24,cursor:"pointer"}} onClick={()=>setFShots(s=>s+1)}>+</button>
      </div>
      <div style={{display:"flex",gap:6,marginBottom:16}}>
        {[5,10,20,50].map(n=>(
          <button key={n} onClick={()=>setFShots(n)} style={{flex:1,background:fShots===n?T.acc:T.bg,color:fShots===n?"#fff":T.sub,border:`1px solid ${fShots===n?T.acc:T.bdr}`,borderRadius:6,padding:"7px 0",fontSize:13,cursor:"pointer",fontFamily:T.mono,fontWeight:500}}>{n}</button>
        ))}
      </div>
    </>
  );

  // Session form — called as sessionForm(), not <SessionForm/>
  const sessionForm=()=>(
    <>
      {stepper()}
      {lbl("Date Fired")}
      <input type="date" max={toLocalDate()} value={fDate} onChange={e=>setFDate(e.target.value)} style={A.inpDate}/>
      {fDate!==toLocalDate()&&<div style={{fontSize:11,color:T.acc,marginTop:-10,marginBottom:14}}>↑ Backdated — {fmtAgo(fDate)}</div>}
      {toggle("Suppressed",fSupp,setFSupp)}
      {divider}
      {secH("Load Data")}
      {calLoads.length>0&&(
        <div style={{marginBottom:14}}>
          {lbl("Saved Load")}
          <select style={A.sel} value={fLoadSel} onChange={e=>{const v=e.target.value;setFLoadSel(v);if(v==="manual")clearLF();else{const l=loads.find(x=>x.id===v);if(l)applyLoad(l);}}}>
            <option value="manual">Enter manually</option>
            {calLoads.map(l=><option key={l.id} value={l.id}>{l.name}{l.velocity?` · ${l.velocity} fps`:""}</option>)}
          </select>
          {fLoadSel!=="manual"&&<div style={{fontSize:11,color:T.acc,marginTop:-10,marginBottom:10}}>↑ Fields populated — edit as needed</div>}
        </div>
      )}
      {lbl("Bullet")}{inp(fBul,setFBul,"e.g. Berger 140gr Hybrid Target")}
      {row2(col(2,<>{lbl("Powder")}{inp(fPow,setFPow,"e.g. H4350")}</>),col(1,<>{lbl("Charge (gr)")}{inpM(fChg,setFChg,"41.5")}</>))}
      {row2(col(1,<>{lbl("Primer")}{inp(fPrim,setFPrim,"Fed 210M")}</>),col(1,<>{lbl("Brass")}{inp(fBrass,setFBrass,"Lapua")}</>))}
      {row2(col(1,<>{lbl("COAL (in)")}{inpM(fCoal,setFCoal,"2.9100")}</>),col(1,<>{lbl("CBTO (in)")}{inpM(fSCbto,setFSCbto,"2.8450")}</>))}
      {divider}{secH("Chronograph")}
      {row3(col(1,<>{lbl("Avg Vel")}{inpM(fVel,setFVel,"2847")}</>),col(1,<>{lbl("ES")}{inpM(fES,setFES,"12")}</>),col(1,<>{lbl("SD")}{inpM(fSD,setFSD,"4")}</>))}
      {divider}{secH("Accuracy")}
      {row3(col(1,<>{lbl('Group (in)')}{inpM(fGrp,setFGrp,"0.375")}</>),col(1,<>{lbl("Distance")}{inpM(fGrpD,setFGrpD,"100")}</>),col(1,<>{lbl("Unit")}<select style={A.sel} value={fGrpU} onChange={e=>setFGrpU(e.target.value)}><option value="yd">yd</option><option value="m">m</option></select></>))}
      {divider}
      {lbl("Conditions")}{inp(fCond,setFCond,"Temp, wind, altitude, mirage…")}
      {lbl("Session Notes")}{ta(fNts,setFNts,"POI shifts, load behavior, barrel temp…")}
      <button style={A.btnP} onClick={addSession}>Log {fShots} Round{fShots!==1?"s":""}{fDate!==toLocalDate()?` · ${fmtDate(fDate)}`:""}</button>
    </>
  );

  const cleanForm=()=>(
    <>
      {lbl("Date Cleaned")}
      <input type="date" max={toLocalDate()} value={cDate} onChange={e=>setCDate(e.target.value)} style={A.inpDate}/>
      {toggle("Quick log (date + solvents only)",cQuick,setCQuick)}
      {lbl("Solvents Used")}{inp(cSolv,setCSolv,"e.g. Wipe-Out foam, Sweet's 7.62")}
      {!cQuick&&<>
        {lbl("Method")}{inp(cMeth,setCMeth,"e.g. Rod + bore guide, Tipton patches")}
        {lbl("Passes")}<input style={A.inpM} value={cPass} onChange={e=>setCPass(e.target.value)} placeholder="8" inputMode="numeric"/>
        {lbl("Observations")}{ta(cObs,setCObs,"Patch color, copper fouling, carbon ring, muzzle crown…")}
      </>}
      <button style={A.btnP} onClick={addClean}>Log Cleaning</button>
    </>
  );

  const cbtoForm=()=>(
    <>
      <div style={{fontSize:12,color:T.sub,lineHeight:1.7,marginBottom:16}}>Record CBTO from cartridge base to bullet ogive at the lands.</div>
      {lbl("CBTO to Lands (inches)")}
      <input style={A.inpBig} value={xVal} onChange={e=>setXVal(e.target.value)} placeholder="2.8450" inputMode="decimal"/>
      {lbl("Date Measured")}
      <input type="date" max={toLocalDate()} value={xDate} onChange={e=>setXDate(e.target.value)} style={A.inpDate}/>
      {lbl("Comparator Insert")}{inp(xComp,setXComp,"e.g. Hornady Lock-N-Load, .284 insert")}
      {lbl("Caliper")}{inp(xCal,setXCal,"e.g. Mitutoyo 500-196-30")}
      {lbl("Notes")}{ta(xNts,setXNts,"Bullet used, round count since last measurement…")}
      <button style={A.btnP} onClick={addCbto}>Save Measurement</button>
    </>
  );

  const loadForm=()=>{
    const calObj=calibers.find(c=>c.id===lCalId);
    const calName=calObj?.name||"Unknown caliber";
    return(
      <>
        {/* Caliber header — read-only, pre-selected */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
          <div style={{flex:1}}>
            <div style={{fontSize:15,fontWeight:700,color:T.text}}>{lId?"Edit Load":"New Load"}</div>
            <div style={{display:"inline-flex",alignItems:"center",gap:6,marginTop:5,background:T.accBg,border:`1px solid ${T.accBdr}`,borderRadius:20,padding:"3px 10px"}}>
              <div style={{fontSize:11,fontWeight:600,letterSpacing:"0.04em",color:T.acc}}>{calName}</div>
            </div>
          </div>
        </div>
        {lbl("Load Name / Label")}{inp(lName,setLName,"e.g. Match 41.5gr — leave blank to auto-name")}
        {divider}{secH("Components")}
        {lbl("Bullet *")}{inp(lBul,setLBul,"e.g. Berger 140gr Hybrid Target")}
        {row2(col(2,<>{lbl("Powder")}{inp(lPow,setLPow,"e.g. H4350")}</>),col(1,<>{lbl("Charge (gr)")}{inpM(lChg,setLChg,"41.5")}</>))}
        {row2(col(1,<>{lbl("Primer")}{inp(lPrim,setLPrim,"Fed 210M")}</>),col(1,<>{lbl("Brass")}{inp(lBrass,setLBrass,"Lapua")}</>))}
        {divider}{secH("Seating")}
        {row2(col(1,<>{lbl("COAL (in)")}{inpM(lCoal,setLCoal,"2.9100")}</>),col(1,<>{lbl("CBTO (in)")}{inpM(lCbto,setLCbto,"2.8450")}</>))}
        {divider}{secH("Performance")}
        {lbl("Avg Velocity (fps)")}{inpM(lVel,setLVel,"2847")}
        {lbl("Notes")}{ta(lNts,setLNts,"Best conditions, node range, context…")}
        <button style={{...A.btnP,opacity:!lCalId||!lBul.trim()?0.5:1}} onClick={saveLoad}>{lId?"Save Changes":"Save Load"}</button>
        <button style={A.btnG} onClick={()=>setModal("loads")}>Cancel</button>
      </>
    );
  };

  const caliberForm=()=>(
    <>
      <div style={{fontSize:15,fontWeight:700,color:T.text,marginBottom:8}}>Add Caliber</div>
      <div style={{fontSize:12,color:T.sub,lineHeight:1.65,marginBottom:20}}>
        Calibers are the top-level unit for your load library. Add loads within each caliber.
      </div>
      {lbl("Caliber Name *")}{inp(newCalName,setNewCalName,"e.g. 6.5 Creedmoor")}
      <button style={{...A.btnP,opacity:!newCalName.trim()?0.5:1}} onClick={addCaliber}>Add Caliber</button>
      <button style={A.btnG} onClick={()=>setModal("loads")}>Cancel</button>
    </>
  );

  const loadsModal=()=>(
    <div style={A.overlay} onClick={()=>setModal(null)}>
      <div style={A.sheet} onClick={e=>e.stopPropagation()}>
        {/* Header */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <div style={{fontSize:15,fontWeight:700,color:T.text}}>Load Library</div>
          <button onClick={()=>{setNewCalName("");setModal("caliber_form");}} style={{background:T.acc,color:"#fff",border:"none",borderRadius:6,padding:"7px 12px",fontSize:12,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
            <Ic.Plus/> Caliber
          </button>
        </div>

        {calibers.length===0?(
          <div style={{padding:"40px 0",textAlign:"center"}}>
            <div style={{fontSize:11,textTransform:"uppercase",letterSpacing:"0.1em",color:T.mut,marginBottom:12}}>No calibers yet</div>
            <div style={{fontSize:12,color:T.sub,lineHeight:1.65,marginBottom:20}}>Add a caliber first, then add loads within it.</div>
            <button onClick={()=>{setNewCalName("");setModal("caliber_form");}} style={{...A.btnP,width:"auto",padding:"9px 20px",fontSize:12}}>Add First Caliber</button>
          </div>
        ):(
          calibers.map(cal=>{
            const calLoads=loads.filter(l=>l.caliberId===cal.id);
            return(
              <div key={cal.id} style={{marginBottom:22}}>
                {/* Caliber header row */}
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                  <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.10em",color:T.acc}}>{cal.name}</div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <button onClick={()=>{resetLoad(cal.id);setModal("load_form");}} style={{background:"transparent",border:`1px solid ${T.accBdr}`,borderRadius:5,color:T.acc,cursor:"pointer",fontSize:11,fontWeight:500,padding:"4px 10px",display:"flex",alignItems:"center",gap:3}}>
                      <Ic.Plus/> Add Load
                    </button>
                    {calLoads.length===0&&(
                      <button onClick={()=>delCaliber(cal.id)} style={{background:"transparent",border:"none",color:T.mut,cursor:"pointer",display:"flex",alignItems:"center"}}><Ic.Trash/></button>
                    )}
                  </div>
                </div>

                {/* Loads under this caliber */}
                {calLoads.length===0?(
                  <div style={{background:T.bg,border:`1px solid ${T.bdr}`,borderRadius:6,padding:"14px",textAlign:"center",fontSize:11,color:T.mut}}>
                    No loads yet — tap Add Load
                  </div>
                ):(
                  calLoads.map(l=>(
                    <div key={l.id} style={{background:T.surf,border:`1px solid ${T.bdr}`,borderRadius:6,padding:"10px 12px",marginBottom:6}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                        <div style={{flex:1}}>
                          <div style={{fontSize:13,fontWeight:600,color:T.text}}>{l.name}</div>
                          <div style={{fontSize:11,color:T.sub,marginTop:3,lineHeight:1.6}}>{[l.bullet,l.powder&&l.charge?`${l.powder} @ ${l.charge}gr`:l.powder||"",l.primer,l.brass].filter(Boolean).join(" · ")}</div>
                          {(l.coal||l.cbto)&&<div style={{fontSize:11,fontFamily:T.mono,color:T.sub,marginTop:2}}>{l.coal?`COAL ${l.coal}" `:""}{l.cbto?`CBTO ${l.cbto}"`:""}</div>}
                          {l.velocity&&<div style={{fontSize:11,fontFamily:T.mono,color:T.acc,marginTop:2}}>{l.velocity} fps</div>}
                          {l.notes&&<div style={{fontSize:11,color:T.mut,marginTop:4,lineHeight:1.5}}>{l.notes}</div>}
                        </div>
                        <div style={{display:"flex",gap:8,marginLeft:10,flexShrink:0}}>
                          <button onClick={()=>{
                            setLId(l.id);setLCalId(l.caliberId||cal.id);setLName(l.name);
                            setLBul(l.bullet||"");setLPow(l.powder||"");setLChg(l.charge||"");
                            setLPrim(l.primer||"");setLBrass(l.brass||"");
                            setLCoal(l.coal||"");setLCbto(l.cbto||"");setLVel(l.velocity||"");setLNts(l.notes||"");
                            setModal("load_form");
                          }} style={{background:"transparent",border:`1px solid ${T.bdr}`,borderRadius:5,color:T.sub,cursor:"pointer",fontSize:11,padding:"4px 10px"}}>Edit</button>
                          <button onClick={()=>delLoad(l.id)} style={{background:"transparent",border:"none",color:T.mut,cursor:"pointer",display:"flex",alignItems:"center"}}><Ic.Trash/></button>
                        </div>
                      </div>
                    </div>
                  ))
                )}
              </div>
            );
          })
        )}
        <button style={A.btnG} onClick={()=>setModal(null)}>Done</button>
      </div>
    </div>
  );
  const eventModal=()=>{
    const tabs=fromDetail?[["session","Session"],["clean","Cleaning"],["cbto","CBTO"]]:null;
    return(
      <div style={A.overlay} onClick={()=>setModal(null)}>
        <div style={A.sheet} onClick={e=>e.stopPropagation()}>
          {tabs&&<div style={{display:"flex",gap:6,marginBottom:20}}>
            {tabs.map(([k,l])=><button key={k} onClick={()=>setEvType(k)} style={{flex:1,padding:"8px 0",background:evType===k?T.acc:T.bg,color:evType===k?"#fff":T.sub,border:`1px solid ${evType===k?T.acc:T.bdr}`,borderRadius:6,fontSize:12,fontWeight:evType===k?600:400,cursor:"pointer"}}>{l}</button>)}
          </div>}
          {!tabs&&<div style={{fontSize:15,fontWeight:700,color:T.text,marginBottom:20}}>Log Session{barrel?` · ${barrel.name}`:""}</div>}
          {evType==="session"&&sessionForm()}
          {evType==="clean"  &&cleanForm()}
          {evType==="cbto"   &&cbtoForm()}
          <button style={A.btnG} onClick={()=>setModal(null)}>Cancel</button>
        </div>
      </div>
    );
  };

  // ── Theme toggle button ─────────────────────────────────────────────────────
  const themeBtn=()=>(
    <button onClick={toggleDark} style={{background:"transparent",border:`1px solid ${T.bdr}`,borderRadius:6,color:T.sub,cursor:"pointer",padding:"7px 8px",display:"flex",alignItems:"center"}}>
      {darkMode?<Ic.Sun/>:<Ic.Moon/>}
    </button>
  );

  // ── Detail View ───────────────────────────────────────────────────────────
  if(view==="detail"&&barrel){
    const isT=barrel.status==="transferred";
    const allEvts=allFor(barrel.id),bSess=sessFor(barrel.id).sort((a,b)=>b.date.localeCompare(a.date)),bCbtos=cbtosFor(barrel.id);
    const tot=totalRnds(barrel.id),bRsc=rsc(barrel.id);
    const pct=barrel.lifeRounds?Math.min(100,(tot/barrel.lifeRounds)*100):null;
    const lc=lifeColor(pct,T),rc=cleanColor(bRsc,T);
    const curCbto=bCbtos[bCbtos.length-1],baseCbto=bCbtos[0];
    return(
      <div style={{fontFamily:T.sans,background:T.bg,minHeight:"100vh",color:T.text,maxWidth:maxW,margin:"0 auto"}}>
        <div style={{background:T.surf,borderBottom:`1px solid ${T.bdr}`,padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:10}}>
          <button onClick={()=>setView("home")} style={{background:"none",border:"none",color:T.acc,cursor:"pointer",padding:0,display:"flex",alignItems:"center",gap:5,fontSize:13,fontWeight:500}}><Ic.Back/> Barrels</button>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <div style={{fontSize:14,fontWeight:700,letterSpacing:"-0.01em",color:T.text}}>{barrel.name}</div>
            {isT&&<Badge label="Transferred" color={T.amber} bg={T.amberBg} border={T.amberBdr}/>}
          </div>
          {themeBtn()}
        </div>
        <div style={{paddingBottom:100}}>
          {isT&&<div style={{background:T.amberBg,borderBottom:`1px solid ${T.amberBdr}`,padding:"10px 20px"}}><div style={{fontSize:11,color:T.amber,lineHeight:1.5}}><b>Archived read-only copy.</b> Transferred {fmtDate(barrel.transferredDate)}.</div></div>}
          <div style={{background:T.surf,borderBottom:`1px solid ${T.bdr}`,padding:"16px 20px 18px"}}>
            <div style={{fontSize:11,color:T.sub}}>{[barrel.caliber,barrel.notes].filter(Boolean).join(" · ")||"No caliber set"}</div>
            <div style={{display:"flex",marginTop:12}}>
              {[{v:tot.toLocaleString(),l:"Rounds"},{v:bSess.length,l:"Sessions"},{v:cleansFor(barrel.id).length,l:"Cleanings"}].map(({v,l},i)=>(
                <div key={l} style={{flex:1,borderRight:i<2?`1px solid ${T.bdr2}`:"none",paddingLeft:i>0?14:0,paddingRight:i<2?14:0}}>
                  <div style={{fontSize:21,fontWeight:700,fontFamily:T.mono,color:T.text,lineHeight:1}}>{v}</div>
                  <div style={{fontSize:10,color:T.sub,textTransform:"uppercase",letterSpacing:"0.08em",marginTop:4}}>{l}</div>
                </div>
              ))}
            </div>
            {pct!==null&&<div style={{marginTop:14}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
                <span style={{fontSize:11,color:T.sub}}>Barrel life</span>
                <span style={{fontSize:11,fontFamily:T.mono,color:lc,fontWeight:600}}>{Math.round(pct)}% · {Math.max(0,barrel.lifeRounds-tot).toLocaleString()} remaining</span>
              </div>
              <div style={{height:4,background:T.bdr2,borderRadius:2,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:lc,borderRadius:2}}/></div>
            </div>}
            <div style={{display:"flex",gap:16,marginTop:12,flexWrap:"wrap"}}>
              <div style={{fontSize:11,color:T.sub}}><span style={{fontFamily:T.mono,fontWeight:600,color:rc}}>{bRsc.toLocaleString()}</span> rds since clean</div>
              {curCbto&&<div style={{fontSize:11,color:T.sub}}>CBTO <span style={{fontFamily:T.mono,fontWeight:600,color:T.text}}>{fmtCBTO(curCbto.measurement)}</span></div>}
              {bSess[0]&&<div style={{fontSize:11,color:T.sub,marginLeft:"auto"}}>{fmtAgo(bSess[0].date)}</div>}
            </div>
          </div>
          <div style={{display:"flex",background:T.surf,borderBottom:`1px solid ${T.bdr}`}}>
            {[["timeline","Timeline"],["lands","Lands"],["report","Report"]].map(([k,l])=>(
              <button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:"11px 0",background:"transparent",border:"none",borderBottom:`2px solid ${tab===k?T.acc:"transparent"}`,color:tab===k?T.acc:T.sub,fontSize:11,fontWeight:tab===k?600:400,cursor:"pointer",textTransform:"uppercase",letterSpacing:"0.08em"}}>{l}</button>
            ))}
          </div>
          <div style={{display:"flex",gap:8,padding:"10px 16px 0"}}>
            {[["CSV",()=>exportCSV(barrel,events)],["PDF",()=>exportPDF(barrel,events)]].map(([l,fn])=>(
              <button key={l} onClick={fn} style={{...A.btnG,marginTop:0,flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:5,fontSize:11,padding:"9px 0"}}><Ic.Dl/> Export {l}</button>
            ))}
          </div>
          {tab==="timeline"&&<>
            <div style={{padding:"18px 16px 8px",display:"flex",justifyContent:"space-between"}}>
              <span style={{fontSize:11,fontWeight:500,textTransform:"uppercase",letterSpacing:"0.08em",color:T.sub}}>All Events</span>
              <span style={{fontSize:11,color:T.mut}}>{allEvts.length} entries</span>
            </div>
            {allEvts.length===0
              ?<div style={{padding:"52px 24px",textAlign:"center",fontSize:11,textTransform:"uppercase",letterSpacing:"0.1em",color:T.mut}}>No events yet</div>
              :<div style={{padding:"0 16px"}}>{allEvts.map(ev=><EventCard key={ev.id} ev={ev} baseline={baseCbto} onDel={()=>delEvent(ev.id)} readOnly={isT} T={T}/>)}</div>
            }
          </>}
          {tab==="lands"&&<>
            {curCbto?(
              <div style={{margin:"14px 16px 0",background:T.accBg,border:`1px solid ${T.accBdr}`,borderRadius:8,padding:"18px"}}>
                <div style={{fontSize:10,textTransform:"uppercase",letterSpacing:"0.1em",color:T.acc,fontWeight:600,marginBottom:8}}>Current CBTO to Lands</div>
                <div style={{fontSize:36,fontWeight:700,fontFamily:T.mono,color:T.text,letterSpacing:"-0.02em"}}>{fmtCBTO(curCbto.measurement)}</div>
                <div style={{fontSize:11,color:T.sub,marginTop:5}}>Measured {fmtDate(curCbto.date)}{curCbto.comparator?` · ${curCbto.comparator}`:""}</div>
                {bCbtos.length>1&&<div style={{display:"flex",gap:20,marginTop:14,paddingTop:14,borderTop:`1px solid ${T.accBdr}`}}>
                  <div><div style={{fontSize:13,fontFamily:T.mono,fontWeight:600,color:T.text}}>+{(parseFloat(curCbto.measurement)-parseFloat(baseCbto.measurement)).toFixed(4)}"</div><div style={{fontSize:9,color:T.sub,textTransform:"uppercase",letterSpacing:"0.08em",marginTop:3}}>Total Erosion</div></div>
                  <div><div style={{fontSize:13,fontFamily:T.mono,color:T.sub}}>{fmtCBTO(baseCbto.measurement)}</div><div style={{fontSize:9,color:T.sub,textTransform:"uppercase",letterSpacing:"0.08em",marginTop:3}}>Baseline</div></div>
                  <div><div style={{fontSize:13,fontFamily:T.mono,color:T.sub}}>{bCbtos.length}</div><div style={{fontSize:9,color:T.sub,textTransform:"uppercase",letterSpacing:"0.08em",marginTop:3}}>Readings</div></div>
                </div>}
              </div>
            ):(
              <div style={{margin:"14px 16px 0",background:T.bg,border:`1px solid ${T.bdr}`,borderRadius:8,padding:"20px",textAlign:"center"}}>
                <div style={{fontSize:12,color:T.sub,marginBottom:14,lineHeight:1.6}}>No CBTO readings recorded yet.</div>
                {!isT&&<button onClick={()=>{resetCbto();setEvType("cbto");setFromDetail(true);setModal("event");}} style={{...A.btnP,width:"auto",padding:"9px 22px",fontSize:12}}>Add First Reading</button>}
              </div>
            )}
            {bCbtos.length>0&&<>
              <div style={{padding:"18px 16px 8px",display:"flex",justifyContent:"space-between"}}>
                <span style={{fontSize:11,fontWeight:500,textTransform:"uppercase",letterSpacing:"0.08em",color:T.sub}}>Reading History</span>
                <span style={{fontSize:11,color:T.mut}}>{bCbtos.length} readings</span>
              </div>
              <div style={{padding:"0 16px"}}>{[...bCbtos].reverse().map(r=><EventCard key={r.id} ev={r} baseline={baseCbto} onDel={()=>delEvent(r.id)} readOnly={isT} T={T}/>)}</div>
              {!isT&&<div style={{padding:"8px 16px 0"}}><button onClick={()=>{resetCbto();setEvType("cbto");setFromDetail(true);setModal("event");}} style={{...A.btnG,marginTop:0,display:"flex",alignItems:"center",justifyContent:"center",gap:6,fontSize:12}}><Ic.Plus/> Add New Reading</button></div>}
            </>}
          </>}
          {tab==="report"&&<ReportView barrel={barrel} events={events} vw={vw} T={T}/>}
          <div style={{height:24}}/>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10,padding:"0 16px"}}>
            {!isT&&<button onClick={()=>setConfTransfer(true)} style={{background:"transparent",border:"none",color:T.amber,cursor:"pointer",fontSize:11,display:"inline-flex",alignItems:"center",gap:5,fontFamily:T.sans}}><Ic.Share/> Transfer barrel to new owner</button>}
            <button onClick={()=>setConfDel(true)} style={{background:"transparent",border:"none",color:T.mut,cursor:"pointer",fontSize:11,display:"inline-flex",alignItems:"center",gap:5,fontFamily:T.sans}}><Ic.Trash/> {isT?"Delete archived copy":"Delete barrel and all data"}</button>
          </div>
        </div>
        {!isT&&<button style={A.fab} onClick={openDetailEv}><Ic.Plus/></button>}
        {modal==="event"&&eventModal()}
        {confTransfer&&(
          <div style={A.overlay} onClick={()=>setConfTransfer(false)}>
            <div style={A.sheet} onClick={e=>e.stopPropagation()}>
              <div style={{fontSize:15,fontWeight:700,color:T.text,marginBottom:12}}>Transfer Barrel</div>
              <p style={{fontSize:13,color:T.sub,lineHeight:1.7,marginBottom:8}}>Downloads a <b style={{color:T.text}}>barrel pack file</b> with the full history of <b style={{color:T.text}}>{barrel.name}</b>.</p>
              <p style={{fontSize:13,color:T.sub,lineHeight:1.7,marginBottom:20}}>Your copy becomes a <b style={{color:T.text}}>read-only archived record</b>.</p>
              <button style={{...A.btnP,background:T.amber}} onClick={doTransfer}>Download Pack &amp; Archive</button>
              <button style={A.btnG} onClick={()=>setConfTransfer(false)}>Cancel</button>
            </div>
          </div>
        )}
        {confDel&&(
          <div style={A.overlay} onClick={()=>setConfDel(false)}>
            <div style={A.sheet} onClick={e=>e.stopPropagation()}>
              <div style={{fontSize:15,fontWeight:700,color:T.text,marginBottom:16}}>Delete barrel?</div>
              <p style={{fontSize:13,color:T.sub,lineHeight:1.65,marginBottom:20}}>Permanently deletes <b style={{color:T.text}}>{barrel.name}</b> and all data.</p>
              <button style={{...A.btnP,background:T.danger}} onClick={delBarrel}>Delete</button>
              <button style={A.btnG} onClick={()=>setConfDel(false)}>Cancel</button>
            </div>
          </div>
        )}
      </div>
    );
  }

  // ── Home ──────────────────────────────────────────────────────────────────
  return(
    <div style={{fontFamily:T.sans,background:T.bg,minHeight:"100vh",color:T.text,maxWidth:maxW,margin:"0 auto"}}>
      <input type="file" accept=".json" ref={importRef} onChange={handleImport} style={{display:"none"}}/>
      <div style={{background:T.surf,borderBottom:`1px solid ${T.bdr}`,padding:`18px ${pad+4}px 16px`,position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
          <div style={{display:"flex",alignItems:"center",gap:11,minWidth:0}}>
            <BoreLogo size={38}/>
            <div>
              <div style={{fontSize:wide?24:20,fontWeight:700,letterSpacing:"0.18em",textTransform:"uppercase",color:T.text,lineHeight:1}}>BORELY</div>
              <div style={{fontSize:9,color:T.mut,letterSpacing:"0.10em",textTransform:"uppercase",marginTop:4}}>Barrel life, precisely tracked</div>
            </div>
          </div>
          <div style={{display:"flex",gap:7,alignItems:"center",flexShrink:0}}>
            <button onClick={()=>setModal("loads")} style={{background:"transparent",border:`1px solid ${T.bdr}`,borderRadius:6,color:T.sub,cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",gap:5,padding:"7px 10px"}}><Ic.Book/> Loads</button>
            <button onClick={()=>importRef.current&&importRef.current.click()} style={{background:"transparent",border:`1px solid ${T.bdr}`,borderRadius:6,color:T.sub,cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",gap:5,padding:"7px 10px"}}><Ic.Up/> Import</button>
            {themeBtn()}
          </div>
        </div>
      </div>
      <div style={{paddingBottom:100}}>
        <div style={{padding:`16px ${pad}px 8px`,fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.10em",color:T.sub}}>Barrels</div>
        {barrels.length===0
          ?<div style={{padding:"52px 24px",textAlign:"center"}}><div style={{fontSize:11,textTransform:"uppercase",letterSpacing:"0.1em",color:T.mut,marginBottom:16}}>No barrels yet</div><div style={{fontSize:12,color:T.sub,lineHeight:1.6}}>Tap + to add a barrel, or import a barrel pack.</div></div>
          :<div style={{display:"grid",gridTemplateColumns:wide?"1fr 1fr":"1fr",gap:10,padding:`0 ${pad}px`}}>
            {barrels.map(b=>{
              const isT=b.status==="transferred";
              const bS=sessFor(b.id).sort((a,c)=>c.date.localeCompare(a.date)),bC=cbtosFor(b.id);
              const tot=totalRnds(b.id),bRsc=rsc(b.id);
              const pct=b.lifeRounds?Math.min(100,(tot/b.lifeRounds)*100):null;
              const lc=lifeColor(pct,T),rc=cleanColor(bRsc,T);
              const cur=bC[bC.length-1],bas=bC[0];
              return(
                <div key={b.id} style={{...A.card,opacity:isT?0.72:1}}>
                  <div style={{padding:"14px 16px",cursor:"pointer"}} onClick={()=>{setActiveId(b.id);setTab("timeline");setView("detail");}}>
                    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:12}}>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                          <div style={{fontSize:15,fontWeight:700,letterSpacing:"-0.01em",color:T.text}}>{b.name}</div>
                          {isT&&<Badge label="Transferred" color={T.amber} bg={T.amberBg} border={T.amberBdr}/>}
                        </div>
                        <div style={{fontSize:11,color:T.sub,marginTop:3}}>{[b.caliber,b.notes].filter(Boolean).join(" · ")||"No caliber set"}</div>
                      </div>
                      <div style={{textAlign:"right",flexShrink:0}}>
                        <div style={{fontSize:22,fontWeight:700,fontFamily:T.mono,lineHeight:1,color:lc||T.text}}>{tot.toLocaleString()}</div>
                        <div style={{fontSize:10,color:T.sub,textTransform:"uppercase",letterSpacing:"0.08em",marginTop:2}}>{b.lifeRounds?`/ ${b.lifeRounds.toLocaleString()} rds`:"rounds"}</div>
                      </div>
                    </div>
                    {pct!==null&&<div style={{height:3,background:T.bdr2,borderRadius:2,overflow:"hidden",marginTop:10}}><div style={{height:"100%",width:`${pct}%`,background:lc,borderRadius:2}}/></div>}
                    <div style={{display:"flex",gap:14,marginTop:pct!==null?8:10,flexWrap:"wrap"}}>
                      <div style={{fontSize:11,color:T.sub}}><span style={{fontFamily:T.mono,fontWeight:600,color:rc}}>{bRsc.toLocaleString()}</span> since clean</div>
                      {cur&&<div style={{fontSize:11,color:T.sub}}>CBTO <span style={{fontFamily:T.mono,fontWeight:600,color:T.text}}>{fmtCBTO(cur.measurement)}</span>{bC.length>1&&<span style={{fontFamily:T.mono,color:T.sub}}> +{(parseFloat(cur.measurement)-parseFloat(bas.measurement)).toFixed(4)}"</span>}</div>}
                      {bS[0]&&<div style={{fontSize:11,color:T.sub,marginLeft:"auto"}}>{fmtAgo(bS[0].date)}</div>}
                    </div>
                  </div>
                  {!isT
                    ?<div onClick={e=>openQuickSess(b.id,e)} style={{borderTop:`1px solid ${T.bdr2}`,padding:"10px 16px",display:"flex",alignItems:"center",gap:6,color:T.acc,fontSize:12,fontWeight:500,cursor:"pointer"}}><Ic.Plus/> Log Session</div>
                    :<div style={{borderTop:`1px solid ${T.bdr2}`,padding:"9px 16px",color:T.mut,fontSize:11}}>Archived · transferred {fmtDate(b.transferredDate)}</div>
                  }
                </div>
              );
            })}
          </div>
        }
      </div>

      <button style={A.fab} onClick={()=>setModal("barrel")}><Ic.Plus/></button>
      <button onClick={()=>setModal("help")} style={{position:"fixed",bottom:28,left:24,width:36,height:36,borderRadius:"50%",background:T.surf,border:`1px solid ${T.bdr}`,color:T.sub,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:600,boxShadow:"0 1px 6px rgba(0,0,0,0.12)",zIndex:20}}>?</button>

      {modal==="event"&&eventModal()}
      {modal==="loads"&&loadsModal()}
      {modal==="load_form"&&(
        <div style={A.overlay} onClick={()=>setModal("loads")}>
          <div style={A.sheet} onClick={e=>e.stopPropagation()}>
            {loadForm()}
          </div>
        </div>
      )}
      {modal==="caliber_form"&&(
        <div style={A.overlay} onClick={()=>setModal("loads")}>
          <div style={A.sheet} onClick={e=>e.stopPropagation()}>
            {caliberForm()}
          </div>
        </div>
      )}
      {modal==="barrel"&&(
        <div style={A.overlay} onClick={()=>setModal(null)}>
          <div style={A.sheet} onClick={e=>e.stopPropagation()}>
            <div style={{fontSize:15,fontWeight:700,color:T.text,marginBottom:20}}>Add Barrel</div>
            {lbl("Name *")}<input style={A.inp} value={bName} onChange={e=>setBName(e.target.value)} placeholder="e.g. 6.5 CM Match #1" autoFocus/>

            {/* Caliber — dropdown from load library, or manual entry */}
            {lbl("Caliber")}
            <select style={A.sel} value={bCalId} onChange={e=>{
              const v=e.target.value;
              setBCalId(v);
              if(v==="other"){setBCal("");}
              else if(v){const c=calibers.find(x=>x.id===v);if(c)setBCal(c.name);}
              else{setBCal("");}
            }}>
              <option value="">Select caliber…</option>
              {calibers.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
              <option value="other">Other — enter manually</option>
            </select>

            {/* Manual entry when "Other" selected */}
            {bCalId==="other"&&(
              <>
                <input style={{...A.inp,marginTop:-8}} value={bCal} onChange={e=>setBCal(e.target.value)} placeholder="e.g. 6.5 Creedmoor"/>
                {bCal.trim()&&(
                  <div style={{background:T.amberBg,border:`1px solid ${T.amberBdr}`,borderRadius:6,padding:"10px 14px",marginTop:-8,marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                    <div style={{fontSize:12,color:T.amber,lineHeight:1.5}}>
                      Add <b>{bCal.trim()}</b> to your load library?
                    </div>
                    <button onClick={()=>{
                      if(!bCal.trim())return;
                      if(calibers.some(c=>c.name.trim().toLowerCase()===bCal.trim().toLowerCase())){return;}
                      const newId=uid();
                      setCalibers(p=>[...p,{id:newId,name:bCal.trim(),created:toLocalDate()}]);
                      setBCalId(newId);
                    }} style={{background:T.amber,color:"#fff",border:"none",borderRadius:5,padding:"6px 12px",fontSize:11,fontWeight:600,cursor:"pointer",flexShrink:0,whiteSpace:"nowrap"}}>
                      Add Caliber
                    </button>
                  </div>
                )}
              </>
            )}

            {/* Confirmation when library caliber is selected */}
            {bCalId&&bCalId!=="other"&&(
              <div style={{fontSize:11,color:T.acc,marginTop:-10,marginBottom:14,display:"flex",alignItems:"center",gap:5}}>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>
                Loads in this caliber will auto-populate session logs
              </div>
            )}
            {lbl("Notes")}<input style={A.inp} value={bNts} onChange={e=>setBNts(e.target.value)} placeholder='e.g. 24" Bartlein, 1:8 twist'/>
            {lbl("Estimated Life (rounds)")}<input style={A.inpM} value={bLife} onChange={e=>setBLife(e.target.value)} placeholder="e.g. 3000" inputMode="numeric"/>
            {divider}
            <button onClick={()=>setBShowC(v=>!v)} style={{width:"100%",background:"transparent",border:`1px solid ${T.bdr}`,borderRadius:6,padding:"10px 14px",fontSize:12,color:T.sub,cursor:"pointer",textAlign:"left",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:bShowC?14:0}}>
              <span>Record initial CBTO <span style={{color:T.mut}}>(optional)</span></span>
              <span style={{color:T.acc,fontSize:18,lineHeight:1,fontWeight:300}}>{bShowC?"−":"+"}</span>
            </button>
            {bShowC&&<div style={{background:T.bg,border:`1px solid ${T.bdr}`,borderRadius:6,padding:"14px",marginBottom:4}}>
              {lbl("CBTO to Lands (inches)")}<input style={A.inpM} value={bCbtoV} onChange={e=>setBCbtoV(e.target.value)} placeholder="2.8450" inputMode="decimal"/>
              {lbl("Date Measured")}<input type="date" max={toLocalDate()} value={bCbtoD} onChange={e=>setBCbtoD(e.target.value)} style={A.inpDate}/>
              {lbl("Comparator Insert")}<input style={A.inp} value={bComp} onChange={e=>setBComp(e.target.value)} placeholder="e.g. Hornady Lock-N-Load, .284 insert"/>
              {lbl("Caliper")}<input style={A.inp} value={bCalip} onChange={e=>setBCalip(e.target.value)} placeholder="e.g. Mitutoyo 500-196-30"/>
              {lbl("Notes")}<textarea style={A.ta} value={bCbtoN} onChange={e=>setBCbtoN(e.target.value)} placeholder="Bullet used, any context…"/>
            </div>}
            <button style={A.btnP} onClick={addBarrel}>Add Barrel</button>
            <button style={A.btnG} onClick={()=>setModal(null)}>Cancel</button>
          </div>
        </div>
      )}
      {modal==="help"&&(
        <div style={A.overlay} onClick={()=>setModal(null)}>
          <div style={A.sheet} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
              <BoreLogo size={30}/>
              <div><div style={{fontSize:15,fontWeight:700,color:T.text}}>Quick Start</div><div style={{fontSize:11,color:T.sub,marginTop:2}}>How to use Borely</div></div>
            </div>
            {(()=>{
              // All help components called as functions — NOT JSX components
              const plusBtn=()=><span style={{display:"inline-flex",alignItems:"center",verticalAlign:"middle",margin:"0 2px"}}><span style={{width:22,height:22,borderRadius:"50%",background:T.acc,display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span></span>;
              const textBtn=(label,color,border)=><span style={{display:"inline-flex",alignItems:"center",verticalAlign:"middle",margin:"0 2px",background:T.bg,border:`1px solid ${border||T.bdr}`,borderRadius:5,padding:"2px 8px",fontSize:11,fontWeight:500,color:color||T.sub,whiteSpace:"nowrap"}}>{label}</span>;
              const numBtn=n=><span style={{display:"inline-flex",alignItems:"center",verticalAlign:"middle",margin:"0 1px",background:T.bg,border:`1px solid ${T.bdr}`,borderRadius:5,padding:"2px 7px",fontSize:11,fontFamily:T.mono,fontWeight:500,color:T.sub}}>{n}</span>;
              const sections=[
                {title:"1 — Add a barrel",steps:[
                  <>{plusBtn()} at bottom right → fill in name, caliber, optional notes and estimated life.</>,
                  "Optionally record your initial CBTO to lands as a baseline for throat erosion tracking.",
                ]},
                {title:"2 — Save loads",steps:[
                  <>{textBtn("Loads")} in the home header opens your load library.</>,
                  "Loads are caliber-wide — one 6.5 CM load is available across all 6.5 CM barrels.",
                  "Fields: bullet, powder, charge, primer, brass, COAL, CBTO, velocity, notes.",
                ]},
                {title:"3 — Log a session",steps:[
                  <>{textBtn("Log Session",T.acc)} on any barrel card for quick round count entry.</>,
                  <>{plusBtn()} inside a barrel → Session tab for full data entry.</>,
                  <>If saved loads exist for that caliber, a selector appears — pick one to auto-populate all fields.</>,
                  <>Quick-count buttons {numBtn(5)} {numBtn(10)} {numBtn(20)} {numBtn(50)} for fast entry at the range.</>,
                  "Backdate any entry using the date field.",
                ]},
                {title:"4 — Track maintenance",steps:[
                  <>{plusBtn()} inside a barrel → Cleaning tab. Quick mode or detailed with pass count and observations.</>,
                  "Rounds since last cleaning shown in green / yellow / red on every card.",
                ]},
                {title:"5 — Monitor throat erosion",steps:[
                  <>{plusBtn()} → CBTO tab, or go directly to the Lands tab.</>,
                  "Lands tab shows current measurement, total erosion from baseline, and reading history.",
                  "Report tab charts erosion and velocity trends over the barrel's life.",
                ]},
                {title:"6 — Transfer a barrel",steps:[
                  "Inside a barrel → scroll down → Transfer barrel to new owner.",
                  "A barrel pack file downloads with full history. Send it to the new owner.",
                  <>{textBtn("Import")} on the home screen to accept the pack.</>,
                  "Your copy becomes read-only — history preserved, no new events.",
                ]},
                {title:"7 — Export",steps:[
                  "Export CSV — full spreadsheet covering shot log, cleaning log, and CBTO readings.",
                  "Export PDF — print-ready barrel record.",
                ]},
              ];
              return sections.map(({title,steps})=>(
                <div key={title} style={{marginBottom:18}}>
                  <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.10em",color:T.acc,marginBottom:8}}>{title}</div>
                  {steps.map((s,i)=>(
                    <div key={i} style={{display:"flex",gap:10,marginBottom:7,alignItems:"flex-start"}}>
                      <div style={{width:4,height:4,borderRadius:"50%",background:T.mut,marginTop:7,flexShrink:0}}/>
                      <div style={{fontSize:12,color:T.sub,lineHeight:1.7}}>{s}</div>
                    </div>
                  ))}
                </div>
              ));
            })()}
            {/* ── About ── */}
            <div style={{borderTop:`1px solid ${T.bdr}`,marginTop:8,paddingTop:20,marginBottom:4}}>
              <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.10em",color:T.acc,marginBottom:14}}>About</div>
              <div style={{display:"flex",flexDirection:"column",gap:9}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:12,color:T.sub}}>App</span>
                  <span style={{fontSize:12,color:T.text,fontWeight:600}}>Borely&nbsp;1.0</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:12,color:T.sub}}>Developer</span>
                  <span style={{fontSize:12,color:T.text}}>Tight Bore LLC</span>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:12,color:T.sub}}>Support</span>
                  <a href="mailto:info@tightbore.com" style={{fontSize:12,color:T.acc,textDecoration:"none"}}>info@tightbore.com</a>
                </div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:12,color:T.sub}}>Privacy Policy</span>
                  <a href="https://jth7186.github.io/tightbore/privacy.html" target="_blank" rel="noreferrer" style={{fontSize:12,color:T.acc,textDecoration:"none"}}>jth7186.github.io/tightbore/privacy.html</a>
                </div>
              </div>
              <div style={{fontSize:10,color:T.mut,marginTop:16,textAlign:"center"}}>© {new Date().getFullYear()} Tight Bore LLC. All rights reserved.</div>
            </div>
            <button style={{...A.btnG,marginTop:16}} onClick={()=>setModal(null)}>Done</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
