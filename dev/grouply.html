<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>GroupLY — Group Size Measurement by Borely</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0C0B0A;--surf:#1A1814;--bdr:#38342C;
      --text:#F0EDE8;--sub:#9C9488;--mut:#5C5850;
      --acc:#6A8A5A;--acc-light:#8AAA78;--acc-dim:#1E2C1A;--acc-bdr:#3A5830;
      --teal:#2EC4B6;--amber:#C8963A;--amberbg:#2C1E0A;--amberbdr:#6A4A18;
      --danger:#C03030;
    }
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

    header{background:var(--surf);border-bottom:1px solid var(--bdr);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}
    .brand{font-size:18px;font-weight:700;letter-spacing:0.14em}
    .brand span{color:var(--teal)}
    .step-pill{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#fff;background:var(--acc);border-radius:20px;padding:4px 12px}

    /* Upload */
    #upload-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 24px;text-align:center}

    /* Viewport — fixed size, image moves inside */
    #viewport{flex:1;position:relative;overflow:hidden;background:#111;touch-action:none;cursor:grab;min-height:0}
    #viewport:active{cursor:grabbing}
    #photo{position:absolute;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-select:none;pointer-events:none}

    /* Fixed reticle — always center of viewport */
    #reticle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5;display:none}
    .reticle-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid;animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .reticle-h,.reticle-v{position:absolute;background:currentColor}
    .reticle-h{top:50%;left:0;right:0;height:1.5px;transform:translateY(-50%)}
    .reticle-v{left:50%;top:0;bottom:0;width:1.5px;transform:translateX(-50%)}
    .reticle-label{position:absolute;top:50%;left:50%;transform:translate(14px,-50%);font-size:13px;font-weight:700;letter-spacing:0.06em;white-space:nowrap;text-shadow:0 1px 4px #000}

    /* Confirmed markers drawn on overlay canvas */
    #overlay-canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:4}

    /* Bottom panel */
    #panel{background:var(--surf);border-top:1px solid var(--bdr);flex-shrink:0;z-index:10;min-height:90px}
    #instr{padding:10px 16px 6px;font-size:13px;color:var(--sub);line-height:1.5;min-height:40px}
    #actions{display:flex;gap:8px;padding:8px 16px 14px;align-items:center;flex-wrap:wrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
    .btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:12px 24px;font-size:15px;font-weight:500;cursor:pointer;flex-shrink:0}
    .btn:hover{background:var(--acc-light)}
    .btn:disabled{opacity:0.4;cursor:default}
    .btn-teal{background:var(--teal);color:#0C0B0A}
    .btn-teal:hover{background:#3DDDD0}
    .btn-ghost{background:transparent;border:1px solid var(--bdr);color:var(--sub);border-radius:8px;padding:10px 16px;font-size:13px;cursor:pointer}
    .btn-ghost:hover{border-color:var(--sub);color:var(--text)}
    .btn-sm{padding:8px 14px;font-size:13px;border-radius:6px}
    .badge{display:inline-flex;align-items:center;border-radius:4px;padding:4px 9px;font-size:12px;letter-spacing:0.04em;white-space:nowrap}
    .badge-ref{background:var(--amberbg);border:1px solid var(--amberbdr);color:var(--amber)}
    .badge-impact{background:rgba(46,196,182,.12);border:1px solid rgba(46,196,182,.3);color:var(--teal)}
    .input-sm{background:var(--bg);border:1px solid var(--bdr);border-radius:6px;color:var(--text);padding:8px 10px;font-size:14px;width:72px;text-align:center}
    select.input-sm{width:auto;min-width:130px;text-align:left}

    /* Live group overlay — draggable, on canvas */
    #group-overlay{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:8;cursor:grab;display:none;user-select:none;-webkit-user-select:none;touch-action:none}
    #group-overlay:active{cursor:grabbing}
    .go-box{background:rgba(12,11,10,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(240,237,232,0.18);border-radius:10px;padding:10px 16px;text-align:center;min-width:140px}
    .go-shots{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(240,237,232,0.55);margin-bottom:4px}
    .go-brand{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(240,237,232,0.1)}
    .go-logo{flex-shrink:0}
    .go-appname{font-size:12px;font-weight:800;letter-spacing:0.14em;color:#F0EDE8}
    .go-val{font-size:22px;font-weight:700;color:#F0EDE8;line-height:1;font-variant-numeric:tabular-nums}
    .go-moa{font-size:13px;color:rgba(46,196,182,0.9);margin-top:2px;font-variant-numeric:tabular-nums}

    /* Results overlay */
    #results{display:none;position:absolute;bottom:0;left:0;right:0;background:rgba(12,11,10,.95);border-top:1px solid var(--bdr);padding:16px;z-index:20}
    .res-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
    .res-card{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:10px;text-align:center}
    .res-val{font-size:20px;font-weight:700;color:var(--text);line-height:1}
    .res-unit{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.10em;margin-top:3px}
    .res-detail{font-size:12px;color:var(--sub);line-height:1.8;margin-bottom:10px}

    /* Export button special style */
    .btn-export{background:linear-gradient(135deg,#2EC4B6,#1A9E92);color:#0C0B0A;font-weight:600;position:relative;overflow:hidden}
    .btn-export:hover{background:linear-gradient(135deg,#3DDDD0,#2EC4B6)}
    .btn-export svg{vertical-align:-2px;margin-right:4px}

    /* Export toast */
    #export-toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(46,196,182,0.95);color:#0C0B0A;font-size:14px;font-weight:600;padding:10px 20px;border-radius:20px;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.3s;white-space:nowrap}
    #export-toast.show{opacity:1}
  </style>
</head>
<body>

<header>
  <div class="brand">GROUP<span>LY</span> <span style="font-size:13px;color:var(--mut);font-weight:400;letter-spacing:0.04em">by BORE<span style="color:var(--teal)">LY</span></span></div>
  <span class="step-pill" id="step-pill">Upload</span>
</header>

<!-- Upload -->
<div id="upload-zone">
  <svg width="140" height="140" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" style="margin-bottom:4px">
    <circle cx="70" cy="70" r="66" fill="none" stroke="#38342C" stroke-width="1.5"/>
    <circle cx="70" cy="70" r="52" fill="none" stroke="#38342C" stroke-width="1.5"/>
    <circle cx="70" cy="70" r="38" fill="none" stroke="#38342C" stroke-width="1.5"/>
    <circle cx="70" cy="70" r="24" fill="none" stroke="#38342C" stroke-width="1.5"/>
    <circle cx="70" cy="70" r="10" fill="#C03030" opacity="0.7"/>
    <line x1="70" y1="4" x2="70" y2="34" stroke="#5C5850" stroke-width="1.5"/>
    <line x1="70" y1="106" x2="70" y2="136" stroke="#5C5850" stroke-width="1.5"/>
    <line x1="4" y1="70" x2="34" y2="70" stroke="#5C5850" stroke-width="1.5"/>
    <line x1="106" y1="70" x2="136" y2="70" stroke="#5C5850" stroke-width="1.5"/>
    <circle cx="62" cy="58" r="5.5" fill="none" stroke="#2EC4B6" stroke-width="2" opacity="0.9"/>
    <circle cx="62" cy="58" r="1.5" fill="#2EC4B6"/>
    <circle cx="76" cy="64" r="5.5" fill="none" stroke="#2EC4B6" stroke-width="2" opacity="0.9"/>
    <circle cx="76" cy="64" r="1.5" fill="#2EC4B6"/>
    <circle cx="68" cy="74" r="5.5" fill="none" stroke="#2EC4B6" stroke-width="2" opacity="0.9"/>
    <circle cx="68" cy="74" r="1.5" fill="#2EC4B6"/>
    <circle cx="58" cy="70" r="5.5" fill="none" stroke="#2EC4B6" stroke-width="2" opacity="0.9"/>

    <circle cx="74" cy="76" r="5.5" fill="none" stroke="#2EC4B6" stroke-width="2" opacity="0.9"/>

    <line x1="27" y1="30" x2="33" y2="30" stroke="#C8963A" stroke-width="1.5"/>
    <line x1="30" y1="27" x2="30" y2="33" stroke="#C8963A" stroke-width="1.5"/>
    <text x="36" y="27" font-size="8" fill="#C8963A" font-family="-apple-system,sans-serif" font-weight="700">R1</text>
    <circle cx="110" cy="30" r="5" fill="none" stroke="#C8963A" stroke-width="2"/>
    <line x1="107" y1="30" x2="113" y2="30" stroke="#C8963A" stroke-width="1.5"/>
    <line x1="110" y1="27" x2="110" y2="33" stroke="#C8963A" stroke-width="1.5"/>
    <text x="98" y="27" font-size="8" fill="#C8963A" font-family="-apple-system,sans-serif" font-weight="700">R2</text>
    <line x1="35" y1="30" x2="105" y2="30" stroke="#C8963A" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
    <text x="70" y="24" font-size="7" fill="#C8963A" font-family="-apple-system,sans-serif" text-anchor="middle">1.000"</text>
  </svg>
  <div style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--mut);margin-bottom:4px">Welcome to</div>
  <div style="font-size:30px;font-weight:800;letter-spacing:0.14em;line-height:1;margin-bottom:12px">GROUP<span style="color:var(--teal)">LY</span> <span style="font-size:16px;font-weight:400;letter-spacing:0.06em;color:var(--mut)">by BORE<span style="color:var(--teal)">LY</span></span></div>
  <div style="font-size:14px;color:var(--sub);line-height:1.65;max-width:300px">Upload a target photo. Pan and zoom to align each reticle, then confirm your reference points and bullet holes.</div>
  <label class="btn" style="cursor:pointer;margin-top:8px">
    Choose Photo
    <input type="file" accept="image/*" id="file-input" style="display:none"/>
  </label>
  <div style="font-size:12px;color:var(--mut)">Works best with a photo taken square to the target</div>
</div>

<!-- Main viewport -->
<div id="viewport" style="display:none">
  <img id="photo" src="" alt="target" draggable="false"/>
  <canvas id="overlay-canvas"></canvas>

  <!-- Live group size overlay (draggable) -->
  <div id="group-overlay">
    <div class="go-box">
      <div class="go-brand">
        <svg class="go-logo" width="20" height="20" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(46,196,182,0.5)" stroke-width="4"/>
          <circle cx="50" cy="50" r="30" fill="none" stroke="rgba(46,196,182,0.35)" stroke-width="3"/>
          <circle cx="50" cy="50" r="14" fill="none" stroke="rgba(46,196,182,0.25)" stroke-width="2.5"/>
          <line x1="50" y1="4" x2="50" y2="20" stroke="rgba(240,237,232,0.6)" stroke-width="3" stroke-linecap="round"/>
          <line x1="50" y1="80" x2="50" y2="96" stroke="rgba(240,237,232,0.6)" stroke-width="3" stroke-linecap="round"/>
          <line x1="4" y1="50" x2="20" y2="50" stroke="rgba(240,237,232,0.6)" stroke-width="3" stroke-linecap="round"/>
          <line x1="80" y1="50" x2="96" y2="50" stroke="rgba(240,237,232,0.6)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="50" cy="50" r="4" fill="#2EC4B6"/>
        </svg>
        <span class="go-appname">BORE<span style="color:#2EC4B6">LY</span></span>
      </div>
      <div class="go-shots" id="go-shots">0 shots</div>
      <div class="go-val" id="go-inches">—</div>
      <div class="go-moa" id="go-moa">— MOA</div>
    </div>
  </div>

  <!-- Fixed reticle -->
  <div id="reticle">
    <div class="reticle-ring" id="reticle-ring" style="width:56px;height:56px"></div>
    <div class="reticle-h" id="reticle-h" style="width:80px;color:inherit"></div>
    <div class="reticle-v" id="reticle-v" style="height:80px;color:inherit"></div>
    <div class="reticle-label" id="reticle-label"></div>
  </div>
</div>

<!-- Panel -->
<div id="panel" style="display:none">
  <div id="instr"></div>
  <div id="actions"></div>
</div>

<!-- Results overlay (inside viewport) -->
<div id="results">
  <div class="res-row">
    <div class="res-card"><div class="res-val" id="r-es-in">—</div><div class="res-unit">ES Inches</div></div>
    <div class="res-card"><div class="res-val" id="r-es-moa">—</div><div class="res-unit">ES MOA</div></div>
    <div class="res-card"><div class="res-val" id="r-shots">—</div><div class="res-unit">Shots</div></div>
  </div>
  <div class="res-detail" id="r-detail"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <!-- Shown only when running inside Borely modal -->
    <button class="btn btn-sm btn-teal" id="save-to-borely-btn" style="display:none;font-weight:700">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v14a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      Save to Session
    </button>
    <button class="btn btn-sm btn-export" id="export-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Save Image
    </button>
    <button class="btn btn-sm" id="copy-btn">Copy Results</button>
    <button class="btn-ghost btn-sm" id="add-more">+ Add Impact</button>
    <button class="btn-ghost btn-sm" id="reset-btn">New Photo</button>
  </div>
</div>

<!-- Export toast -->
<div id="export-toast">Image saved!</div>

<script>
// ── Borely integration ────────────────────────────────────────────────────
// Detects when running inside the Borely app as a full-screen modal iframe
const IN_BORELY = window.self !== window.top;

// ── State ─────────────────────────────────────────────────────────────────
const S = {
  tx: 0, ty: 0, scale: 1, minScale: 0.2, maxScale: 12,
  refs: [], impacts: [],
  step: 'idle',
  refDistIn: 1.0, caliberIn: 0.264, distYards: 100,
  lastTouchLen: 0, pinch: null, panStart: null,
};

const vp     = document.getElementById('viewport');
const photo  = document.getElementById('photo');
const oCanvas= document.getElementById('overlay-canvas');
const octx   = oCanvas.getContext('2d');
const reticle= document.getElementById('reticle');

// ── File input ────────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  photo.onload = () => {
    document.getElementById('upload-zone').style.display = 'none';
    vp.style.display = 'block';
    document.getElementById('panel').style.display = 'block';
    const go=document.getElementById('group-overlay'); go.style.display='none'; go.style.left=''; go.style.top=''; go.style.transform='';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fitPhoto();
      resizeOverlay();
      goStep('ref1');
    }));
  };
  photo.src = url;
});

function fitPhoto() {
  const vw = vp.clientWidth, vh = vp.clientHeight;
  const iw = photo.naturalWidth, ih = photo.naturalHeight;
  S.scale = Math.min(vw/iw, vh/ih) * 0.92;
  S.minScale = S.scale * 0.5;
  S.tx = (vw - iw * S.scale) / 2;
  S.ty = (vh - ih * S.scale) / 2;
  applyTransform();
}

function applyTransform() {
  photo.style.transform = `translate(${S.tx}px,${S.ty}px) scale(${S.scale})`;
  drawOverlay();
}

function resizeOverlay() {
  oCanvas.width  = vp.clientWidth;
  oCanvas.height = vp.clientHeight;
  drawOverlay();
}
window.addEventListener('resize', resizeOverlay);

// ── Image ↔ screen coords ─────────────────────────────────────────────────
function imgToScreen(ix, iy) {
  return { x: ix * S.scale + S.tx, y: iy * S.scale + S.ty };
}
function reticleToImg() {
  const cx = vp.clientWidth  / 2;
  const cy = vp.clientHeight / 2;
  return { x: (cx - S.tx) / S.scale, y: (cy - S.ty) / S.scale };
}

// ── Draw overlay (confirmed markers) ─────────────────────────────────────
function drawOverlay() {
  const w = oCanvas.width, h = oCanvas.height;
  octx.clearRect(0, 0, w, h);
  const pxPerInch = getPxPerInch();
  const calR = pxPerInch ? (S.caliberIn/2) * pxPerInch * S.scale : 14;

  // Ref markers
  S.refs.forEach((pt, i) => {
    const s = imgToScreen(pt.x, pt.y);
    const r = 14;
    octx.beginPath(); octx.arc(s.x, s.y, r, 0, Math.PI*2);
    octx.fillStyle = 'rgba(200,150,58,0.2)'; octx.fill();
    octx.strokeStyle = '#C8963A'; octx.lineWidth = 2;
    octx.stroke();
    const arm=r*2.2;
    octx.beginPath();
    octx.moveTo(s.x-arm,s.y); octx.lineTo(s.x-r,s.y);
    octx.moveTo(s.x+r,s.y);   octx.lineTo(s.x+arm,s.y);
    octx.moveTo(s.x,s.y-arm); octx.lineTo(s.x,s.y-r);
    octx.moveTo(s.x,s.y+r);   octx.lineTo(s.x,s.y+arm);
    octx.strokeStyle='#C8963A'; octx.lineWidth=1.5; octx.stroke();
    octx.font='bold 11px -apple-system,sans-serif';
    octx.fillStyle='#C8963A'; octx.textAlign='center';
    octx.fillText(`R${i+1}`, s.x, s.y - r - 4);
  });

  // Ref line
  if (S.refs.length===2) {
    const a=imgToScreen(S.refs[0].x,S.refs[0].y);
    const b=imgToScreen(S.refs[1].x,S.refs[1].y);
    octx.beginPath(); octx.moveTo(a.x,a.y); octx.lineTo(b.x,b.y);
    octx.strokeStyle='rgba(200,150,58,0.5)'; octx.lineWidth=1.5;
    octx.setLineDash([6,4]); octx.stroke(); octx.setLineDash([]);
  }

  // Impact circles
  S.impacts.forEach((pt, i) => {
    const s = imgToScreen(pt.x, pt.y);
    octx.beginPath(); octx.arc(s.x, s.y, calR, 0, Math.PI*2);
    octx.fillStyle = 'rgba(46,196,182,0.18)'; octx.fill();
    octx.strokeStyle = '#2EC4B6'; octx.lineWidth = 2; octx.stroke();
    octx.beginPath(); octx.arc(s.x, s.y, 3, 0, Math.PI*2);
    octx.fillStyle='#2EC4B6'; octx.fill();
    octx.font='bold 11px -apple-system,sans-serif';
    octx.fillStyle='#2EC4B6'; octx.textAlign='center';
    octx.fillText(i+1, s.x, s.y - calR - 4);
  });

  // Group bounding box
  if (S.impacts.length>=2 && pxPerInch) {
    const scr = S.impacts.map(p=>imgToScreen(p.x,p.y));
    const xs=scr.map(s=>s.x), ys=scr.map(s=>s.y);
    const x0=Math.min(...xs)-calR, y0=Math.min(...ys)-calR;
    octx.strokeStyle='rgba(106,138,90,0.4)'; octx.lineWidth=1.5;
    octx.setLineDash([5,4]);
    octx.strokeRect(x0,y0,Math.max(...xs)+calR-x0,Math.max(...ys)+calR-y0);
    octx.setLineDash([]);
  }
}

function updateLiveOverlay() {
  const overlay = document.getElementById('group-overlay');
  const ppi = getPxPerInch();
  if (!ppi || S.impacts.length < 2) { overlay.style.display='none'; return; }
  overlay.style.display = 'block';

  let maxD=0;
  for(let i=0;i<S.impacts.length;i++)
    for(let j=i+1;j<S.impacts.length;j++){
      const dx=S.impacts[i].x-S.impacts[j].x, dy=S.impacts[i].y-S.impacts[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d>maxD) maxD=d;
    }
  const esIn = maxD/ppi;
  const yards = S.distYards||100;
  const esMOA = esIn * 100/(yards*1.047);

  document.getElementById('go-shots').textContent = S.impacts.length+' shot'+(S.impacts.length!==1?'s':'');
  document.getElementById('go-inches').textContent = esIn.toFixed(3)+'"';
  document.getElementById('go-moa').textContent = esMOA.toFixed(2)+' MOA';
}

// Draggable overlay
(function(){
  const el = document.getElementById('group-overlay');
  let dragging=false, startX=0, startY=0, origLeft=0, origTop=0;
  el.addEventListener('mousedown', e=>{
    dragging=true;
    const r=el.getBoundingClientRect(), pr=vp.getBoundingClientRect();
    origLeft=r.left-pr.left; origTop=r.top-pr.top;
    startX=e.clientX; startY=e.clientY;
    el.style.transform='none';
    el.style.left=origLeft+'px'; el.style.top=origTop+'px';
    e.stopPropagation();
  });
  window.addEventListener('mousemove', e=>{
    if(!dragging) return;
    el.style.left=(origLeft+e.clientX-startX)+'px';
    el.style.top=(origTop+e.clientY-startY)+'px';
  });
  window.addEventListener('mouseup', ()=>dragging=false);
  el.addEventListener('touchstart', e=>{
    dragging=true;
    const r=el.getBoundingClientRect(), pr=vp.getBoundingClientRect();
    origLeft=r.left-pr.left; origTop=r.top-pr.top;
    startX=e.touches[0].clientX; startY=e.touches[0].clientY;
    el.style.transform='none';
    el.style.left=origLeft+'px'; el.style.top=origTop+'px';
    e.stopPropagation();
  },{passive:true});
  window.addEventListener('touchmove', e=>{
    if(!dragging) return;
    el.style.left=(origLeft+e.touches[0].clientX-startX)+'px';
    el.style.top=(origTop+e.touches[0].clientY-startY)+'px';
  },{passive:true});
  window.addEventListener('touchend', ()=>dragging=false);
})();

function getPxPerInch() {
  if (S.refs.length<2) return null;
  const dx=(S.refs[1].x-S.refs[0].x), dy=(S.refs[1].y-S.refs[0].y);
  return Math.sqrt(dx*dx+dy*dy) / S.refDistIn;
}

// ── Pan / pinch ───────────────────────────────────────────────────────────
vp.addEventListener('mousedown', e=>{
  S.panStart={cx:e.clientX,cy:e.clientY,tx:S.tx,ty:S.ty};
});
window.addEventListener('mousemove', e=>{
  if(!S.panStart)return;
  S.tx=S.panStart.tx+(e.clientX-S.panStart.cx);
  S.ty=S.panStart.ty+(e.clientY-S.panStart.cy);
  applyTransform();
});
window.addEventListener('mouseup',()=>{S.panStart=null;});

vp.addEventListener('wheel', e=>{
  e.preventDefault();
  const delta=e.deltaY>0?0.88:1.14;
  const ns=Math.min(S.maxScale,Math.max(S.minScale,S.scale*delta));
  const cx=vp.clientWidth/2, cy=vp.clientHeight/2;
  S.tx=cx-(cx-S.tx)*(ns/S.scale);
  S.ty=cy-(cy-S.ty)*(ns/S.scale);
  S.scale=ns;
  applyTransform();
},{passive:false});

vp.addEventListener('touchstart', e=>{
  e.preventDefault();
  if(e.touches.length===2){
    S.pinch={dist:tDist(e.touches),scale:S.scale,tx:S.tx,ty:S.ty,
      cx:(e.touches[0].clientX+e.touches[1].clientX)/2,
      cy:(e.touches[0].clientY+e.touches[1].clientY)/2};
    S.panStart=null;
  } else {
    S.panStart={cx:e.touches[0].clientX,cy:e.touches[0].clientY,tx:S.tx,ty:S.ty};
    S.pinch=null;
  }
},{passive:false});

vp.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(e.touches.length===2 && S.pinch){
    const nd=tDist(e.touches);
    const ns=Math.min(S.maxScale,Math.max(S.minScale,S.pinch.scale*(nd/S.pinch.dist)));
    const r=vp.getBoundingClientRect();
    const cx=S.pinch.cx-r.left, cy=S.pinch.cy-r.top;
    S.tx=cx-(cx-S.pinch.tx)*(ns/S.pinch.scale);
    S.ty=cy-(cy-S.pinch.ty)*(ns/S.pinch.scale);
    S.scale=ns;
    applyTransform();
  } else if(e.touches.length===1 && S.panStart){
    S.tx=S.panStart.tx+(e.touches[0].clientX-S.panStart.cx);
    S.ty=S.panStart.ty+(e.touches[0].clientY-S.panStart.cy);
    applyTransform();
  }
},{passive:false});

vp.addEventListener('touchend', ()=>{S.panStart=null;S.pinch=null;},{passive:true});

function tDist(t){const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy);}

  {label:'.50 BMG',v:'0.510'},{label:'9mm / .355',v:'0.355'},

function goStep(step) {
  S.step = step;
  const instr = document.getElementById('instr');
  const actions = document.getElementById('actions');
  const pill = document.getElementById('step-pill');
  reticle.style.display = 'none';

  actions.innerHTML = '';
  instr.innerHTML = '';

  if (step === 'ref1') {
    pill.textContent = 'Step 1 of 5';
    setReticle('#C8963A', 'R1');
    instr.innerHTML = '<strong style="color:var(--text)">Pan and zoom</strong> until Reference Point 1 is centered on the reticle, then tap <strong style="color:var(--amber)">Set R1</strong>.';
    addBtn(actions, 'Set R1', 'btn-sm', () => {
      S.refs[0] = reticleToImg();
      drawOverlay();
      goStep('ref2');
    }, {style:'background:var(--amber);color:#0C0B0A'});
    addBtn(actions, 'Cancel', 'btn-ghost btn-sm', reset);

  } else if (step === 'ref2') {
    pill.textContent = 'Step 2 of 5';
    setReticle('#C8963A', 'R2');
    instr.innerHTML = 'Pan to the <strong style="color:var(--text)">second reference point</strong> — the other end of your known distance — then tap <strong style="color:var(--amber)">Set R2</strong>.';
    addBtn(actions, 'Set R2', 'btn-sm', () => {
      S.refs[1] = reticleToImg();
      drawOverlay();
      goStep('refDist');
    }, {style:'background:var(--amber);color:#0C0B0A'});
    addBtn(actions, '← Redo R1', 'btn-ghost btn-sm', ()=>goStep('ref1'));

  } else if (step === 'refDist') {
    pill.textContent = 'Step 3 of 5';
    instr.innerHTML = 'How far apart are your two reference points?';
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap';
    const inp = document.createElement('input');
    inp.type='number'; inp.className='input-sm'; inp.value='1.000'; inp.min='0.01'; inp.step='0.001';
    inp.addEventListener('input', ()=>S.refDistIn=parseFloat(inp.value)||1);
    const span = document.createElement('span');
    span.style.cssText='font-size:13px;color:var(--sub)'; span.textContent='inch';
    row.appendChild(inp); row.appendChild(span);
    actions.appendChild(row);
    addBtn(actions, 'Next →', 'btn-sm', ()=>{ S.refDistIn=parseFloat(inp.value)||1; drawOverlay(); goStep('caliber'); });
    addBtn(actions, '← Redo R2', 'btn-ghost btn-sm', ()=>goStep('ref2'));

  } else if (step === 'caliber') {
    pill.textContent = 'Step 4 of 5';
    instr.innerHTML = 'Select your <strong style="color:var(--text)">bullet caliber</strong> — sets the size of the impact circle.';
    const sel = document.createElement('select');
    sel.className='input-sm';
    CALIBERS.forEach(c=>{
      const o=document.createElement('option');
      o.value=c.v; o.textContent=c.label;
      if(c.v==='0.264') o.selected=true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', ()=>{ S.caliberIn=parseFloat(sel.value); drawOverlay(); });
    actions.appendChild(sel);
    addBtn(actions, 'Next →', 'btn-sm', ()=>{ S.caliberIn=parseFloat(sel.value); goStep('impact'); });

  } else if (step === 'impact') {
    const n = S.impacts.length;
    pill.textContent = n===0 ? 'Step 5 of 5' : `${n} impact${n!==1?'s':''}`;
    setReticle('#2EC4B6', `#${n+1}`);
    instr.innerHTML = n===0
      ? '<strong style="color:var(--text)">Pan and zoom</strong> until the reticle is centered on the first bullet hole. The teal circle shows the impact size. Tap <strong style="color:var(--teal)">Mark Impact</strong> to confirm.'
      : `<strong style="color:var(--text)">${n} marked.</strong> Pan to the next bullet hole and tap <strong style="color:var(--teal)">Mark Impact</strong>, or tap <strong style="color:var(--amber)">Calculate</strong> when done.`;
    addBtn(actions, 'Mark Impact', 'btn-sm', ()=>{
      S.impacts.push(reticleToImg());
      drawOverlay();
      updateLiveOverlay();
      goStep('impact');
    }, {style:'background:var(--teal);color:#0C0B0A'});
    if(n>=2) addBtn(actions, 'Calculate →', 'btn-sm', calculate);
    if(n>0)  addBtn(actions, 'Undo Last', 'btn-ghost btn-sm', ()=>{S.impacts.pop();drawOverlay();updateLiveOverlay();goStep('impact');});
    addBtn(actions, 'New Photo', 'btn-ghost btn-sm', reset);

  } else if (step === 'done') {
    // handled by results overlay
  }
}

// ── Calculate ─────────────────────────────────────────────────────────────
function calculate() {
  const ppi=getPxPerInch();
  if(!ppi||S.impacts.length<2) return;
  const yards=S.distYards;

  let maxD=0,fp=[0,1];
  for(let i=0;i<S.impacts.length;i++)
    for(let j=i+1;j<S.impacts.length;j++){
      const dx=S.impacts[i].x-S.impacts[j].x, dy=S.impacts[i].y-S.impacts[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d>maxD){maxD=d;fp=[i,j];}
    }

  const esIn=maxD/ppi;
  const mf=100/(yards*1.047);
  const esMOA=esIn*mf;

  const cx=S.impacts.reduce((s,p)=>s+p.x,0)/S.impacts.length;
  const cy=S.impacts.reduce((s,p)=>s+p.y,0)/S.impacts.length;
  const mrIn=S.impacts.reduce((s,p)=>{const dx=p.x-cx,dy=p.y-cy;return s+Math.sqrt(dx*dx+dy*dy);},0)/S.impacts.length/ppi;

  document.getElementById('r-es-in').textContent=esIn.toFixed(3)+'"';
  document.getElementById('r-es-moa').textContent=esMOA.toFixed(2);
  document.getElementById('r-shots').textContent=S.impacts.length;
  document.getElementById('r-detail').innerHTML=
    `<strong>Extreme Spread:</strong> ${esIn.toFixed(3)}" &middot; ${esMOA.toFixed(2)} MOA &middot; shots ${fp[0]+1} &amp; ${fp[1]+1}<br>`+
    `<strong>Mean Radius:</strong> ${mrIn.toFixed(3)}" &middot; ${(mrIn*mf).toFixed(2)} MOA<br>`+
    `<strong>Scale:</strong> ${ppi.toFixed(1)} px/in &middot; ${S.refDistIn}" ref &middot; ${yards} yds`;

  document.getElementById('results').style.display='block';

  // Store calculated results for export
  S.lastCalc = { esIn, esMOA, mrIn, mrMOA: mrIn*mf, fp, ppi, yards };

  drawOverlay();
  const a=imgToScreen(S.impacts[fp[0]].x,S.impacts[fp[0]].y);
  const b=imgToScreen(S.impacts[fp[1]].x,S.impacts[fp[1]].y);
  octx.beginPath(); octx.moveTo(a.x,a.y); octx.lineTo(b.x,b.y);
  octx.strokeStyle='rgba(192,48,48,.8)'; octx.lineWidth=2;
  octx.setLineDash([6,3]); octx.stroke(); octx.setLineDash([]);

  showYardsInput();
}

function showYardsInput() {
  const res=document.getElementById('results');
  if(res.querySelector('#yards-row')) return;
  const row=document.createElement('div');
  row.id='yards-row';
  row.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--sub)';
  row.innerHTML='Distance: <input class="input-sm" type="number" id="yards-inp" value="100" min="1" style="width:64px"/> yards';
  res.insertBefore(row, res.firstChild);
  document.getElementById('yards-inp').addEventListener('change', e=>{
    S.distYards=parseFloat(e.target.value)||100;
    calculate();
  });
}

function drawBorelyLogo(ctx, x, y, height) {
  // Draw "BORELY" wordmark with the teal Y
  const fontSize = height * 0.7;
  ctx.save();
  ctx.font = `800 ${fontSize}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  // "BORE" in white
  ctx.fillStyle = '#F0EDE8';
  ctx.fillText('BORE', x, y);
  const boreW = ctx.measureText('BORE').width;

  // "LY" in teal
  ctx.fillStyle = '#2EC4B6';
  ctx.fillText('LY', x + boreW, y);

  ctx.restore();
  return boreW + ctx.measureText('LY').width;
}

function exportImage() {
  if (!photo.naturalWidth || S.impacts.length < 2 || !S.lastCalc) return;
  buildExportCanvas(dataUrl => {
    const { esIn, esMOA, yards } = S.lastCalc;
    const nShots = S.impacts.length;
    fetch(dataUrl).then(r => r.blob()).then(blob => {
      const file = new File([blob], `grouply-${Date.now()}.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({
          files: [file],
          title: 'GroupLY Result',
          text: `${esIn.toFixed(3)}" / ${esMOA.toFixed(2)} MOA · ${nShots} shots · ${yards}yds`
        }).then(() => showToast('Image shared!'))
          .catch(err => { if (err.name !== 'AbortError') fallbackDownload(blob); });
      } else {
        fallbackDownload(blob);
      }
    });
  });
}

// ── Build export canvas (used by both exportImage and saveToBorely) ───────
// Draws photo + annotations + branded banner; calls callback(dataUrl: string)
function buildExportCanvas(callback) {
  if (!photo.naturalWidth || S.impacts.length < 2 || !S.lastCalc) return;
  const iw = photo.naturalWidth, ih = photo.naturalHeight;
  const ppi = S.lastCalc.ppi;
  const calR = (S.caliberIn / 2) * ppi;
  const ec = document.createElement('canvas');
  ec.width = iw; ec.height = ih;
  const ex = ec.getContext('2d');

  // 1. Photo
  ex.drawImage(photo, 0, 0, iw, ih);

  // 2. Impact circles
  S.impacts.forEach((pt, i) => {
    ex.beginPath(); ex.arc(pt.x, pt.y, calR, 0, Math.PI * 2);
    ex.fillStyle = 'rgba(46,196,182,0.18)'; ex.fill();
    ex.strokeStyle = '#2EC4B6'; ex.lineWidth = Math.max(3, iw / 600); ex.stroke();
    ex.beginPath(); ex.arc(pt.x, pt.y, Math.max(4, iw / 500), 0, Math.PI * 2);
    ex.fillStyle = '#2EC4B6'; ex.fill();
    const labelSize = Math.max(16, iw / 120);
    ex.font = `bold ${labelSize}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;
    ex.fillStyle = '#2EC4B6'; ex.textAlign = 'center';
    ex.fillText(i + 1, pt.x, pt.y - calR - labelSize * 0.4);
  });

  // 3. ES line
  const fp = S.lastCalc.fp;
  const pa = S.impacts[fp[0]], pb = S.impacts[fp[1]];
  ex.beginPath(); ex.moveTo(pa.x, pa.y); ex.lineTo(pb.x, pb.y);
  ex.strokeStyle = 'rgba(192,48,48,0.8)'; ex.lineWidth = Math.max(3, iw / 500);
  ex.setLineDash([Math.max(8, iw / 200), Math.max(4, iw / 400)]);
  ex.stroke(); ex.setLineDash([]);

  // 4. Bounding box
  const xs = S.impacts.map(p => p.x), ys = S.impacts.map(p => p.y);
  const bx0=Math.min(...xs)-calR, by0=Math.min(...ys)-calR;
  const bx1=Math.max(...xs)+calR, by1=Math.max(...ys)+calR;
  ex.strokeStyle='rgba(106,138,90,0.5)'; ex.lineWidth=Math.max(2,iw/800);
  ex.setLineDash([Math.max(6,iw/250),Math.max(5,iw/300)]);
  ex.strokeRect(bx0,by0,bx1-bx0,by1-by0); ex.setLineDash([]);

  // 5. Branded banner
  const bannerH=Math.max(100,ih*0.1), bannerY=ih-bannerH;
  const pad=bannerH*0.15, fontSize=bannerH*0.22, smallFont=bannerH*0.15;
  ex.fillStyle='rgba(12,11,10,0.82)'; ex.fillRect(0,bannerY,iw,bannerH);
  ex.fillStyle='rgba(56,52,44,0.8)'; ex.fillRect(0,bannerY,iw,2);
  ex.fillStyle='#2EC4B6'; ex.fillRect(0,bannerY,iw,Math.max(3,bannerH*0.03));
  const logoFontSize=bannerH*0.55*0.42, logoY=bannerY+bannerH/2, logoX=pad*1.5;
  ex.save();
  ex.font=`800 ${logoFontSize}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;
  ex.textAlign='left'; ex.textBaseline='middle';
  ex.fillStyle='#F0EDE8'; ex.fillText('BORE',logoX,logoY-logoFontSize*0.35);
  const boreW=ex.measureText('BORE').width;
  ex.fillStyle='#2EC4B6'; ex.fillText('LY',logoX+boreW,logoY-logoFontSize*0.35);
  ex.font=`600 ${logoFontSize*0.45}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;
  ex.fillStyle='rgba(156,148,136,0.9)'; ex.fillText('GroupLY',logoX,logoY+logoFontSize*0.45);
  ex.restore();
  const { esIn, esMOA, mrIn, mrMOA, yards } = S.lastCalc;
  const nShots=S.impacts.length, rX=iw-pad*1.5;
  ex.textAlign='right';
  ex.font=`bold ${fontSize*1.1}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;
  ex.fillStyle='#F0EDE8'; ex.fillText(`${esIn.toFixed(3)}"`,rX,bannerY+pad+fontSize*0.9);
  ex.font=`bold ${fontSize*0.85}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;
  ex.fillStyle='#2EC4B6'; ex.fillText(`${esMOA.toFixed(2)} MOA`,rX,bannerY+pad+fontSize*1.9);
  ex.font=`${smallFont}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;
  ex.fillStyle='rgba(156,148,136,0.9)';
  ex.fillText(`${nShots} shots · ${yards} yds · MR: ${mrIn.toFixed(3)}" / ${mrMOA.toFixed(2)} MOA`,rX,bannerY+bannerH-pad*1.1);
  const ctrX=iw/2, ctrY=bannerY+bannerH/2, iconR=bannerH*0.18;
  ex.strokeStyle='rgba(106,138,90,0.35)'; ex.lineWidth=Math.max(2,bannerH*0.02);
  ex.beginPath(); ex.arc(ctrX,ctrY,iconR,0,Math.PI*2); ex.stroke();
  const armLen=iconR*1.4;
  ex.beginPath();
  ex.moveTo(ctrX-armLen,ctrY); ex.lineTo(ctrX-iconR*0.3,ctrY);
  ex.moveTo(ctrX+iconR*0.3,ctrY); ex.lineTo(ctrX+armLen,ctrY);
  ex.moveTo(ctrX,ctrY-armLen); ex.lineTo(ctrX,ctrY-iconR*0.3);
  ex.moveTo(ctrX,ctrY+iconR*0.3); ex.lineTo(ctrX,ctrY+armLen);
  ex.stroke();

  callback(ec.toDataURL('image/jpeg', 0.88));
}

function fallbackDownload(blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `grouply-${Date.now()}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Image saved!');
}

function showToast(msg) {
  const toast = document.getElementById('export-toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

  S.lastCalc = null;
  document.getElementById('results').style.display='none';
  document.getElementById('group-overlay').style.display='none';
  document.getElementById('viewport').style.display='none';
  document.getElementById('panel').style.display='none';
  document.getElementById('upload-zone').style.display='flex';
  document.getElementById('file-input').value='';
  document.getElementById('step-pill').textContent='Upload';
  reticle.style.display='none';
}

// Initial
S.distYards=100;
S.lastCalc=null;

// ── Borely iframe init ─────────────────────────────────────────────────────
if (IN_BORELY) {
  // Show the "Save to Session" button, de-emphasize Save Image
  document.getElementById('save-to-borely-btn').style.display = 'inline-flex';
  document.getElementById('save-to-borely-btn').style.alignItems = 'center';
  // Add a close/cancel button to the header
  const hdr = document.querySelector('header');
  const closeBtn = document.createElement('button');
  closeBtn.textContent = '✕ Cancel';
  closeBtn.style.cssText = 'background:transparent;border:1px solid rgba(240,237,232,0.25);color:rgba(240,237,232,0.6);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;letter-spacing:0.04em';
  closeBtn.addEventListener('click', () => {
    window.parent.postMessage({ type: 'grouply_cancel' }, '*');
  });
  hdr.appendChild(closeBtn);
}

// ── Save to Borely ─────────────────────────────────────────────────────────
document.getElementById('save-to-borely-btn').addEventListener('click', saveToBorely);

function saveToBorely() {
  if (!S.lastCalc) return;
  const btn = document.getElementById('save-to-borely-btn');
  btn.textContent = 'Rendering…';
  btn.disabled = true;

  // Build the export canvas (same pipeline as exportImage)
  buildExportCanvas(dataUrl => {
    const { esIn, esMOA, mrIn, mrMOA, yards } = S.lastCalc;
    const nShots = S.impacts.length;
    window.parent.postMessage({
      type: 'grouply_result',
      esIn: parseFloat(esIn.toFixed(4)),
      esMOA: parseFloat(esMOA.toFixed(3)),
      mrIn: parseFloat(mrIn.toFixed(4)),
      mrMOA: parseFloat(mrMOA.toFixed(3)),
      yards,
      nShots,
      photo: dataUrl,
    }, '*');
    // Button feedback while parent closes modal
    btn.textContent = '✓ Saved!';
  });
}

</script>
</body>
</html>
