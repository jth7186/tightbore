const GROUPLY_HTML = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\"/>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, user-scalable=no\"/>\n  <title>GroupLY \u2014 Group Size Measurement by Borely</title>\n  <style>\n    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}\n    :root{\n      --bg:#0C0B0A;--surf:#1A1814;--bdr:#38342C;\n      --text:#F0EDE8;--sub:#9C9488;--mut:#5C5850;\n      --acc:#6A8A5A;--acc-light:#8AAA78;--acc-dim:#1E2C1A;--acc-bdr:#3A5830;\n      --teal:#2EC4B6;--amber:#C8963A;--amberbg:#2C1E0A;--amberbdr:#6A4A18;\n      --danger:#C03030;\n    }\n    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}\n\n    header{background:var(--surf);border-bottom:1px solid var(--bdr);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10}\n    .brand{font-size:18px;font-weight:700;letter-spacing:0.14em}\n    .brand span{color:var(--teal)}\n    .step-pill{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#fff;background:var(--acc);border-radius:20px;padding:4px 12px}\n\n    /* Upload */\n    #upload-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 24px;text-align:center}\n\n    /* Viewport \u2014 fixed size, image moves inside */\n    #viewport{flex:1;position:relative;overflow:hidden;background:#111;touch-action:none;cursor:grab;min-height:0}\n    #viewport:active{cursor:grabbing}\n    #photo{position:absolute;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-select:none;pointer-events:none}\n\n    /* Fixed reticle \u2014 always center of viewport */\n    #reticle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:5;display:none}\n    .reticle-ring{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid;animation:pulse 1.5s ease-in-out infinite}\n    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}\n    .reticle-h,.reticle-v{position:absolute;background:currentColor}\n    .reticle-h{top:50%;left:0;right:0;height:1.5px;transform:translateY(-50%)}\n    .reticle-v{left:50%;top:0;bottom:0;width:1.5px;transform:translateX(-50%)}\n    .reticle-label{position:absolute;top:50%;left:50%;transform:translate(14px,-50%);font-size:13px;font-weight:700;letter-spacing:0.06em;white-space:nowrap;text-shadow:0 1px 4px #000}\n\n    /* Confirmed markers drawn on overlay canvas */\n    #overlay-canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:4}\n\n    /* Bottom panel */\n    #panel{background:var(--surf);border-top:1px solid var(--bdr);flex-shrink:0;z-index:10;min-height:90px}\n    #instr{padding:10px 16px 6px;font-size:13px;color:var(--sub);line-height:1.5;min-height:40px}\n    #actions{display:flex;gap:8px;padding:8px 16px 14px;align-items:center;flex-wrap:wrap;overflow-x:auto;-webkit-overflow-scrolling:touch}\n    .btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:12px 24px;font-size:15px;font-weight:500;cursor:pointer;flex-shrink:0}\n    .btn:hover{background:var(--acc-light)}\n    .btn:disabled{opacity:0.4;cursor:default}\n    .btn-teal{background:var(--teal);color:#0C0B0A}\n    .btn-teal:hover{background:#3DDDD0}\n    .btn-ghost{background:transparent;border:1px solid var(--bdr);color:var(--sub);border-radius:8px;padding:10px 16px;font-size:13px;cursor:pointer}\n    .btn-ghost:hover{border-color:var(--sub);color:var(--text)}\n    .btn-sm{padding:8px 14px;font-size:13px;border-radius:6px}\n    .badge{display:inline-flex;align-items:center;border-radius:4px;padding:4px 9px;font-size:12px;letter-spacing:0.04em;white-space:nowrap}\n    .badge-ref{background:var(--amberbg);border:1px solid var(--amberbdr);color:var(--amber)}\n    .badge-impact{background:rgba(46,196,182,.12);border:1px solid rgba(46,196,182,.3);color:var(--teal)}\n    .input-sm{background:var(--bg);border:1px solid var(--bdr);border-radius:6px;color:var(--text);padding:8px 10px;font-size:14px;width:72px;text-align:center}\n    select.input-sm{width:auto;min-width:130px;text-align:left}\n\n    /* Live group overlay \u2014 draggable, on canvas */\n    #group-overlay{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:8;cursor:grab;display:none;user-select:none;-webkit-user-select:none;touch-action:none}\n    #group-overlay:active{cursor:grabbing}\n    .go-box{background:rgba(12,11,10,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(240,237,232,0.18);border-radius:10px;padding:10px 16px;text-align:center;min-width:140px}\n    .go-shots{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(240,237,232,0.55);margin-bottom:4px}\n    .go-brand{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid rgba(240,237,232,0.1)}\n    .go-logo{flex-shrink:0}\n    .go-appname{font-size:12px;font-weight:800;letter-spacing:0.14em;color:#F0EDE8}\n    .go-val{font-size:22px;font-weight:700;color:#F0EDE8;line-height:1;font-variant-numeric:tabular-nums}\n    .go-moa{font-size:13px;color:rgba(46,196,182,0.9);margin-top:2px;font-variant-numeric:tabular-nums}\n\n    /* Results overlay */\n    #results{display:none;position:absolute;bottom:0;left:0;right:0;background:rgba(12,11,10,.95);border-top:1px solid var(--bdr);padding:16px;z-index:20}\n    .res-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}\n    .res-card{background:var(--surf);border:1px solid var(--bdr);border-radius:8px;padding:10px;text-align:center}\n    .res-val{font-size:20px;font-weight:700;color:var(--text);line-height:1}\n    .res-unit{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.10em;margin-top:3px}\n    .res-detail{font-size:12px;color:var(--sub);line-height:1.8;margin-bottom:10px}\n\n    /* Export button special style */\n    .btn-export{background:linear-gradient(135deg,#2EC4B6,#1A9E92);color:#0C0B0A;font-weight:600;position:relative;overflow:hidden}\n    .btn-export:hover{background:linear-gradient(135deg,#3DDDD0,#2EC4B6)}\n    .btn-export svg{vertical-align:-2px;margin-right:4px}\n\n    /* Export toast */\n    #export-toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(46,196,182,0.95);color:#0C0B0A;font-size:14px;font-weight:600;padding:10px 20px;border-radius:20px;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.3s;white-space:nowrap}\n    #export-toast.show{opacity:1}\n  </style>\n</head>\n<body>\n\n<header>\n  <div class=\"brand\">GROUP<span>LY</span> <span style=\"font-size:13px;color:var(--mut);font-weight:400;letter-spacing:0.04em\">by BORE<span style=\"color:var(--teal)\">LY</span></span></div>\n  <span class=\"step-pill\" id=\"step-pill\">Upload</span>\n</header>\n\n<!-- Upload -->\n<div id=\"upload-zone\">\n  <svg width=\"140\" height=\"140\" viewBox=\"0 0 140 140\" xmlns=\"http://www.w3.org/2000/svg\" style=\"margin-bottom:4px\">\n    <circle cx=\"70\" cy=\"70\" r=\"66\" fill=\"none\" stroke=\"#38342C\" stroke-width=\"1.5\"/>\n    <circle cx=\"70\" cy=\"70\" r=\"52\" fill=\"none\" stroke=\"#38342C\" stroke-width=\"1.5\"/>\n    <circle cx=\"70\" cy=\"70\" r=\"38\" fill=\"none\" stroke=\"#38342C\" stroke-width=\"1.5\"/>\n    <circle cx=\"70\" cy=\"70\" r=\"24\" fill=\"none\" stroke=\"#38342C\" stroke-width=\"1.5\"/>\n    <circle cx=\"70\" cy=\"70\" r=\"10\" fill=\"#C03030\" opacity=\"0.7\"/>\n    <line x1=\"70\" y1=\"4\" x2=\"70\" y2=\"34\" stroke=\"#5C5850\" stroke-width=\"1.5\"/>\n    <line x1=\"70\" y1=\"106\" x2=\"70\" y2=\"136\" stroke=\"#5C5850\" stroke-width=\"1.5\"/>\n    <line x1=\"4\" y1=\"70\" x2=\"34\" y2=\"70\" stroke=\"#5C5850\" stroke-width=\"1.5\"/>\n    <line x1=\"106\" y1=\"70\" x2=\"136\" y2=\"70\" stroke=\"#5C5850\" stroke-width=\"1.5\"/>\n    <circle cx=\"62\" cy=\"58\" r=\"5.5\" fill=\"none\" stroke=\"#2EC4B6\" stroke-width=\"2\" opacity=\"0.9\"/>\n    <circle cx=\"62\" cy=\"58\" r=\"1.5\" fill=\"#2EC4B6\"/>\n    <circle cx=\"76\" cy=\"64\" r=\"5.5\" fill=\"none\" stroke=\"#2EC4B6\" stroke-width=\"2\" opacity=\"0.9\"/>\n    <circle cx=\"76\" cy=\"64\" r=\"1.5\" fill=\"#2EC4B6\"/>\n    <circle cx=\"68\" cy=\"74\" r=\"5.5\" fill=\"none\" stroke=\"#2EC4B6\" stroke-width=\"2\" opacity=\"0.9\"/>\n    <circle cx=\"68\" cy=\"74\" r=\"1.5\" fill=\"#2EC4B6\"/>\n    <circle cx=\"58\" cy=\"70\" r=\"5.5\" fill=\"none\" stroke=\"#2EC4B6\" stroke-width=\"2\" opacity=\"0.9\"/>\n    <circle cx=\"58\" cy=\"70\" r=\"1.5\" fill=\"#2EC4B6\"/>\n    <circle cx=\"74\" cy=\"76\" r=\"5.5\" fill=\"none\" stroke=\"#2EC4B6\" stroke-width=\"2\" opacity=\"0.9\"/>\n    <circle cx=\"74\" cy=\"76\" r=\"1.5\" fill=\"#2EC4B6\"/>\n    <line x1=\"58\" y1=\"70\" x2=\"76\" y2=\"64\" stroke=\"#C03030\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\" opacity=\"0.7\"/>\n    <circle cx=\"30\" cy=\"30\" r=\"5\" fill=\"none\" stroke=\"#C8963A\" stroke-width=\"2\"/>\n    <line x1=\"27\" y1=\"30\" x2=\"33\" y2=\"30\" stroke=\"#C8963A\" stroke-width=\"1.5\"/>\n    <line x1=\"30\" y1=\"27\" x2=\"30\" y2=\"33\" stroke=\"#C8963A\" stroke-width=\"1.5\"/>\n    <text x=\"36\" y=\"27\" font-size=\"8\" fill=\"#C8963A\" font-family=\"-apple-system,sans-serif\" font-weight=\"700\">R1</text>\n    <circle cx=\"110\" cy=\"30\" r=\"5\" fill=\"none\" stroke=\"#C8963A\" stroke-width=\"2\"/>\n    <line x1=\"107\" y1=\"30\" x2=\"113\" y2=\"30\" stroke=\"#C8963A\" stroke-width=\"1.5\"/>\n    <line x1=\"110\" y1=\"27\" x2=\"110\" y2=\"33\" stroke=\"#C8963A\" stroke-width=\"1.5\"/>\n    <text x=\"98\" y=\"27\" font-size=\"8\" fill=\"#C8963A\" font-family=\"-apple-system,sans-serif\" font-weight=\"700\">R2</text>\n    <line x1=\"35\" y1=\"30\" x2=\"105\" y2=\"30\" stroke=\"#C8963A\" stroke-width=\"1\" stroke-dasharray=\"3,2\" opacity=\"0.6\"/>\n    <text x=\"70\" y=\"24\" font-size=\"7\" fill=\"#C8963A\" font-family=\"-apple-system,sans-serif\" text-anchor=\"middle\">1.000\"</text>\n  </svg>\n  <div style=\"font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--mut);margin-bottom:4px\">Welcome to</div>\n  <div style=\"font-size:30px;font-weight:800;letter-spacing:0.14em;line-height:1;margin-bottom:12px\">GROUP<span style=\"color:var(--teal)\">LY</span> <span style=\"font-size:16px;font-weight:400;letter-spacing:0.06em;color:var(--mut)\">by BORE<span style=\"color:var(--teal)\">LY</span></span></div>\n  <div style=\"font-size:14px;color:var(--sub);line-height:1.65;max-width:300px\">Upload a target photo. Pan and zoom to align each reticle, then confirm your reference points and bullet holes.</div>\n  <label class=\"btn\" style=\"cursor:pointer;margin-top:8px\">\n    Choose Photo\n    <input type=\"file\" accept=\"image/*\" id=\"file-input\" style=\"display:none\"/>\n  </label>\n  <div style=\"font-size:12px;color:var(--mut)\">Works best with a photo taken square to the target</div>\n</div>\n\n<!-- Main viewport -->\n<div id=\"viewport\" style=\"display:none\">\n  <img id=\"photo\" src=\"\" alt=\"target\" draggable=\"false\"/>\n  <canvas id=\"overlay-canvas\"></canvas>\n\n  <!-- Live group size overlay (draggable) -->\n  <div id=\"group-overlay\">\n    <div class=\"go-box\">\n      <div class=\"go-brand\">\n        <svg class=\"go-logo\" width=\"20\" height=\"20\" viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n          <circle cx=\"50\" cy=\"50\" r=\"46\" fill=\"none\" stroke=\"rgba(46,196,182,0.5)\" stroke-width=\"4\"/>\n          <circle cx=\"50\" cy=\"50\" r=\"30\" fill=\"none\" stroke=\"rgba(46,196,182,0.35)\" stroke-width=\"3\"/>\n          <circle cx=\"50\" cy=\"50\" r=\"14\" fill=\"none\" stroke=\"rgba(46,196,182,0.25)\" stroke-width=\"2.5\"/>\n          <line x1=\"50\" y1=\"4\" x2=\"50\" y2=\"20\" stroke=\"rgba(240,237,232,0.6)\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n          <line x1=\"50\" y1=\"80\" x2=\"50\" y2=\"96\" stroke=\"rgba(240,237,232,0.6)\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n          <line x1=\"4\" y1=\"50\" x2=\"20\" y2=\"50\" stroke=\"rgba(240,237,232,0.6)\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n          <line x1=\"80\" y1=\"50\" x2=\"96\" y2=\"50\" stroke=\"rgba(240,237,232,0.6)\" stroke-width=\"3\" stroke-linecap=\"round\"/>\n          <circle cx=\"50\" cy=\"50\" r=\"4\" fill=\"#2EC4B6\"/>\n        </svg>\n        <span class=\"go-appname\">BORE<span style=\"color:#2EC4B6\">LY</span></span>\n      </div>\n      <div class=\"go-shots\" id=\"go-shots\">0 shots</div>\n      <div class=\"go-val\" id=\"go-inches\">\u2014</div>\n      <div class=\"go-moa\" id=\"go-moa\">\u2014 MOA</div>\n    </div>\n  </div>\n\n  <!-- Fixed reticle -->\n  <div id=\"reticle\">\n    <div class=\"reticle-ring\" id=\"reticle-ring\" style=\"width:56px;height:56px\"></div>\n    <div class=\"reticle-h\" id=\"reticle-h\" style=\"width:80px;color:inherit\"></div>\n    <div class=\"reticle-v\" id=\"reticle-v\" style=\"height:80px;color:inherit\"></div>\n    <div class=\"reticle-label\" id=\"reticle-label\"></div>\n  </div>\n</div>\n\n<!-- Panel -->\n<div id=\"panel\" style=\"display:none\">\n  <div id=\"instr\"></div>\n  <div id=\"actions\"></div>\n</div>\n\n<!-- Results overlay (inside viewport) -->\n<div id=\"results\">\n  <div class=\"res-row\">\n    <div class=\"res-card\"><div class=\"res-val\" id=\"r-es-in\">\u2014</div><div class=\"res-unit\">ES Inches</div></div>\n    <div class=\"res-card\"><div class=\"res-val\" id=\"r-es-moa\">\u2014</div><div class=\"res-unit\">ES MOA</div></div>\n    <div class=\"res-card\"><div class=\"res-val\" id=\"r-shots\">\u2014</div><div class=\"res-unit\">Shots</div></div>\n  </div>\n  <div class=\"res-detail\" id=\"r-detail\"></div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n    <!-- Shown only when running inside Borely modal -->\n    <button class=\"btn btn-sm btn-teal\" id=\"save-to-borely-btn\" style=\"display:none;font-weight:700\">\n      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"vertical-align:-2px;margin-right:4px\"><path d=\"M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v14a2 2 0 01-2 2z\"/><polyline points=\"17 21 17 13 7 13 7 21\"/><polyline points=\"7 3 7 8 15 8\"/></svg>\n      Save to Session\n    </button>\n    <button class=\"btn btn-sm btn-export\" id=\"export-btn\">\n      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4\"/><polyline points=\"7 10 12 15 17 10\"/><line x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\"/></svg>\n      Save Image\n    </button>\n    <button class=\"btn btn-sm\" id=\"copy-btn\">Copy Results</button>\n    <button class=\"btn-ghost btn-sm\" id=\"add-more\">+ Add Impact</button>\n    <button class=\"btn-ghost btn-sm\" id=\"reset-btn\">New Photo</button>\n  </div>\n</div>\n\n<!-- Export toast -->\n<div id=\"export-toast\">Image saved!</div>\n\n<script>\n// \u2500\u2500 Borely integration \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// Detects when running inside the Borely app as a full-screen modal iframe\nconst IN_BORELY = window.self !== window.top;\n\n// \u2500\u2500 State \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconst S = {\n  tx: 0, ty: 0, scale: 1, minScale: 0.2, maxScale: 12,\n  refs: [], impacts: [],\n  step: 'idle',\n  refDistIn: 1.0, caliberIn: 0.264, distYards: 100,\n  lastTouchLen: 0, pinch: null, panStart: null,\n};\n\nconst vp     = document.getElementById('viewport');\nconst photo  = document.getElementById('photo');\nconst oCanvas= document.getElementById('overlay-canvas');\nconst octx   = oCanvas.getContext('2d');\nconst reticle= document.getElementById('reticle');\n\n// \u2500\u2500 File input \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndocument.getElementById('file-input').addEventListener('change', e => {\n  const file = e.target.files[0];\n  if (!file) return;\n  const url = URL.createObjectURL(file);\n  photo.onload = () => {\n    document.getElementById('upload-zone').style.display = 'none';\n    vp.style.display = 'block';\n    document.getElementById('panel').style.display = 'block';\n    const go=document.getElementById('group-overlay'); go.style.display='none'; go.style.left=''; go.style.top=''; go.style.transform='';\n    requestAnimationFrame(() => requestAnimationFrame(() => {\n      fitPhoto();\n      resizeOverlay();\n      goStep('ref1');\n    }));\n  };\n  photo.src = url;\n});\n\nfunction fitPhoto() {\n  const vw = vp.clientWidth, vh = vp.clientHeight;\n  const iw = photo.naturalWidth, ih = photo.naturalHeight;\n  S.scale = Math.min(vw/iw, vh/ih) * 0.92;\n  S.minScale = S.scale * 0.5;\n  S.tx = (vw - iw * S.scale) / 2;\n  S.ty = (vh - ih * S.scale) / 2;\n  applyTransform();\n}\n\nfunction applyTransform() {\n  photo.style.transform = `translate(${S.tx}px,${S.ty}px) scale(${S.scale})`;\n  drawOverlay();\n}\n\nfunction resizeOverlay() {\n  oCanvas.width  = vp.clientWidth;\n  oCanvas.height = vp.clientHeight;\n  drawOverlay();\n}\nwindow.addEventListener('resize', resizeOverlay);\n\n// \u2500\u2500 Image \u2194 screen coords \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction imgToScreen(ix, iy) {\n  return { x: ix * S.scale + S.tx, y: iy * S.scale + S.ty };\n}\nfunction reticleToImg() {\n  const cx = vp.clientWidth  / 2;\n  const cy = vp.clientHeight / 2;\n  return { x: (cx - S.tx) / S.scale, y: (cy - S.ty) / S.scale };\n}\n\n// \u2500\u2500 Draw overlay (confirmed markers) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction drawOverlay() {\n  const w = oCanvas.width, h = oCanvas.height;\n  octx.clearRect(0, 0, w, h);\n  const pxPerInch = getPxPerInch();\n  const calR = pxPerInch ? (S.caliberIn/2) * pxPerInch * S.scale : 14;\n\n  // Ref markers\n  S.refs.forEach((pt, i) => {\n    const s = imgToScreen(pt.x, pt.y);\n    const r = 14;\n    octx.beginPath(); octx.arc(s.x, s.y, r, 0, Math.PI*2);\n    octx.fillStyle = 'rgba(200,150,58,0.2)'; octx.fill();\n    octx.strokeStyle = '#C8963A'; octx.lineWidth = 2;\n    octx.stroke();\n    const arm=r*2.2;\n    octx.beginPath();\n    octx.moveTo(s.x-arm,s.y); octx.lineTo(s.x-r,s.y);\n    octx.moveTo(s.x+r,s.y);   octx.lineTo(s.x+arm,s.y);\n    octx.moveTo(s.x,s.y-arm); octx.lineTo(s.x,s.y-r);\n    octx.moveTo(s.x,s.y+r);   octx.lineTo(s.x,s.y+arm);\n    octx.strokeStyle='#C8963A'; octx.lineWidth=1.5; octx.stroke();\n    octx.font='bold 11px -apple-system,sans-serif';\n    octx.fillStyle='#C8963A'; octx.textAlign='center';\n    octx.fillText(`R${i+1}`, s.x, s.y - r - 4);\n  });\n\n  // Ref line\n  if (S.refs.length===2) {\n    const a=imgToScreen(S.refs[0].x,S.refs[0].y);\n    const b=imgToScreen(S.refs[1].x,S.refs[1].y);\n    octx.beginPath(); octx.moveTo(a.x,a.y); octx.lineTo(b.x,b.y);\n    octx.strokeStyle='rgba(200,150,58,0.5)'; octx.lineWidth=1.5;\n    octx.setLineDash([6,4]); octx.stroke(); octx.setLineDash([]);\n  }\n\n  // Impact circles\n  S.impacts.forEach((pt, i) => {\n    const s = imgToScreen(pt.x, pt.y);\n    octx.beginPath(); octx.arc(s.x, s.y, calR, 0, Math.PI*2);\n    octx.fillStyle = 'rgba(46,196,182,0.18)'; octx.fill();\n    octx.strokeStyle = '#2EC4B6'; octx.lineWidth = 2; octx.stroke();\n    octx.beginPath(); octx.arc(s.x, s.y, 3, 0, Math.PI*2);\n    octx.fillStyle='#2EC4B6'; octx.fill();\n    octx.font='bold 11px -apple-system,sans-serif';\n    octx.fillStyle='#2EC4B6'; octx.textAlign='center';\n    octx.fillText(i+1, s.x, s.y - calR - 4);\n  });\n\n  // Group bounding box\n  if (S.impacts.length>=2 && pxPerInch) {\n    const scr = S.impacts.map(p=>imgToScreen(p.x,p.y));\n    const xs=scr.map(s=>s.x), ys=scr.map(s=>s.y);\n    const x0=Math.min(...xs)-calR, y0=Math.min(...ys)-calR;\n    octx.strokeStyle='rgba(106,138,90,0.4)'; octx.lineWidth=1.5;\n    octx.setLineDash([5,4]);\n    octx.strokeRect(x0,y0,Math.max(...xs)+calR-x0,Math.max(...ys)+calR-y0);\n    octx.setLineDash([]);\n  }\n}\n\nfunction updateLiveOverlay() {\n  const overlay = document.getElementById('group-overlay');\n  const ppi = getPxPerInch();\n  if (!ppi || S.impacts.length < 2) { overlay.style.display='none'; return; }\n  overlay.style.display = 'block';\n\n  let maxD=0;\n  for(let i=0;i<S.impacts.length;i++)\n    for(let j=i+1;j<S.impacts.length;j++){\n      const dx=S.impacts[i].x-S.impacts[j].x, dy=S.impacts[i].y-S.impacts[j].y;\n      const d=Math.sqrt(dx*dx+dy*dy);\n      if(d>maxD) maxD=d;\n    }\n  const esIn = maxD/ppi;\n  const yards = S.distYards||100;\n  const esMOA = esIn * 100/(yards*1.047);\n\n  document.getElementById('go-shots').textContent = S.impacts.length+' shot'+(S.impacts.length!==1?'s':'');\n  document.getElementById('go-inches').textContent = esIn.toFixed(3)+'\"';\n  document.getElementById('go-moa').textContent = esMOA.toFixed(2)+' MOA';\n}\n\n// Draggable overlay\n(function(){\n  const el = document.getElementById('group-overlay');\n  let dragging=false, startX=0, startY=0, origLeft=0, origTop=0;\n  el.addEventListener('mousedown', e=>{\n    dragging=true;\n    const r=el.getBoundingClientRect(), pr=vp.getBoundingClientRect();\n    origLeft=r.left-pr.left; origTop=r.top-pr.top;\n    startX=e.clientX; startY=e.clientY;\n    el.style.transform='none';\n    el.style.left=origLeft+'px'; el.style.top=origTop+'px';\n    e.stopPropagation();\n  });\n  window.addEventListener('mousemove', e=>{\n    if(!dragging) return;\n    el.style.left=(origLeft+e.clientX-startX)+'px';\n    el.style.top=(origTop+e.clientY-startY)+'px';\n  });\n  window.addEventListener('mouseup', ()=>dragging=false);\n  el.addEventListener('touchstart', e=>{\n    dragging=true;\n    const r=el.getBoundingClientRect(), pr=vp.getBoundingClientRect();\n    origLeft=r.left-pr.left; origTop=r.top-pr.top;\n    startX=e.touches[0].clientX; startY=e.touches[0].clientY;\n    el.style.transform='none';\n    el.style.left=origLeft+'px'; el.style.top=origTop+'px';\n    e.stopPropagation();\n  },{passive:true});\n  window.addEventListener('touchmove', e=>{\n    if(!dragging) return;\n    el.style.left=(origLeft+e.touches[0].clientX-startX)+'px';\n    el.style.top=(origTop+e.touches[0].clientY-startY)+'px';\n  },{passive:true});\n  window.addEventListener('touchend', ()=>dragging=false);\n})();\n\nfunction getPxPerInch() {\n  if (S.refs.length<2) return null;\n  const dx=(S.refs[1].x-S.refs[0].x), dy=(S.refs[1].y-S.refs[0].y);\n  return Math.sqrt(dx*dx+dy*dy) / S.refDistIn;\n}\n\n// \u2500\u2500 Pan / pinch \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nvp.addEventListener('mousedown', e=>{\n  S.panStart={cx:e.clientX,cy:e.clientY,tx:S.tx,ty:S.ty};\n});\nwindow.addEventListener('mousemove', e=>{\n  if(!S.panStart)return;\n  S.tx=S.panStart.tx+(e.clientX-S.panStart.cx);\n  S.ty=S.panStart.ty+(e.clientY-S.panStart.cy);\n  applyTransform();\n});\nwindow.addEventListener('mouseup',()=>{S.panStart=null;});\n\nvp.addEventListener('wheel', e=>{\n  e.preventDefault();\n  const delta=e.deltaY>0?0.88:1.14;\n  const ns=Math.min(S.maxScale,Math.max(S.minScale,S.scale*delta));\n  const cx=vp.clientWidth/2, cy=vp.clientHeight/2;\n  S.tx=cx-(cx-S.tx)*(ns/S.scale);\n  S.ty=cy-(cy-S.ty)*(ns/S.scale);\n  S.scale=ns;\n  applyTransform();\n},{passive:false});\n\nvp.addEventListener('touchstart', e=>{\n  e.preventDefault();\n  if(e.touches.length===2){\n    S.pinch={dist:tDist(e.touches),scale:S.scale,tx:S.tx,ty:S.ty,\n      cx:(e.touches[0].clientX+e.touches[1].clientX)/2,\n      cy:(e.touches[0].clientY+e.touches[1].clientY)/2};\n    S.panStart=null;\n  } else {\n    S.panStart={cx:e.touches[0].clientX,cy:e.touches[0].clientY,tx:S.tx,ty:S.ty};\n    S.pinch=null;\n  }\n},{passive:false});\n\nvp.addEventListener('touchmove', e=>{\n  e.preventDefault();\n  if(e.touches.length===2 && S.pinch){\n    const nd=tDist(e.touches);\n    const ns=Math.min(S.maxScale,Math.max(S.minScale,S.pinch.scale*(nd/S.pinch.dist)));\n    const r=vp.getBoundingClientRect();\n    const cx=S.pinch.cx-r.left, cy=S.pinch.cy-r.top;\n    S.tx=cx-(cx-S.pinch.tx)*(ns/S.pinch.scale);\n    S.ty=cy-(cy-S.pinch.ty)*(ns/S.pinch.scale);\n    S.scale=ns;\n    applyTransform();\n  } else if(e.touches.length===1 && S.panStart){\n    S.tx=S.panStart.tx+(e.touches[0].clientX-S.panStart.cx);\n    S.ty=S.panStart.ty+(e.touches[0].clientY-S.panStart.cy);\n    applyTransform();\n  }\n},{passive:false});\n\nvp.addEventListener('touchend', ()=>{S.panStart=null;S.pinch=null;},{passive:true});\n\nfunction tDist(t){const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy);}\n\n// \u2500\u2500 Step machine \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconst CALIBERS = [\n  {label:'.17 HMR',v:'0.172'},{label:'.204',v:'0.204'},\n  {label:'.224 / 5.56mm',v:'0.224'},{label:'.243',v:'0.243'},\n  {label:'.257',v:'0.257'},{label:'6.5mm / .264',v:'0.264'},\n  {label:'.277 / 6.8mm',v:'0.277'},{label:'7mm / .284',v:'0.284'},\n  {label:'.308 / 7.62mm',v:'0.308'},{label:'8mm / .323',v:'0.323'},\n  {label:'.338',v:'0.338'},{label:'.375',v:'0.375'},\n  {label:'.416',v:'0.416'},{label:'.458',v:'0.458'},\n  {label:'.50 BMG',v:'0.510'},{label:'9mm / .355',v:'0.355'},\n  {label:'.357 Mag',v:'0.357'},{label:'.40 / 10mm',v:'0.400'},\n  {label:'.45 ACP',v:'0.452'},\n];\n\nfunction goStep(step) {\n  S.step = step;\n  const instr = document.getElementById('instr');\n  const actions = document.getElementById('actions');\n  const pill = document.getElementById('step-pill');\n  reticle.style.display = 'none';\n\n  actions.innerHTML = '';\n  instr.innerHTML = '';\n\n  if (step === 'ref1') {\n    pill.textContent = 'Step 1 of 5';\n    setReticle('#C8963A', 'R1');\n    instr.innerHTML = '<strong style=\"color:var(--text)\">Pan and zoom</strong> until Reference Point 1 is centered on the reticle, then tap <strong style=\"color:var(--amber)\">Set R1</strong>.';\n    addBtn(actions, 'Set R1', 'btn-sm', () => {\n      S.refs[0] = reticleToImg();\n      drawOverlay();\n      goStep('ref2');\n    }, {style:'background:var(--amber);color:#0C0B0A'});\n    addBtn(actions, 'Cancel', 'btn-ghost btn-sm', reset);\n\n  } else if (step === 'ref2') {\n    pill.textContent = 'Step 2 of 5';\n    setReticle('#C8963A', 'R2');\n    instr.innerHTML = 'Pan to the <strong style=\"color:var(--text)\">second reference point</strong> \u2014 the other end of your known distance \u2014 then tap <strong style=\"color:var(--amber)\">Set R2</strong>.';\n    addBtn(actions, 'Set R2', 'btn-sm', () => {\n      S.refs[1] = reticleToImg();\n      drawOverlay();\n      goStep('refDist');\n    }, {style:'background:var(--amber);color:#0C0B0A'});\n    addBtn(actions, '\u2190 Redo R1', 'btn-ghost btn-sm', ()=>goStep('ref1'));\n\n  } else if (step === 'refDist') {\n    pill.textContent = 'Step 3 of 5';\n    instr.innerHTML = 'How far apart are your two reference points?';\n    const row = document.createElement('div');\n    row.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap';\n    const inp = document.createElement('input');\n    inp.type='number'; inp.className='input-sm'; inp.value='1.000'; inp.min='0.01'; inp.step='0.001';\n    inp.addEventListener('input', ()=>S.refDistIn=parseFloat(inp.value)||1);\n    const span = document.createElement('span');\n    span.style.cssText='font-size:13px;color:var(--sub)'; span.textContent='inch';\n    row.appendChild(inp); row.appendChild(span);\n    actions.appendChild(row);\n    addBtn(actions, 'Next \u2192', 'btn-sm', ()=>{ S.refDistIn=parseFloat(inp.value)||1; drawOverlay(); goStep('caliber'); });\n    addBtn(actions, '\u2190 Redo R2', 'btn-ghost btn-sm', ()=>goStep('ref2'));\n\n  } else if (step === 'caliber') {\n    pill.textContent = 'Step 4 of 5';\n    instr.innerHTML = 'Select your <strong style=\"color:var(--text)\">bullet caliber</strong> \u2014 sets the size of the impact circle.';\n    const sel = document.createElement('select');\n    sel.className='input-sm';\n    CALIBERS.forEach(c=>{\n      const o=document.createElement('option');\n      o.value=c.v; o.textContent=c.label;\n      if(c.v==='0.264') o.selected=true;\n      sel.appendChild(o);\n    });\n    sel.addEventListener('change', ()=>{ S.caliberIn=parseFloat(sel.value); drawOverlay(); });\n    actions.appendChild(sel);\n    addBtn(actions, 'Next \u2192', 'btn-sm', ()=>{ S.caliberIn=parseFloat(sel.value); goStep('impact'); });\n\n  } else if (step === 'impact') {\n    const n = S.impacts.length;\n    pill.textContent = n===0 ? 'Step 5 of 5' : `${n} impact${n!==1?'s':''}`;\n    setReticle('#2EC4B6', `#${n+1}`);\n    instr.innerHTML = n===0\n      ? '<strong style=\"color:var(--text)\">Pan and zoom</strong> until the reticle is centered on the first bullet hole. The teal circle shows the impact size. Tap <strong style=\"color:var(--teal)\">Mark Impact</strong> to confirm.'\n      : `<strong style=\"color:var(--text)\">${n} marked.</strong> Pan to the next bullet hole and tap <strong style=\"color:var(--teal)\">Mark Impact</strong>, or tap <strong style=\"color:var(--amber)\">Calculate</strong> when done.`;\n    addBtn(actions, 'Mark Impact', 'btn-sm', ()=>{\n      S.impacts.push(reticleToImg());\n      drawOverlay();\n      updateLiveOverlay();\n      goStep('impact');\n    }, {style:'background:var(--teal);color:#0C0B0A'});\n    if(n>=2) addBtn(actions, 'Calculate \u2192', 'btn-sm', calculate);\n    if(n>0)  addBtn(actions, 'Undo Last', 'btn-ghost btn-sm', ()=>{S.impacts.pop();drawOverlay();updateLiveOverlay();goStep('impact');});\n    addBtn(actions, 'New Photo', 'btn-ghost btn-sm', reset);\n\n  } else if (step === 'done') {\n    // handled by results overlay\n  }\n}\n\nfunction setReticle(color, label) {\n  reticle.style.display='block';\n  reticle.style.color=color;\n  document.getElementById('reticle-ring').style.borderColor=color;\n  document.getElementById('reticle-h').style.background=color;\n  document.getElementById('reticle-v').style.background=color;\n  document.getElementById('reticle-label').style.color=color;\n  document.getElementById('reticle-label').textContent=label;\n  const ring = document.getElementById('reticle-ring');\n  const ringSize = 56;\n  ring.style.width=ringSize+'px'; ring.style.height=ringSize+'px';\n  const rh = document.getElementById('reticle-h');\n  const rv = document.getElementById('reticle-v');\n  const ext = ringSize + 20;\n  rh.style.width = ext+'px'; rh.style.left = '50%'; rh.style.marginLeft = (-ext/2)+'px';\n  rv.style.height = ext+'px'; rv.style.top = '50%'; rv.style.marginTop = (-ext/2)+'px';\n}\n\nfunction addBtn(parent, label, cls, fn, opts={}) {\n  const b=document.createElement('button');\n  b.textContent=label;\n  b.className='btn '+cls;\n  if(opts.style) b.style.cssText=opts.style;\n  b.addEventListener('click', fn);\n  parent.appendChild(b);\n  return b;\n}\n\n// \u2500\u2500 Calculate \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction calculate() {\n  const ppi=getPxPerInch();\n  if(!ppi||S.impacts.length<2) return;\n  const yards=S.distYards;\n\n  let maxD=0,fp=[0,1];\n  for(let i=0;i<S.impacts.length;i++)\n    for(let j=i+1;j<S.impacts.length;j++){\n      const dx=S.impacts[i].x-S.impacts[j].x, dy=S.impacts[i].y-S.impacts[j].y;\n      const d=Math.sqrt(dx*dx+dy*dy);\n      if(d>maxD){maxD=d;fp=[i,j];}\n    }\n\n  const esIn=maxD/ppi;\n  const mf=100/(yards*1.047);\n  const esMOA=esIn*mf;\n\n  const cx=S.impacts.reduce((s,p)=>s+p.x,0)/S.impacts.length;\n  const cy=S.impacts.reduce((s,p)=>s+p.y,0)/S.impacts.length;\n  const mrIn=S.impacts.reduce((s,p)=>{const dx=p.x-cx,dy=p.y-cy;return s+Math.sqrt(dx*dx+dy*dy);},0)/S.impacts.length/ppi;\n\n  document.getElementById('r-es-in').textContent=esIn.toFixed(3)+'\"';\n  document.getElementById('r-es-moa').textContent=esMOA.toFixed(2);\n  document.getElementById('r-shots').textContent=S.impacts.length;\n  document.getElementById('r-detail').innerHTML=\n    `<strong>Extreme Spread:</strong> ${esIn.toFixed(3)}\" &middot; ${esMOA.toFixed(2)} MOA &middot; shots ${fp[0]+1} &amp; ${fp[1]+1}<br>`+\n    `<strong>Mean Radius:</strong> ${mrIn.toFixed(3)}\" &middot; ${(mrIn*mf).toFixed(2)} MOA<br>`+\n    `<strong>Scale:</strong> ${ppi.toFixed(1)} px/in &middot; ${S.refDistIn}\" ref &middot; ${yards} yds`;\n\n  document.getElementById('results').style.display='block';\n\n  // Store calculated results for export\n  S.lastCalc = { esIn, esMOA, mrIn, mrMOA: mrIn*mf, fp, ppi, yards };\n\n  drawOverlay();\n  const a=imgToScreen(S.impacts[fp[0]].x,S.impacts[fp[0]].y);\n  const b=imgToScreen(S.impacts[fp[1]].x,S.impacts[fp[1]].y);\n  octx.beginPath(); octx.moveTo(a.x,a.y); octx.lineTo(b.x,b.y);\n  octx.strokeStyle='rgba(192,48,48,.8)'; octx.lineWidth=2;\n  octx.setLineDash([6,3]); octx.stroke(); octx.setLineDash([]);\n\n  showYardsInput();\n}\n\nfunction showYardsInput() {\n  const res=document.getElementById('results');\n  if(res.querySelector('#yards-row')) return;\n  const row=document.createElement('div');\n  row.id='yards-row';\n  row.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--sub)';\n  row.innerHTML='Distance: <input class=\"input-sm\" type=\"number\" id=\"yards-inp\" value=\"100\" min=\"1\" style=\"width:64px\"/> yards';\n  res.insertBefore(row, res.firstChild);\n  document.getElementById('yards-inp').addEventListener('change', e=>{\n    S.distYards=parseFloat(e.target.value)||100;\n    calculate();\n  });\n}\n\ndocument.getElementById('add-more').addEventListener('click',()=>{\n  document.getElementById('results').style.display='none';\n  goStep('impact');\n});\ndocument.getElementById('reset-btn').addEventListener('click', reset);\ndocument.getElementById('copy-btn').addEventListener('click', ()=>{\n  const es=document.getElementById('r-es-in').textContent;\n  const moa=document.getElementById('r-es-moa').textContent;\n  const shots=document.getElementById('r-shots').textContent;\n  const text=`GroupLY by Borely: ${es} / ${moa} MOA \u00b7 ${shots} shots \u00b7 ${S.distYards}yds`;\n  navigator.clipboard?.writeText(text).then(()=>{\n    const b=document.getElementById('copy-btn');\n    b.textContent='Copied!';\n    setTimeout(()=>b.textContent='Copy Results',2000);\n  });\n});\n\n// \u2500\u2500 Export / Save Image \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndocument.getElementById('export-btn').addEventListener('click', exportImage);\n\nfunction drawBorelyLogo(ctx, x, y, height) {\n  // Draw \"BORELY\" wordmark with the teal Y\n  const fontSize = height * 0.7;\n  ctx.save();\n  ctx.font = `800 ${fontSize}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;\n  ctx.textAlign = 'left';\n  ctx.textBaseline = 'middle';\n\n  // \"BORE\" in white\n  ctx.fillStyle = '#F0EDE8';\n  ctx.fillText('BORE', x, y);\n  const boreW = ctx.measureText('BORE').width;\n\n  // \"LY\" in teal\n  ctx.fillStyle = '#2EC4B6';\n  ctx.fillText('LY', x + boreW, y);\n\n  ctx.restore();\n  return boreW + ctx.measureText('LY').width;\n}\n\nfunction exportImage() {\n  if (!photo.naturalWidth || S.impacts.length < 2 || !S.lastCalc) return;\n  buildExportCanvas(dataUrl => {\n    const { esIn, esMOA, yards } = S.lastCalc;\n    const nShots = S.impacts.length;\n    fetch(dataUrl).then(r => r.blob()).then(blob => {\n      const file = new File([blob], `grouply-${Date.now()}.png`, { type: 'image/png' });\n      if (navigator.canShare && navigator.canShare({ files: [file] })) {\n        navigator.share({\n          files: [file],\n          title: 'GroupLY Result',\n          text: `${esIn.toFixed(3)}\" / ${esMOA.toFixed(2)} MOA \u00b7 ${nShots} shots \u00b7 ${yards}yds`\n        }).then(() => showToast('Image shared!'))\n          .catch(err => { if (err.name !== 'AbortError') fallbackDownload(blob); });\n      } else {\n        fallbackDownload(blob);\n      }\n    });\n  });\n}\n\n// \u2500\u2500 Build export canvas (used by both exportImage and saveToBorely) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\n// Draws photo + annotations + branded banner; calls callback(dataUrl: string)\nfunction buildExportCanvas(callback) {\n  if (!photo.naturalWidth || S.impacts.length < 2 || !S.lastCalc) return;\n  const iw = photo.naturalWidth, ih = photo.naturalHeight;\n  const ppi = S.lastCalc.ppi;\n  const calR = (S.caliberIn / 2) * ppi;\n  const ec = document.createElement('canvas');\n  ec.width = iw; ec.height = ih;\n  const ex = ec.getContext('2d');\n\n  // 1. Photo\n  ex.drawImage(photo, 0, 0, iw, ih);\n\n  // 2. Impact circles\n  S.impacts.forEach((pt, i) => {\n    ex.beginPath(); ex.arc(pt.x, pt.y, calR, 0, Math.PI * 2);\n    ex.fillStyle = 'rgba(46,196,182,0.18)'; ex.fill();\n    ex.strokeStyle = '#2EC4B6'; ex.lineWidth = Math.max(3, iw / 600); ex.stroke();\n    ex.beginPath(); ex.arc(pt.x, pt.y, Math.max(4, iw / 500), 0, Math.PI * 2);\n    ex.fillStyle = '#2EC4B6'; ex.fill();\n    const labelSize = Math.max(16, iw / 120);\n    ex.font = `bold ${labelSize}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;\n    ex.fillStyle = '#2EC4B6'; ex.textAlign = 'center';\n    ex.fillText(i + 1, pt.x, pt.y - calR - labelSize * 0.4);\n  });\n\n  // 3. ES line\n  const fp = S.lastCalc.fp;\n  const pa = S.impacts[fp[0]], pb = S.impacts[fp[1]];\n  ex.beginPath(); ex.moveTo(pa.x, pa.y); ex.lineTo(pb.x, pb.y);\n  ex.strokeStyle = 'rgba(192,48,48,0.8)'; ex.lineWidth = Math.max(3, iw / 500);\n  ex.setLineDash([Math.max(8, iw / 200), Math.max(4, iw / 400)]);\n  ex.stroke(); ex.setLineDash([]);\n\n  // 4. Bounding box\n  const xs = S.impacts.map(p => p.x), ys = S.impacts.map(p => p.y);\n  const bx0=Math.min(...xs)-calR, by0=Math.min(...ys)-calR;\n  const bx1=Math.max(...xs)+calR, by1=Math.max(...ys)+calR;\n  ex.strokeStyle='rgba(106,138,90,0.5)'; ex.lineWidth=Math.max(2,iw/800);\n  ex.setLineDash([Math.max(6,iw/250),Math.max(5,iw/300)]);\n  ex.strokeRect(bx0,by0,bx1-bx0,by1-by0); ex.setLineDash([]);\n\n  // 5. Branded banner\n  const bannerH=Math.max(100,ih*0.1), bannerY=ih-bannerH;\n  const pad=bannerH*0.15, fontSize=bannerH*0.22, smallFont=bannerH*0.15;\n  ex.fillStyle='rgba(12,11,10,0.82)'; ex.fillRect(0,bannerY,iw,bannerH);\n  ex.fillStyle='rgba(56,52,44,0.8)'; ex.fillRect(0,bannerY,iw,2);\n  ex.fillStyle='#2EC4B6'; ex.fillRect(0,bannerY,iw,Math.max(3,bannerH*0.03));\n  const logoFontSize=bannerH*0.55*0.42, logoY=bannerY+bannerH/2, logoX=pad*1.5;\n  ex.save();\n  ex.font=`800 ${logoFontSize}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;\n  ex.textAlign='left'; ex.textBaseline='middle';\n  ex.fillStyle='#F0EDE8'; ex.fillText('BORE',logoX,logoY-logoFontSize*0.35);\n  const boreW=ex.measureText('BORE').width;\n  ex.fillStyle='#2EC4B6'; ex.fillText('LY',logoX+boreW,logoY-logoFontSize*0.35);\n  ex.font=`600 ${logoFontSize*0.45}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;\n  ex.fillStyle='rgba(156,148,136,0.9)'; ex.fillText('GroupLY',logoX,logoY+logoFontSize*0.45);\n  ex.restore();\n  const { esIn, esMOA, mrIn, mrMOA, yards } = S.lastCalc;\n  const nShots=S.impacts.length, rX=iw-pad*1.5;\n  ex.textAlign='right';\n  ex.font=`bold ${fontSize*1.1}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;\n  ex.fillStyle='#F0EDE8'; ex.fillText(`${esIn.toFixed(3)}\"`,rX,bannerY+pad+fontSize*0.9);\n  ex.font=`bold ${fontSize*0.85}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;\n  ex.fillStyle='#2EC4B6'; ex.fillText(`${esMOA.toFixed(2)} MOA`,rX,bannerY+pad+fontSize*1.9);\n  ex.font=`${smallFont}px -apple-system,BlinkMacSystemFont,system-ui,sans-serif`;\n  ex.fillStyle='rgba(156,148,136,0.9)';\n  ex.fillText(`${nShots} shots \u00b7 ${yards} yds \u00b7 MR: ${mrIn.toFixed(3)}\" / ${mrMOA.toFixed(2)} MOA`,rX,bannerY+bannerH-pad*1.1);\n  const ctrX=iw/2, ctrY=bannerY+bannerH/2, iconR=bannerH*0.18;\n  ex.strokeStyle='rgba(106,138,90,0.35)'; ex.lineWidth=Math.max(2,bannerH*0.02);\n  ex.beginPath(); ex.arc(ctrX,ctrY,iconR,0,Math.PI*2); ex.stroke();\n  const armLen=iconR*1.4;\n  ex.beginPath();\n  ex.moveTo(ctrX-armLen,ctrY); ex.lineTo(ctrX-iconR*0.3,ctrY);\n  ex.moveTo(ctrX+iconR*0.3,ctrY); ex.lineTo(ctrX+armLen,ctrY);\n  ex.moveTo(ctrX,ctrY-armLen); ex.lineTo(ctrX,ctrY-iconR*0.3);\n  ex.moveTo(ctrX,ctrY+iconR*0.3); ex.lineTo(ctrX,ctrY+armLen);\n  ex.stroke();\n\n  callback(ec.toDataURL('image/jpeg', 0.88));\n}\n\nfunction fallbackDownload(blob) {\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = `grouply-${Date.now()}.png`;\n  document.body.appendChild(a);\n  a.click();\n  document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n  showToast('Image saved!');\n}\n\nfunction showToast(msg) {\n  const toast = document.getElementById('export-toast');\n  toast.textContent = msg;\n  toast.classList.add('show');\n  setTimeout(() => toast.classList.remove('show'), 2500);\n}\n\n// \u2500\u2500 Reset \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction reset() {\n  S.refs=[]; S.impacts=[]; S.scale=1; S.tx=0; S.ty=0;\n  S.lastCalc = null;\n  document.getElementById('results').style.display='none';\n  document.getElementById('group-overlay').style.display='none';\n  document.getElementById('viewport').style.display='none';\n  document.getElementById('panel').style.display='none';\n  document.getElementById('upload-zone').style.display='flex';\n  document.getElementById('file-input').value='';\n  document.getElementById('step-pill').textContent='Upload';\n  reticle.style.display='none';\n}\n\n// Initial\nS.distYards=100;\nS.lastCalc=null;\n\n// \u2500\u2500 Borely iframe init \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nif (IN_BORELY) {\n  // Show the \"Save to Session\" button\n  document.getElementById('save-to-borely-btn').style.display = 'inline-flex';\n  document.getElementById('save-to-borely-btn').style.alignItems = 'center';\n\n  // Hide the \"Upload\" step pill \u2014 not relevant in Borely flow\n  document.getElementById('step-pill').style.display = 'none';\n\n  // Add a close/cancel button to the header\n  const hdr = document.querySelector('header');\n  const closeBtn = document.createElement('button');\n  closeBtn.textContent = '\u2715 Cancel';\n  closeBtn.style.cssText = 'background:transparent;border:1px solid rgba(240,237,232,0.25);color:rgba(240,237,232,0.6);border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;letter-spacing:0.04em';\n  closeBtn.addEventListener('click', () => {\n    window.parent.postMessage({ type: 'grouply_cancel' }, '*');\n  });\n  hdr.appendChild(closeBtn);\n\n  // Replace the welcome screen with a minimal photo picker\n  const zone = document.getElementById('upload-zone');\n  zone.innerHTML = `\n    <div style=\"display:flex;flex-direction:column;align-items:center;gap:18px;padding:32px 24px;text-align:center;width:100%\">\n      <svg width=\"88\" height=\"88\" viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\">\n        <!-- Outer rings -->\n        <circle cx=\"50\" cy=\"50\" r=\"46\" fill=\"none\" stroke=\"#38342C\" stroke-width=\"1.5\"/>\n        <circle cx=\"50\" cy=\"50\" r=\"36\" fill=\"none\" stroke=\"#38342C\" stroke-width=\"1.5\"/>\n        <circle cx=\"50\" cy=\"50\" r=\"26\" fill=\"none\" stroke=\"rgba(46,196,182,0.4)\" stroke-width=\"1.5\"/>\n        <circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"none\" stroke=\"rgba(46,196,182,0.6)\" stroke-width=\"2\"/>\n        <!-- Bull -->\n        <circle cx=\"50\" cy=\"50\" r=\"7\" fill=\"#C03030\" opacity=\"0.85\"/>\n        <!-- Crosshair arms -->\n        <line x1=\"50\" y1=\"2\"  x2=\"50\" y2=\"32\" stroke=\"rgba(240,237,232,0.55)\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n        <line x1=\"50\" y1=\"68\" x2=\"50\" y2=\"98\" stroke=\"rgba(240,237,232,0.55)\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n        <line x1=\"2\"  y1=\"50\" x2=\"32\" y2=\"50\" stroke=\"rgba(240,237,232,0.55)\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n        <line x1=\"68\" y1=\"50\" x2=\"98\" y2=\"50\" stroke=\"rgba(240,237,232,0.55)\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n        <!-- Sample impact dots with teal rings -->\n        <circle cx=\"44\" cy=\"46\" r=\"4.5\" fill=\"none\" stroke=\"#2EC4B6\" stroke-width=\"1.8\" opacity=\"0.9\"/>\n        <circle cx=\"44\" cy=\"46\" r=\"1.2\" fill=\"#2EC4B6\"/>\n        <circle cx=\"56\" cy=\"52\" r=\"4.5\" fill=\"none\" stroke=\"#2EC4B6\" stroke-width=\"1.8\" opacity=\"0.9\"/>\n        <circle cx=\"56\" cy=\"52\" r=\"1.2\" fill=\"#2EC4B6\"/>\n        <circle cx=\"50\" cy=\"57\" r=\"4.5\" fill=\"none\" stroke=\"#2EC4B6\" stroke-width=\"1.8\" opacity=\"0.9\"/>\n        <circle cx=\"50\" cy=\"57\" r=\"1.2\" fill=\"#2EC4B6\"/>\n        <!-- ES line between farthest impacts -->\n        <line x1=\"44\" y1=\"46\" x2=\"56\" y2=\"52\" stroke=\"#C03030\" stroke-width=\"1.5\" stroke-dasharray=\"3,2\" opacity=\"0.7\"/>\n      </svg>\n      <div style=\"font-size:13px;color:rgba(156,148,136,0.85);line-height:1.65;max-width:270px\">Pan and zoom to place reference points and mark impacts on the photograph of your target.</div>\n      <label style=\"display:flex;align-items:center;justify-content:center;gap:8px;background:#2EC4B6;color:#0C0B0A;border:none;border-radius:8px;padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer;width:100%;max-width:280px;letter-spacing:0.04em\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z\"/><circle cx=\"12\" cy=\"13\" r=\"4\"/></svg>\n        Take or Choose Photo\n        <input type=\"file\" accept=\"image/*\" id=\"file-input-borely\" style=\"display:none\"/>\n      </label>\n      <div style=\"font-size:11px;color:rgba(92,88,80,0.85);line-height:1.6;max-width:270px;letter-spacing:0.01em\">Tip: Feature works best when photograph is taken 4\u201312\" from target, with the camera parallel to the target surface.</div>\n    </div>\n  `;\n\n  // Wire the new file input to the same handler as the original\n  document.getElementById('file-input-borely').addEventListener('change', e => {\n    const file = e.target.files[0];\n    if (!file) return;\n    const url = URL.createObjectURL(file);\n    photo.onload = () => {\n      zone.style.display = 'none';\n      vp.style.display = 'block';\n      document.getElementById('panel').style.display = 'block';\n      const go = document.getElementById('group-overlay');\n      go.style.display = 'none'; go.style.left = ''; go.style.top = ''; go.style.transform = '';\n      requestAnimationFrame(() => requestAnimationFrame(() => {\n        fitPhoto();\n        resizeOverlay();\n        goStep('ref1');\n      }));\n    };\n    photo.src = url;\n  });\n}\n\n// \u2500\u2500 Save to Borely \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\ndocument.getElementById('save-to-borely-btn').addEventListener('click', saveToBorely);\n\nfunction saveToBorely() {\n  if (!S.lastCalc) return;\n  const btn = document.getElementById('save-to-borely-btn');\n  btn.textContent = 'Rendering\u2026';\n  btn.disabled = true;\n\n  // Build the export canvas (same pipeline as exportImage)\n  buildExportCanvas(dataUrl => {\n    const { esIn, esMOA, mrIn, mrMOA, yards } = S.lastCalc;\n    const nShots = S.impacts.length;\n    window.parent.postMessage({\n      type: 'grouply_result',\n      esIn: parseFloat(esIn.toFixed(4)),\n      esMOA: parseFloat(esMOA.toFixed(3)),\n      mrIn: parseFloat(mrIn.toFixed(4)),\n      mrMOA: parseFloat(mrMOA.toFixed(3)),\n      yards,\n      nShots,\n      photo: dataUrl,\n    }, '*');\n    // Button feedback while parent closes modal\n    btn.textContent = '\u2713 Saved!';\n  });\n}\n\n<\/script>\n</body>\n</html>\n";

function App(){
  const importRef=useRef(null);
  const{w:vw}=useWindowSize();
  const wide=vw>=768,maxW=wide?Math.min(vw,960):vw,pad=wide?28:16;

  const toggleDark=()=>{const n=!darkMode;setDarkMode(n);document.body.style.background=n?DARK.bg:HC.bg;try{localStorage.setItem("borely_dark",n?"1":"0");}catch{}};
  useEffect(()=>{document.body.style.background=T.bg;},[darkMode]);

  useEffect(()=>{try{localStorage.setItem("borely_calibers",JSON.stringify(calibers));}catch{}},[calibers]);
  useEffect(()=>{try{localStorage.setItem("borely_loads",JSON.stringify(loads));}catch{}},[loads]);
  // ── GroupLY postMessage listener ────────────────────────────────────────

    // Standard formula: DA = alt + 120 × (OAT_C - ISA_C at altitude)

    const isaC=15-(altFt*0.001981);

  // ── Share / export a photo dataUrl via Web Share API or fallback anchor ───

    }

  };
  const addClean=()=>{const bid=fromDetail?activeId:fTgt;if(!bid)return;setEvents(p=>[...p,{id:uid(),barrelId:bid,type:"clean",date:cDate,solvents:cSolv.trim(),method:cMeth.trim(),passes:cPass?parseInt(cPass):null,observations:cObs.trim()}]);setModal(null);};
  const addCbto =()=>{const v=parseFloat(xVal);if(!activeId||isNaN(v)||v<=0)return;setEvents(p=>[...p,{id:uid(),barrelId:activeId,type:"cbto",date:xDate,measurement:v,comparator:xComp.trim(),caliper:xCal.trim(),notes:xNts.trim()}]);setModal(null);};
  const saveLoad=()=>{

  const delLoad  =id=>setLoads(p=>p.filter(l=>l.id!==id));
  const doTransfer=()=>{exportBarrelPack(barrel,events);setBarrels(p=>p.map(b=>b.id===activeId?{...b,status:"transferred",transferredDate:toLocalDate()}:b));setConfTransfer(false);};

  const handleImport=e=>{
    const file=e.target.files[0];if(!file)return;

    reader.onload=ev=>{try{const p=JSON.parse(ev.target.result);if(!p.throat_barrel_pack){alert("Not a valid Throat barrel pack.");return;}const nid=uid();setBarrels(pp=>[...pp,{...p.barrel,id:nid,status:"active",transferredDate:undefined}]);setEvents(pp=>[...pp,...p.events.map(ev=>({...ev,id:uid(),barrelId:nid}))]);}catch{alert("Could not read barrel pack.");}};

  // ── Form helpers — called as functions, NOT as JSX components ─────────────

  const lbl=s=><label style={A.lbl}>{s}</label>;

  const inp=(v,sv,ph)=><input style={A.inp} value={v} onChange={e=>sv(e.target.value)} placeholder={ph}/>;
  const inpM=(v,sv,ph)=><input style={A.inpM} value={v} onChange={e=>sv(e.target.value)} placeholder={ph} inputMode="decimal"/>;
  const ta=(v,sv,ph)=><textarea style={A.ta} value={v} onChange={e=>sv(e.target.value)} placeholder={ph}/>;

  const stepper=()=>(
    <>

  // Session form — called as sessionForm(), not <SessionForm/>
  const sessionForm=()=>(
    <>
      {editingEvId&&(
        <div style={{background:T.amberBg,border:`1px solid ${T.amberBdr}`,borderRadius:8,padding:"10px 14px",marginBottom:14,fontSize:12,color:T.amber,lineHeight:1.6}}>

        </div>
      )}
      {!editingEvId&&stepper()}
      {lbl("Date Fired")}
      {editingEvId
        ?<div style={{...A.inp,color:T.mut,cursor:"default"}}>{fmtDate(fDate)}</div>

      }

      {row2(col(2,<>{lbl("Powder")}{inp(fPow,setFPow,"e.g. H4350")}</>),col(1,<>{lbl("Charge (gr)")}{inpM(fChg,setFChg,"41.5")}</>))}
      {row2(col(1,<>{lbl("Primer")}{inp(fPrim,setFPrim,"Fed 210M")}</>),col(1,<>{lbl("Brass")}{inp(fBrass,setFBrass,"Lapua")}</>))}
      {row2(col(1,<>{lbl("COAL (in)")}{inpM(fCoal,setFCoal,"2.9100")}</>),col(1,<>{lbl("CBTO (in)")}{inpM(fSCbto,setFSCbto,"2.8450")}</>))}
      {fSCbto.trim()&&(

          <span style={{flexShrink:0}}>⚠️</span>

        <button onClick={()=>setFPhoto(null)} style={{position:"absolute",top:6,right:6,background:"rgba(10,9,8,.7)",border:"none",borderRadius:50,width:28,height:28,color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,lineHeight:1}}>×</button>
      </div>)}

        {wxLoading?"Fetching conditions…":"Get Current Conditions Near Your Location"}

      {row2(col(1,<>{lbl("Temperature (°F)")}{inpM(fTemp,setFTemp,"72")}</>),col(1,<>{lbl("Altitude (ft)")}{inpM(fAlt,setFAlt,"350")}</>))}
      {/* Auto-compute density altitude when both temp and alt are entered manually */}
      {fTemp&&fAlt&&!fDensityAlt&&(()=>{
        const da=calcDensityAlt(parseFloat(fTemp),parseFloat(fAlt));

        return null;

      {fDensityAlt&&(
        <div style={{background:T.bg,border:`1px solid ${T.bdr}`,borderRadius:6,padding:"8px 12px",marginTop:-10,marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontSize:11,color:T.sub}}>Density Altitude</div>
          <div style={{fontSize:13,fontFamily:T.mono,fontWeight:600,color:T.text}}>{parseInt(fDensityAlt).toLocaleString()} ft</div>
        </div>

      {lbl("Wind / Other Conditions")}{inp(fCond,setFCond,"e.g. 10mph NE, mirage moderate")}
      {lbl("Session Notes")}{ta(fNts,setFNts,"POI shifts, load behavior, barrel temp…")}
      {/* ── Group photo (manual attach fallback) ── */}
      {!fPhoto&&<div style={{marginBottom:14}}>
        {lbl("Group Photo (optional)")}
        <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,background:T.bg,border:`1px dashed ${T.bdr}`,borderRadius:8,padding:"16px",cursor:"pointer",fontSize:12,color:T.sub}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          Or attach photo from camera roll
          <input type="file" accept="image/*" style={{display:"none"}} onChange={e=>{
            const file=e.target.files?.[0];
            if(!file)return;
            const reader=new FileReader();
            reader.onload=ev=>{
              const img=new Image();
              img.onload=()=>{
                const canvas=document.createElement("canvas");
                const maxW=1200,maxH=1200;
                let w=img.width,h=img.height;
                if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
                if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}

    </>
  );

  const cbtoForm=()=>{
    // Detect comparator/caliper mismatch with previous readings
    const bCbtoReadings=events.filter(e=>e.barrelId===(fromDetail?activeId:fTgt)&&e.type==="cbto").sort((a,b)=>a.date.localeCompare(b.date));
    const lastReading=bCbtoReadings[bCbtoReadings.length-1];
    const mismatch=lastReading&&xComp.trim()&&lastReading.comparator&&xComp.trim().toLowerCase()!==lastReading.comparator.toLowerCase();
    const caliperMismatch=lastReading&&xCal.trim()&&lastReading.caliper&&xCal.trim().toLowerCase()!==lastReading.caliper.toLowerCase();
    return(
    <>
      {/* Educational warning */}
      <div style={{background:T.amberBg,border:`1px solid ${T.amberBdr}`,borderRadius:8,padding:"12px 14px",marginBottom:16}}>
        <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
          <span style={{fontSize:16,lineHeight:1,flexShrink:0}}>⚠️</span>
          <div style={{fontSize:12,color:T.amber,lineHeight:1.65}}>
            <b>Comparator readings are relative, not absolute.</b> CBTO measurements are only meaningful when compared using the <b>exact same comparator insert and caliper</b> every time. Changing tools between readings will corrupt your erosion trend data.
          </div>
        </div>
      </div>
      {lbl("CBTO to Lands (inches)")}
      <input style={A.inpBig} value={xVal} onChange={e=>setXVal(e.target.value)} placeholder="2.8450" inputMode="decimal"/>
      {lbl("Date Measured")}
      <input type="date" max={toLocalDate()} value={xDate} onChange={e=>setXDate(e.target.value)} style={A.inpDate}/>
      {lbl("Comparator Insert *")}
      {inp(xComp,setXComp,lastReading?.comparator||"e.g. Hornady Lock-N-Load, .284 insert")}
      {mismatch&&(
        <div style={{fontSize:11,color:T.danger,marginTop:-10,marginBottom:10,lineHeight:1.5}}>
          ⚠ This differs from your previous comparator ({lastReading.comparator}). This will break your trend data.
        </div>
      )}
      {lbl("Caliper *")}
      {inp(xCal,setXCal,lastReading?.caliper||"e.g. Mitutoyo 500-196-30")}
      {caliperMismatch&&(
        <div style={{fontSize:11,color:T.danger,marginTop:-10,marginBottom:10,lineHeight:1.5}}>
          ⚠ This differs from your previous caliper ({lastReading.caliper}). This will break your trend data.
        </div>
      )}
      {!xComp.trim()&&<div style={{fontSize:11,color:T.mut,marginTop:-10,marginBottom:10}}>* Required for data integrity</div>}

            const W=Math.min(vw-48,560),H=140,pl=50,pr=12,pt=10,pb=28;
            const renderCbtoChart=()=>{
              if(cbtoSorted.length<2)return(
                <div style={{background:T.bg,border:`1px solid ${T.bdr}`,borderRadius:10,padding:"28px 20px",textAlign:"center"}}>

                </div>

              });

              const sy=v=>pt+(1-(v-y0)/(y1-y0||1))*(H-pt-pb);
              const pts2=cbtoPts.map(p=>({cx:sx(p.cumRnds),cy:sy(p.erosion)}));
              const path=pts2.map((p,i)=>`${i===0?"M":"L"}${p.cx.toFixed(1)},${p.cy.toFixed(1)}`).join(" ");
              const latest=cbtoPts[cbtoPts.length-1];

                <div style={{background:T.bg,border:`1px solid ${T.bdr}`,borderRadius:10,padding:"16px 16px 12px",marginBottom:14}}>

                  </div>
                  <svg width={W} height={H} style={{overflow:"visible",display:"block"}}>
                    {[0,0.5,1].map(f=>(
                      <g key={f}>
                        <line x1={pl} y1={pt+f*(H-pt-pb)} x2={W-pr} y2={pt+f*(H-pt-pb)} stroke={T.bdr} strokeWidth="0.5"/>
                        <text x={pl-4} y={pt+f*(H-pt-pb)+3} fontSize="9" fill={T.mut} textAnchor="end">{`+${(y1-f*(y1-y0)).toFixed(3)}"`}</text>
                      </g>
                    ))}
                    <text x={pl} y={H} fontSize="9" fill={T.mut}>{x0.toLocaleString()}</text>
                    <text x={W-pr} y={H} fontSize="9" fill={T.mut} textAnchor="end">{x1.toLocaleString()}</text>
                    <path d={path} fill="none" stroke={T.amber} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                    {pts2.map((p,i)=><circle key={i} cx={p.cx} cy={p.cy} r="3.5" fill={T.amber} stroke={T.bg} strokeWidth="1.5"/>)}
                    <line x1={pl} y1={H-pb} x2={W-pr} y2={H-pb} stroke={T.bdr} strokeWidth="0.5"/>

                  <div style={{fontSize:9,color:T.mut,marginTop:4,textTransform:"uppercase",letterSpacing:"0.08em"}}>Cumulative rounds →</div>

                  </div>

                        const filteredLoads=loads.filter(l=>expCalibers.includes(l.caliberId));
                        const filteredCals=calibers.filter(c=>expCalibers.includes(c.id));
                        exportLoadPDF(filteredLoads,filteredCals,null,BORELY_LOGO_URI);
                      }} style={{flex:1,background:T.acc,color:"#fff",border:"none",borderRadius:6,padding:"10px",fontSize:12,fontWeight:600,cursor:"pointer"}}>↓ PDF ({expCalibers.length})</button>
                      <button onClick={()=>{
                        const filteredLoads=loads.filter(l=>expCalibers.includes(l.caliberId));
                        const filteredCals=calibers.filter(c=>expCalibers.includes(c.id));
                        exportLoadCSV(filteredLoads,filteredCals,null);
                      }} style={{flex:1,background:"transparent",border:`1px solid ${T.bdr}`,borderRadius:6,color:T.sub,padding:"10px",fontSize:12,cursor:"pointer"}}>↓ CSV ({expCalibers.length})</button>
                    </div>
                  )}
                </>
              )}

            </div>
          </div>
        </div>
      )}

      {/* ── Confirm delete caliber ── */}
      {confDelCal&&(()=>{
        const cal=calibers.find(c=>c.id===confDelCal);
        const loadCount=loads.filter(l=>l.caliberId===confDelCal).length;
        const barrelCount=barrels.filter(b=>cal&&b.caliber&&b.caliber.trim().toLowerCase()===cal.name.trim().toLowerCase()).length;
        return(
          <div style={{position:"fixed",inset:0,background:"rgba(10,9,8,.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:"0 24px"}}>
            <div style={{background:T.surf,border:`1px solid ${T.danger}`,borderRadius:14,padding:"28px 24px",width:"100%",maxWidth:340}}>
              <div style={{fontSize:15,fontWeight:700,color:T.text,marginBottom:10}}>Delete caliber?</div>
              <p style={{fontSize:13,color:T.sub,lineHeight:1.65,marginBottom:6}}>
                Permanently deletes <b style={{color:T.text}}>{cal?cal.name:"this caliber"}</b>
                {loadCount>0&&<> and <b style={{color:T.text}}>{loadCount} load{loadCount!==1?"s":""}</b> associated with it</>}.
              </p>
              {barrelCount>0&&(
                <div style={{background:T.amberBg,border:`1px solid ${T.amberBdr}`,borderRadius:6,padding:"10px 14px",marginBottom:10,fontSize:12,color:T.amber,lineHeight:1.6}}>
                  ⚠ <b>{barrelCount} barrel{barrelCount!==1?"s":""}</b> use this caliber. Their caliber field will be cleared.
                </div>
              )}
              <p style={{fontSize:12,color:T.danger,marginBottom:20,fontWeight:500}}>⚠ This cannot be undone.</p>
              <button style={{...A.btnP,background:T.danger,marginBottom:8}} onClick={()=>{delCaliber(confDelCal);setConfDelCal(null);}}>Delete</button>
              <button style={A.btnG} onClick={()=>setConfDelCal(null)}>Cancel</button>
            </div>
          </div>
        );
      })()}

      {/* ── Confirm delete load ── */}
      {confDelLoad&&(()=>{
        const load=loads.find(l=>l.id===confDelLoad);
        return(
          <div style={{position:"fixed",inset:0,background:"rgba(10,9,8,.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:"0 24px"}}>
            <div style={{background:T.surf,border:`1px solid ${T.danger}`,borderRadius:14,padding:"28px 24px",width:"100%",maxWidth:340}}>
              <div style={{fontSize:15,fontWeight:700,color:T.text,marginBottom:10}}>Delete load?</div>
              <p style={{fontSize:13,color:T.sub,lineHeight:1.65,marginBottom:6}}>
                Permanently deletes <b style={{color:T.text}}>{load?load.name||load.bullet||"this load":"this load"}</b> from your load library.
              </p>
              <p style={{fontSize:12,color:T.danger,marginBottom:20,fontWeight:500}}>⚠ This cannot be undone.</p>
              <button style={{...A.btnP,background:T.danger,marginBottom:8}} onClick={()=>{delLoad(confDelLoad);setConfDelLoad(null);}}>Delete</button>
              <button style={A.btnG} onClick={()=>setConfDelLoad(null)}>Cancel</button>
            </div>
          </div>
        );
      })()}

      {/* ── Photo lightbox ── */}
      {photoLightbox&&(
        <div onClick={()=>setPhotoLightbox(null)} style={{position:"fixed",inset:0,zIndex:300,background:"rgba(0,0,0,0.92)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:16}}>
          <img src={photoLightbox} onClick={e=>e.stopPropagation()} style={{maxWidth:"100%",maxHeight:"76vh",borderRadius:8,objectFit:"contain",display:"block"}} alt="Group photo"/>
          <div onClick={e=>e.stopPropagation()} style={{display:"flex",gap:10,marginTop:16,flexWrap:"wrap",justifyContent:"center"}}>
            <button onClick={()=>sharePhoto(photoLightbox)} style={{background:"#2EC4B6",color:"#0C0B0A",border:"none",borderRadius:8,padding:"11px 22px",fontSize:14,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
              Share / Save
            </button>
            <button onClick={()=>setPhotoLightbox(null)} style={{background:"transparent",border:"1px solid rgba(240,237,232,0.25)",color:"rgba(240,237,232,0.7)",borderRadius:8,padding:"11px 22px",fontSize:14,cursor:"pointer"}}>
              Close
            </button>
          </div>
          <div style={{fontSize:11,color:"rgba(240,237,232,0.35)",marginTop:10,letterSpacing:"0.06em"}}>Tap outside to close</div>
        </div>
      )}

      {/* ── GroupLY full-screen modal ── */}
      {groupLYOpen&&(
        <div style={{position:"fixed",inset:0,zIndex:200,background:T.bg,display:"flex",flexDirection:"column"}}>
          <iframe
            src={groupLYSrc||""}
            title="GroupLY Group Measurement"
            style={{flex:1,border:"none",width:"100%",height:"100%"}}
            allow="camera"
          />
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
